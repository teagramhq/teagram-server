# Disposable-only overrides for the public WebSocket proof. The local blob
# backend itself comes from docker-compose.local-blobs.yml, as in deployment.
services:
  teagramd:
    environment:
      # Keep the public route's base socket-trust listener at its production
      # count of one; only the dedicated public listeners need two replicas.
      TG_REPLICA_COUNT: "1"
    # The proof reaches the stack only through public-haproxy. Publishing the
    # base listener would collide with any stack already holding 2443 on the
    # runner.
    ports: !override []

  teagramd-public-1:
    environment:
      TG_RATE_LIMIT_KEY_EXCHANGE_IP: "2"
      TG_RATE_LIMIT_KEY_EXCHANGE_IP_WINDOW: 1h

  teagramd-public-2:
    environment:
      TG_RATE_LIMIT_KEY_EXCHANGE_IP: "2"
      TG_RATE_LIMIT_KEY_EXCHANGE_IP_WINDOW: 1h

  public-haproxy:
    ports: !override
      - "127.0.0.1:${TG_PUBLIC_HAPROXY_HOST_PORT:-2446}:2446"
