name: Deploy demo.

run-name: ${{ inputs.issue && format('{0} [{1}]{2}', github.workflow, inputs.issue, inputs.web_rollback_run_id && format(' [web-rollback={0}]', inputs.web_rollback_run_id) || '') || '' }}

# Keep demo and dev deployments separate from each other and from server Deploy.
# Each caller queue holds target resolution through that target's deployment.
on:
  workflow_run:
    workflows: [Deploy.]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      issue:
        description: Multica issue key for this direct demo deploy
        required: true
        type: string
      web_rollback_run_id:
        description: Exact older live web publication run ID to allow; leave empty for no rollback
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Hold this slot across the target lookup, web build, and both publication steps.
  deploy-demo:
    name: 'deploy: demo'
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: deploy-teagram-demo-target
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/deploy-demo-target.yml
    with:
      issue: ${{ inputs.issue || '' }}
      web_rollback_run_id: ${{ inputs.web_rollback_run_id || '' }}
    secrets: inherit

  # Hold this independent slot from before target lookup through the dev rollout.
  deploy-dev:
    name: 'deploy: dev'
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: deploy-teagram-dev-target
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/deploy-dev-target.yml
    with:
      issue: ${{ inputs.issue || '' }}
    secrets: inherit
