name: Recover cancelled PR checks

on:
  workflow_dispatch:
    inputs:
      cancelled_pr_run_targets:
        description: Space-separated workflow file, run ID, and creation timestamp for checks cancelled to prioritize main CI
        required: false
        type: string
        default: ""
      issue:
        description: Multica issue key that requested this recovery
        required: true
        type: string
      main_run_id:
        description: Main CI workflow run whose aggregate must finish before recovery
        required: true
        type: string

permissions:
  contents: read

jobs:
  ops-rerun-cancelled-pr-ci:
    name: 'ops: rerun-cancelled-pr-ci'
    runs-on: ubuntu-26.04
    timeout-minutes: 210
    permissions:
      actions: write
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Wait for main CI and re-run current PR checks
        env:
          GH_TOKEN: ${{ github.token }}
          CANCELLED_PR_RUN_TARGETS: ${{ inputs.cancelled_pr_run_targets }}
          ISSUE: ${{ inputs.issue }}
          MAIN_RUN_ID: ${{ inputs.main_run_id }}
        run: bash .github/scripts/recover-cancelled-pr-checks.sh
