name: Recover cancelled PR CI

on:
  workflow_dispatch:
    inputs:
      cancelled_pr_run_ids:
        description: Space-separated workflow run IDs cancelled to prioritize main CI
        required: true
        type: string
      issue:
        description: Multica issue key that requested this recovery
        required: true
        type: string

permissions:
  contents: read

jobs:
  rerun-cancelled-pr-ci:
    name: Re-run cancelled pull request CI
    runs-on: ubuntu-26.04
    timeout-minutes: 210
    permissions:
      actions: write

    steps:
      - name: Wait for cancellation cleanup and re-run PR CI
        env:
          GH_TOKEN: ${{ github.token }}
          CANCELLED_PR_RUN_IDS: ${{ inputs.cancelled_pr_run_ids }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          # Cancellation cleanup can take longer than the 2h12m main-run queue
          # delay observed during this incident; allow up to three hours.
          max_status_checks=181
          read -r -a cancelled_pr_run_ids <<< "$CANCELLED_PR_RUN_IDS"
          for run_id in "${cancelled_pr_run_ids[@]}"; do
            if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
              echo "::warning::Ignoring invalid cancelled pull request CI run id."
              continue
            fi
            run_state=""
            for ((status_check_attempt = 1; status_check_attempt <= max_status_checks; status_check_attempt++)); do
              if ! run_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '[.status, (.conclusion // "")] | @tsv' 2>/dev/null)"; then
                run_state=""
              fi
              if [[ "$run_state" == $'completed\tcancelled' || "$run_state" == completed$'\t'* ]]; then
                break
              fi
              if (( status_check_attempt < max_status_checks )); then
                sleep 60
              fi
            done
            if [[ "$run_state" != $'completed\tcancelled' ]]; then
              if [[ "$run_state" == completed$'\t'* ]]; then
                echo "Pull request CI run ${run_id} is ${run_state}; no rerun is needed."
              else
                echo "::warning::Could not confirm cancelled pull request CI run ${run_id} after ${max_status_checks} status checks; rerun it manually if its check remains cancelled. Issue: $ISSUE"
              fi
              continue
            fi
            if ! gh run rerun "$run_id" --repo "$GITHUB_REPOSITORY"; then
              echo "::warning::Could not re-run cancelled pull request CI run ${run_id}; rerun it manually if its check remains cancelled. Issue: $ISSUE"
            fi
          done
