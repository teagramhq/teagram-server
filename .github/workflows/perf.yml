name: RPC performance

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'internal/api/**'
      - 'internal/blob/**'
      - 'internal/catalog/**'
      - 'internal/config/**'
      - 'internal/discovery/**'
      - 'internal/keycrypt/**'
      - 'internal/linklanding/**'
      - 'internal/mtproto/**'
      - 'internal/peerhash/**'
      - 'internal/pgtest/**'
      - 'internal/photohash/**'
      - 'internal/photothumb/**'
      - 'internal/photowire/**'
      - 'internal/reactionassets/**'
      - 'internal/rsakey/**'
      - 'internal/srp/**'
      - 'internal/stickerbundle/**'
      - 'internal/stickervalidation/**'
      - 'internal/store/**'
      - 'migrations/**'
      - 'test/perf/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/scripts/perf-*'
      - '.github/scripts/test_perf_run.py'
      - '.github/workflows/perf.yml'
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue key to report this run to (e.g. MAIN-123). Leave empty for no report."
        required: false
        type: string
        default: ""

permissions:
  contents: read

# PR performance checks share the main CI queue and wait for its fan-out.
concurrency:
  group: ${{ github.event_name == 'pull_request' && 'CI-main' || format('RPC performance-run-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

env:
  PERF_PG_CONTAINER: perf-pg
  PERF_PG_URL: postgres://postgres:perf@localhost:5432/
  PERF_CACHE: ${{ github.workspace }}/.perf-cache
  PERF_HISTORY: ${{ github.workspace }}/.perf-history

jobs:
  # Main always looks up and refills the snapshot cache, even when its public
  # release already exists. V2 adds seed provenance; v1 caches predate that
  # metadata and cannot be published safely. PRs prefer v2, reuse v1 for
  # measurement only, and seed when both miss.
  test-perf-fixture-snapshot:
    name: 'test: perf-fixture-snapshot'
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: write
    outputs:
      release_exists: ${{ steps.release.outputs.exists }}
      release_draft: ${{ steps.release.outputs.draft }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Track both the fixture writer and server setup helper: either can
      # change the seeded data. Migrations apply on top of restored data.
      - name: Check for an existing fixture release
        id: release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_VERSION: ${{ hashFiles('test/perf/fixture_test.go', 'test/perf/server_test.go') }}
        run: |
          tag="perf-fixture-$FIXTURE_VERSION"
          release=$(python3 -B .github/scripts/perf_fixture_release.py lookup "$tag")
          echo "exists=$(jq -r '.exists' <<<"$release")" >>"$GITHUB_OUTPUT"
          echo "draft=$(jq -r '.draft' <<<"$release")" >>"$GITHUB_OUTPUT"

      - name: Look up the snapshot
        id: snapshot
        uses: actions/cache/restore@v6.1.0
        with:
          path: .perf-cache
          key: perf-fixture-v2-${{ hashFiles('test/perf/fixture_test.go', 'test/perf/server_test.go') }}
          lookup-only: true

      - uses: actions/setup-go@v7.0.0
        if: steps.snapshot.outputs.cache-hit != 'true'
        with:
          go-version-file: go.mod
          cache: false

      - uses: ariga/setup-atlas@v0.3
        if: steps.snapshot.outputs.cache-hit != 'true'
        with:
          version: v1.2.0

      - name: Start Postgres
        if: steps.snapshot.outputs.cache-hit != 'true'
        run: bash .github/scripts/perf-postgres.sh

      - name: Seed fixtures
        id: seed
        if: steps.snapshot.outputs.cache-hit != 'true'
        run: bash .github/scripts/perf-run.sh seed

      - name: Record snapshot metadata
        if: steps.snapshot.outputs.cache-hit != 'true'
        env:
          FIXTURE_VERSION: ${{ hashFiles('test/perf/fixture_test.go', 'test/perf/server_test.go') }}
        run: |
          newest_revision=
          for fixture in 1x 100x; do
            revision=$(docker exec "$PERF_PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d "perf_$fixture" -qAt \
              -c 'SELECT version FROM atlas_schema_revisions.atlas_schema_revisions ORDER BY version DESC LIMIT 1')
            if [ -z "$revision" ]; then
              echo "::error::No migration revision found in perf_$fixture"
              exit 1
            fi
            if [ -z "$newest_revision" ] || [[ "$revision" > "$newest_revision" ]]; then
              newest_revision=$revision
            fi
          done
          jq -n \
            --arg fixture "$FIXTURE_VERSION" \
            --arg server_commit "$GITHUB_SHA" \
            --arg migration_revision "$newest_revision" \
            '{fixture: $fixture, server_commit: $server_commit, migration_revision: $migration_revision}' \
            > .perf-cache/.fixture-metadata.json

      - name: Store the snapshot
        if: steps.snapshot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .perf-cache
          key: perf-fixture-v2-${{ hashFiles('test/perf/fixture_test.go', 'test/perf/server_test.go') }}

      - name: Report fixture snapshot infrastructure failure
        if: failure() && steps.seed.outcome != 'failure'
        run: |
          echo "::error title=RPC performance fixture snapshot infrastructure failure::Fixture snapshot setup or storage failed before measurement."
          {
            echo "## RPC performance fixture snapshot infrastructure failure"
            echo
            echo "Fixture snapshot setup or storage failed before measurement. Check the failed workflow step for its cause."
          } >>"$GITHUB_STEP_SUMMARY"

  publish-perf-fixture:
    name: 'publish: perf-fixture'
    needs: test-perf-fixture-snapshot
    if: >-
      github.ref == 'refs/heads/main' &&
      (needs.test-perf-fixture-snapshot.outputs.release_exists != 'true' || needs.test-perf-fixture-snapshot.outputs.release_draft == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    concurrency:
      group: perf-fixture-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Recheck release after acquiring the publisher slot
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_VERSION: ${{ hashFiles('test/perf/fixture_test.go', 'test/perf/server_test.go') }}
        run: |
          tag="perf-fixture-$FIXTURE_VERSION"
          release=$(python3 -B .github/scripts/perf_fixture_release.py lookup "$tag")
          echo "exists=$(jq -r '.exists' <<<"$release")" >>"$GITHUB_OUTPUT"
          echo "draft=$(jq -r '.draft' <<<"$release")" >>"$GITHUB_OUTPUT"

      - name: Restore the fixture snapshot
        id: snapshot
        if: steps.release.outputs.exists != 'true' || steps.release.outputs.draft == 'true'
        uses: actions/cache/restore@v6.1.0
        with:
          path: .perf-cache
          key: perf-fixture-v2-${{ hashFiles('test/perf/fixture_test.go', 'test/perf/server_test.go') }}

      - name: Require the cached snapshot
        if: steps.release.outputs.exists != 'true' || steps.release.outputs.draft == 'true'
        run: |
          if [ "${{ steps.snapshot.outputs.cache-hit }}" != true ]; then
            echo "::error::Fixture snapshot cache is missing; refusing to publish an empty fixture release"
            exit 1
          fi

      - name: Require snapshot seed metadata
        if: steps.release.outputs.exists != 'true' || steps.release.outputs.draft == 'true'
        run: |
          if [ ! -s .perf-cache/.fixture-metadata.json ]; then
            echo "::error::Fixture snapshot cache has no seed provenance; refusing to publish an inaccurate server_commit"
            exit 1
          fi

      - name: Build release assets and manifest
        id: assets
        if: steps.release.outputs.exists != 'true' || steps.release.outputs.draft == 'true'
        run: |
          python3 .github/scripts/build-perf-fixture-release.py \
            --snapshot .perf-cache \
            --metadata .perf-cache/.fixture-metadata.json \
            --output "$RUNNER_TEMP/perf-fixture-assets"

      - name: Publish complete fixture release
        if: steps.release.outputs.exists != 'true' || steps.release.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_VERSION: ${{ hashFiles('test/perf/fixture_test.go', 'test/perf/server_test.go') }}
        run: |
          python3 -B .github/scripts/perf_fixture_release.py publish \
            "perf-fixture-$FIXTURE_VERSION" "$GITHUB_SHA" "$RUNNER_TEMP/perf-fixture-assets"

  # Keep verification independent of publication so every main run can retry
  # anonymous downloads against an already-published release.
  check-perf-fixture-release:
    name: 'check: perf-fixture-release'
    needs:
      - test-perf-fixture-snapshot
      - publish-perf-fixture
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.test-perf-fixture-snapshot.result == 'success' &&
      (needs.publish-perf-fixture.result == 'success' || needs.publish-perf-fixture.result == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify anonymous fixture asset downloads
        env:
          FIXTURE_VERSION: ${{ hashFiles('test/perf/fixture_test.go', 'test/perf/server_test.go') }}
        run: >-
          python3 -B .github/scripts/verify_perf_fixture_release.py
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/perf-fixture-$FIXTURE_VERSION"

  # Runs beside test-go and finishes well inside it, so it adds no time to
  # the server's CI.
  test-rpc-performance:
    name: 'test: rpc-performance'
    needs: test-perf-fixture-snapshot
    if: ${{ !cancelled() && needs.test-perf-fixture-snapshot.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: write
    env:
      PERF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      PERF_RECORD: ${{ github.event_name == 'push' && 'main' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # The base commit is checked out into a worktree and measured in the
          # same job.
          fetch-depth: 0

      # A queued pull_request run can check out a merge ref with a newer base
      # than the event's base.sha. Compare against the merge ref's first parent.
      - name: Resolve PR comparison base
        if: github.event_name == 'pull_request'
        run: echo "PERF_BASE_SHA=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"

      - name: Check Postgres readiness probe
        run: bash .github/scripts/test-perf-postgres-readiness.sh

      - name: Test invalid performance base SHA handling
        run: python3 -B .github/scripts/test_perf_run.py

      - name: Restore the snapshot
        id: snapshot
        uses: actions/cache/restore@v6.1.0
        with:
          path: .perf-cache
          key: perf-fixture-v2-${{ hashFiles('test/perf/fixture_test.go', 'test/perf/server_test.go') }}

      - name: Restore legacy cache for PR measurements
        id: legacy-snapshot
        if: github.event_name == 'pull_request' && steps.snapshot.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6.1.0
        with:
          path: .perf-cache
          key: perf-fixture-${{ hashFiles('test/perf/fixture_test.go', 'test/perf/server_test.go') }}

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go modules
        if: steps.snapshot.outputs.cache-hit == 'true' || steps.legacy-snapshot.outputs.cache-hit == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-

      - uses: ariga/setup-atlas@v0.3
        with:
          version: v1.2.0

      # Earlier main runs, one aggregated report each, set the noise bands.
      - name: Restore main's history
        uses: actions/cache/restore@v6.1.0
        with:
          path: .perf-history
          key: perf-history-${{ github.run_id }}
          restore-keys: perf-history-

      - name: Verify fixture restore provisions cluster roles
        run: bash .github/scripts/test-perf-restore-role.sh

      - name: Start Postgres
        run: bash .github/scripts/perf-postgres.sh

      - name: Restore fixtures
        id: restore-fixtures
        if: steps.snapshot.outputs.cache-hit == 'true' || steps.legacy-snapshot.outputs.cache-hit == 'true'
        run: bash .github/scripts/perf-run.sh restore

      - name: Seed fixtures from this branch
        id: seed-fixtures
        if: steps.snapshot.outputs.cache-hit != 'true' && steps.legacy-snapshot.outputs.cache-hit != 'true'
        run: bash .github/scripts/perf-run.sh seed

      - name: Measure base and head
        id: measure
        env:
          FIXTURE_VERSION: ${{ hashFiles('test/perf/fixture_test.go', 'test/perf/server_test.go') }}
        run: bash .github/scripts/perf-run.sh measure

      - name: Keep main's history
        if: github.event_name == 'push' && always()
        uses: actions/cache/save@v6.1.0
        with:
          path: .perf-history
          key: perf-history-${{ github.run_id }}

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rpc-performance
          path: ${{ runner.temp }}/perf/*.json
          if-no-files-found: ignore

      - name: Report RPC performance infrastructure failure
        if: failure() && steps.measure.outcome != 'failure' && steps.restore-fixtures.outcome != 'failure' && steps.seed-fixtures.outcome != 'failure'
        run: |
          echo "::error title=RPC performance infrastructure failure::Setup, cache, or report handling failed before a performance verdict."
          {
            echo "## RPC performance infrastructure failure"
            echo
            echo "Setup, cache, or report handling failed before a performance verdict. Check the failed workflow step for its cause."
          } >>"$GITHUB_STEP_SUMMARY"
