name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Main pushes keep one running and the newest pending check; PR updates supersede older checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Testcontainers rewrites Docker Hub pulls through Google's public mirror.
env:
  TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io

# PR runs can restore default-branch cache scopes. Keep large Go and BuildKit
# snapshots on main instead of creating a separate copy for every PR.
jobs:
  ops-prioritize-main:
    name: 'ops: prioritize-main'
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      cancelled_pr_run_targets: ${{ steps.cancel-queued-pr-runs.outputs.cancelled_pr_run_targets }}
    permissions:
      actions: write

    steps:
      - name: Cancel queued pull request CI runs
        id: cancel-queued-pr-runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cancelled_pr_run_targets=""
          publish_cancelled_pr_run_targets() {
            printf 'cancelled_pr_run_targets=%s\n' "${cancelled_pr_run_targets% }" >> "$GITHUB_OUTPUT"
          }

          if ! runs="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=pull_request&status=queued&per_page=100" \
            --jq '.workflow_runs[]? | [.id, .created_at] | @tsv' 2>/dev/null)"; then
            echo "::warning::Could not list queued pull request CI runs; continuing without cancellation."
            publish_cancelled_pr_run_targets
            exit 0
          fi
          if [[ -z "$runs" ]]; then
            echo "No queued pull request CI runs."
            publish_cancelled_pr_run_targets
            exit 0
          fi
          while IFS=$'\t' read -r run_id run_created_at; do
            [[ -n "$run_id" ]] || continue
            [[ "$run_id" =~ ^[0-9]+$ ]] || {
              echo "::warning::Ignoring invalid pull request workflow run id."
              continue
            }
            [[ "$run_created_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$ ]] || {
              echo "::warning::Ignoring pull request CI run ${run_id} with an invalid creation timestamp."
              continue
            }
            if ! run_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null)"; then
              echo "::warning::Could not check pull request CI run ${run_id}; continuing."
              continue
            fi
            if [[ "$run_status" != queued ]]; then
              echo "Leaving pull request CI run ${run_id} in status ${run_status}."
              continue
            fi
            if ! started_jobs="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              --jq '.jobs[]? | select(.status == "in_progress" or (.status == "completed" and .conclusion != "skipped")) | .id' 2>/dev/null)"; then
              echo "::warning::Could not check jobs for pull request CI run ${run_id}; leaving it alone."
              continue
            fi
            if [[ -n "$started_jobs" ]]; then
              echo "Leaving pull request CI run ${run_id}; it has started jobs."
              continue
            fi
            if gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY"; then
              cancelled_pr_run_targets+="${run_id}:${run_created_at} "
            else
              echo "::warning::Could not cancel queued pull request CI run ${run_id}; it may have started or been superseded."
            fi
          done <<< "$runs"
          publish_cancelled_pr_run_targets

  ops-dispatch-pr-ci-recovery:
    name: 'ops: dispatch-pr-ci-recovery'
    needs:
      - ops-prioritize-main
    # Evaluate the PR-only skip before main prioritization can cancel a queued
    # PR run. Main fan-out jobs share the priority dependency and unlock here.
    if: ${{ always() && (needs.ops-prioritize-main.result == 'success' || (needs.ops-prioritize-main.result == 'skipped' && github.event_name == 'pull_request')) && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ops-prioritize-main.outputs.cancelled_pr_run_targets != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
      - name: Dispatch cancelled pull request CI recovery
        env:
          GH_TOKEN: ${{ github.token }}
          CANCELLED_PR_RUN_TARGETS: ${{ needs.ops-prioritize-main.outputs.cancelled_pr_run_targets }}
        run: |
          set -euo pipefail
          if ! gh workflow run recover-cancelled-pr-ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f issue=MAIN-2765 \
            -f "cancelled_pr_run_targets=$CANCELLED_PR_RUN_TARGETS"; then
            echo "::warning::Could not dispatch recovery for cancelled pull request CI runs: $CANCELLED_PR_RUN_TARGETS"
          fi
  check-sticker-license:
    name: 'check: sticker-license'
    needs: ops-prioritize-main
    if: ${{ (github.event_name == 'pull_request' && !cancelled() || github.event_name != 'pull_request' && always()) && (needs.ops-prioritize-main.result == 'success' || (needs.ops-prioritize-main.result == 'skipped' && github.event_name == 'pull_request')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # This cache is keyed by every input that can change the output bundle.
      # PRs can restore the main-branch snapshot, while a changed pin or
      # generator gets one fresh build and cache entry.
      - name: Restore sticker bundle snapshot
        id: sticker-bundle-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/sticker-bundle
          key: sticker-bundle-${{ runner.os }}-node22-python3.12.15-${{ hashFiles('tools/stickerbundle/generate.sh', 'tools/stickerbundle/generate.py', 'tools/stickerbundle/render.mjs', 'tools/stickerbundle/sources.json', 'tools/stickerbundle/package.json', 'tools/stickerbundle/package-lock.json') }}

      - uses: actions/setup-node@v7.0.0
        if: steps.sticker-bundle-cache.outputs.cache-hit != 'true'
        with:
          node-version: 22

      - uses: actions/setup-python@v6.0.0
        if: steps.sticker-bundle-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12.15"

      - name: Generate pinned sticker bundle on cache miss
        if: steps.sticker-bundle-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: tools/stickerbundle/generate.sh --output "$RUNNER_TEMP/sticker-bundle"

      - name: Gate bundle licenses and report cache state
        run: |
          test -s "$RUNNER_TEMP/sticker-bundle/manifest.json"
          go run ./cmd/stickerbundle-check "$RUNNER_TEMP/sticker-bundle"
          packs=$(jq '.packs | length' "$RUNNER_TEMP/sticker-bundle/manifest.json")
          bytes=$(du -sb "$RUNNER_TEMP/sticker-bundle" | cut -f1)
          echo "cache hit: ${{ steps.sticker-bundle-cache.outputs.cache-hit == 'true' }}"
          echo "bundle packs: $packs"
          echo "bundle bytes: $bytes"
          {
            echo '### Sticker bundle cache'
            echo "- Cache hit: ${{ steps.sticker-bundle-cache.outputs.cache-hit == 'true' }}"
            echo "- Packs: $packs"
            echo "- Bytes: $bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sticker bundle for image jobs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sticker-catalogue-bundle
          path: ${{ runner.temp }}/sticker-bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  lint-go:
    name: 'lint: go'
    needs: ops-prioritize-main
    if: ${{ (github.event_name == 'pull_request' && !cancelled() || github.event_name != 'pull_request' && always()) && (needs.ops-prioritize-main.result == 'success' || (needs.ops-prioritize-main.result == 'skipped' && github.event_name == 'pull_request')) }}
    runs-on: ubuntu-26.04
    # Keep lint's timeout aligned with its former step in ci.
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Test Docker Hub mirror routing
        run: python3 .github/scripts/test_docker_image_mirror.py

      - name: Test RPC performance fixture restore ACL handling
        run: python3 .github/scripts/test_perf_restore.py

      - name: Test performance fixture release builder
        run: python3 -B .github/scripts/test_build_perf_fixture_release.py

      - name: Test performance fixture release publishing and recovery
        run: python3 -B .github/scripts/test_perf_fixture_release.py

      - name: Test anonymous performance fixture release verification
        run: python3 -B .github/scripts/test_verify_perf_fixture_release.py

      - name: Test base image pull retries
        run: python3 .github/scripts/test_pull_base_images.py

      - name: Test Playwright apt install budget
        run: python3 .github/scripts/test_playwright_apt_timeout.py

      - name: Test Playwright apt retry cache
        run: python3 .github/scripts/test_playwright_apt_cache.py

      - name: Test Actions cache write policy
        run: python3 .github/scripts/test_actions_cache_policy.py

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0

      - name: Check formatting
        run: make lint-format

  lint-sql:
    name: 'lint: sql'
    needs: ops-prioritize-main
    if: ${{ (github.event_name == 'pull_request' && !cancelled() || github.event_name != 'pull_request' && always()) && (needs.ops-prioritize-main.result == 'success' || (needs.ops-prioritize-main.result == 'skipped' && github.event_name == 'pull_request')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12.15"

      - name: Install pinned SQLFluff
        run: |
          python -m venv .venv-sqlfluff
          .venv-sqlfluff/bin/python -m pip install --require-hashes -r tools/sqlfluff-requirements.txt
          test "$(.venv-sqlfluff/bin/sqlfluff --version)" = "sqlfluff, version 4.3.0"

      - name: Test SQL lint selection and rules
        env:
          SQLFLUFF_BIN: ${{ github.workspace }}/.venv-sqlfluff/bin/sqlfluff
        run: .venv-sqlfluff/bin/python -m unittest discover -s .github/scripts -p 'test_sql_lint.py'

      - name: Lint query sources and new migrations
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          .venv-sqlfluff/bin/python .github/scripts/sql_lint.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --sqlfluff .venv-sqlfluff/bin/sqlfluff

  test-git-hooks:
    name: 'test: git-hooks'
    needs: ops-prioritize-main
    if: ${{ (github.event_name == 'pull_request' && !cancelled() || github.event_name != 'pull_request' && always()) && (needs.ops-prioritize-main.result == 'success' || (needs.ops-prioritize-main.result == 'skipped' && github.event_name == 'pull_request')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Test commit message validation and merge exemptions
        run: bash test/githooks/commit-msg-merge.sh

      - name: Test selective pre-push checks
        run: python3 -B .github/scripts/test_git_hooks.py

  test-browser-acceptance:
    name: 'test: browser-acceptance'
    needs: ops-prioritize-main
    if: ${{ (github.event_name == 'pull_request' && !cancelled() || github.event_name != 'pull_request' && always()) && (needs.ops-prioritize-main.result == 'success' || (needs.ops-prioritize-main.result == 'skipped' && github.event_name == 'pull_request')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install locked runtime test dependencies
        run: npm ci --prefix deploy/browser-acceptance --ignore-scripts --no-audit --no-fund

      - name: Enable protected regular files for cross-UID lock test
        run: sudo sysctl -w fs.protected_regular=1

      - name: Test browser acceptance runtime and observer
        run: node --test deploy/browser-acceptance/*.test.mjs

      - name: Test wrapper input validation with BusyBox 1.37.0
        run: bash .github/scripts/run-busybox-phase-check.sh browser-wrapper

      - name: Check added JavaScript modules
        run: for file in deploy/browser-acceptance/*.mjs; do node --check "$file"; done

      - name: Render isolated browser Compose policy
        env:
          SECCOMP_PROFILE: ${{ github.workspace }}/deploy/browser-acceptance/seccomp-browser.json
        run: |
          docker compose --env-file /dev/null --project-directory deploy/browser-acceptance --file deploy/browser-acceptance/compose.yaml config --format json >"$RUNNER_TEMP/browser-acceptance-compose.json"
          jq -e '
            .name == "teagram-browser-acceptance"
            and (.services | keys | sort) == ["browser", "observer"]
            and all(.services[]; .read_only == true)
            and all(.services[]; .cap_drop == ["ALL"])
            and all(.services[]; "no-new-privileges:true" as $required | (.security_opt | index($required)) != null)
            and all(.services[]; any(.security_opt[]; startswith("seccomp=")))
            and all(.services[]; .logging.driver == "none")
            and all(.services[]; .mem_limit == .memswap_limit)
            and all(.services[]; (.ulimits | has("core")) and (.ulimits.core.soft // 0) == 0 and (.ulimits.core.hard // 0) == 0)
            and all(.services[]; ((.ports // []) | length) == 0)
            and all(.services[]; ((.volumes // []) | length) == 0)
            and all(.services[]; ((.cap_add // []) | length) == 0)
            and all(.services[]; .privileged == null or .privileged == false)
            and (.services.browser.networks | keys) == ["browser-internal"]
            and (.services.observer.networks | keys | sort) == ["browser-internal", "observer-egress"]
            and (.networks["browser-internal"].internal == true)
            and (.networks["observer-egress"].driver == "bridge")
            and (.services.browser.depends_on.observer.condition == "service_healthy")
            and (.services.browser.environment.NODE_USE_ENV_PROXY == "1")
            and (.services.browser.environment.HTTP_PROXY == "http://browser-observer:3128")
            and (.services.browser.environment.HTTPS_PROXY == "http://browser-observer:3128")
            and (.services.browser.environment.NO_PROXY == "browser-observer,localhost,127.0.0.1")
            and (.services.browser.build.args.PLAYWRIGHT_IMAGE | test("@sha256:(cf0daee9b994042e011bc29f20cdff1a9f682a039b43fcd738f7d8a9d3bcd9d6|824f1a789072e648c62541c2cfa4479c4061a290d5c27766d67dc1dcbc19b321)$"))
            and (.services.browser.platform == "linux/arm64")
          ' "$RUNNER_TEMP/browser-acceptance-compose.json"

  build-browser-acceptance-image:
    name: 'build: browser-acceptance-image (${{ matrix.arch }})'
    needs:
      - ops-prioritize-main
      - test-browser-acceptance
    if: ${{ (github.event_name == 'pull_request' && !cancelled() || github.event_name != 'pull_request' && always()) && (needs.ops-prioritize-main.result == 'success' || (needs.ops-prioritize-main.result == 'skipped' && github.event_name == 'pull_request')) && needs.test-browser-acceptance.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            platform: linux/amd64
            image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:cf0daee9b994042e011bc29f20cdff1a9f682a039b43fcd738f7d8a9d3bcd9d6
          - arch: arm64
            runner: ubuntu-26.04-arm
            platform: linux/arm64
            image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:824f1a789072e648c62541c2cfa4479c4061a290d5c27766d67dc1dcbc19b321

    env:
      PLAYWRIGHT_PLATFORM: ${{ matrix.platform }}
      PLAYWRIGHT_IMAGE: ${{ matrix.image }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      SECCOMP_PROFILE: ${{ github.workspace }}/deploy/browser-acceptance/seccomp-browser.json

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Restrict copied build inputs to root-only 0600
        run: |
          mapfile -t sources < <(sed -n 's/^COPY \(.*\) [^ ]*$/\1/p' deploy/browser-acceptance/Dockerfile | tr ' ' '\n')
          [ "${#sources[@]}" -gt 0 ]
          sudo chmod 0600 "${sources[@]}"
          sudo chown root:root "${sources[@]}"

      - name: Build pinned ${{ matrix.platform }} runtime image
        run: |
          sudo docker build --pull --platform "$PLAYWRIGHT_PLATFORM" \
            --build-arg "PLAYWRIGHT_IMAGE=$PLAYWRIGHT_IMAGE" \
            --tag teagram-browser-acceptance:local \
            --file deploy/browser-acceptance/Dockerfile .

      - name: Image files are readable but not writable by the runtime user
        run: |
          docker run --rm --entrypoint node teagram-browser-acceptance:local --input-type=module -e '
            import { accessSync, constants, readdirSync } from "node:fs";
            import { join } from "node:path";
            const can = (path, mode) => { try { accessSync(path, mode); return true; } catch { return false; } };
            const failures = [];
            const visit = (path, directory) => {
              if (!can(path, directory ? constants.R_OK | constants.X_OK : constants.R_OK)) failures.push(`unreadable ${path}`);
              if (can(path, constants.W_OK)) failures.push(`writable ${path}`);
              if (!directory) return;
              for (const entry of readdirSync(path, { withFileTypes: true })) {
                if (!entry.isSymbolicLink()) visit(join(path, entry.name), entry.isDirectory());
              }
            };
            visit("/opt/browser-acceptance", true);
            if (failures.length > 0) {
              console.error(failures.slice(0, 50).join("\n"));
              process.exit(1);
            }
          '

      - name: Resolve Playwright from the mounted QA runner path
        run: |
          compose=(docker compose --env-file /dev/null --project-directory deploy/browser-acceptance --file deploy/browser-acceptance/compose.yaml --project-name teagram-browser-acceptance)
          resolved="$("${compose[@]}" run --no-deps --rm -T \
            --volume "$PWD/deploy/browser-acceptance/private-browser-acceptance-v2.mjs:/opt/browser-acceptance/approved-qa.mjs:ro" \
            --entrypoint node browser --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { createRequire } from "node:module";
              const target = "/opt/browser-acceptance/approved-qa.mjs";
              readFileSync(target);
              createRequire(target).resolve("playwright");
              console.log("qa-runner-resolves-playwright");
            ')"
          "${compose[@]}" down >/dev/null 2>&1 || true
          [ "$resolved" = "qa-runner-resolves-playwright" ]

      - name: Smoke sandbox, denied CONNECT, browser egress isolation, and real readiness
        run: |
          compose=(docker compose --env-file /dev/null --project-directory deploy/browser-acceptance --file deploy/browser-acceptance/compose.yaml --project-name teagram-browser-acceptance)
          cleanup() { "${compose[@]}" down --rmi local >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          "${compose[@]}" up --detach --wait observer
          if result="$("${compose[@]}" run --no-deps --rm -T browser network-smoke)"; then
            :
          else
            printf '%s\n' "$result" >&2
            exit 1
          fi
          expected='{"status":"network_smoke_passed","blocked_telegram_org_attempts":1,"blocked_telegram_org_dns_lookups":0,"blocked_telegram_org_upstream_connects":0,"direct_tcp_blocked":true,"chromium_sandbox_proved":true,"renderer_user_namespace_isolated":true,"renderer_pid_namespace_isolated":true,"observer_target_host":"teagram.tailaa4918.ts.net","payloads_retained":0}'
          if [ "$result" != "$expected" ]; then
            printf '%s\n' "$result" >&2
            exit 1
          fi
          printf '%s\n' "$result"
          readiness="$("${compose[@]}" run --no-deps --rm -T \
            --volume "$PWD/deploy/browser-acceptance/private-browser-acceptance-v2.mjs:/opt/browser-acceptance/approved-qa.mjs:ro" \
            --entrypoint node browser /opt/browser-acceptance/readiness-integration-smoke.mjs)"
          printf '%s\n' "$readiness"
          printf '%s\n' "$readiness" | jq -e --arg expected_arch "$EXPECTED_ARCH" '
            .status == "readiness_integration_passed"
            and .architecture == $expected_arch
            and .positive.status == "ready"
            and .positive.http_status == 200
            and .positive.browser_wss_status == 101
            and .positive.observer_allowed_connects > 0
            and .positive.observer_blocked_requests == 0
            and .delayed_wss_observation_ms >= 3000
            and .delayed_wss_observation_ms < 10000
            and .multiple_matching_connections == "ready"
            and .manifest_mismatch == "manifest-mismatch"
            and .manifest_before_app_mismatch == "manifest-mismatch"
            and .asset_502 == "asset-server-error"
            and .no_target == {"status":"error","code":"websocket-not-ready","wss_diagnostic":"no-target","wss_targets":0,"wss_handshakes":0,"wss_target_match":false,"wss_status":0}
            and .no_target_observation_ms >= 10000
            and .no_target_observation_ms < 15000
            and (
              ($expected_arch == "arm64"
                and .failed_wss_associated_handshake_event == false
                and .failed_wss_error_line == "{\"status\":\"error\",\"code\":\"websocket-not-ready\",\"wss_diagnostic\":\"socket-1-no-handshake\",\"wss_targets\":1,\"wss_handshakes\":0,\"wss_target_match\":true,\"wss_status\":0}")
              or ($expected_arch == "amd64" and (
                (.failed_wss_associated_handshake_event == false
                  and .failed_wss_error_line == "{\"status\":\"error\",\"code\":\"websocket-not-ready\",\"wss_diagnostic\":\"socket-1-no-handshake\",\"wss_targets\":1,\"wss_handshakes\":0,\"wss_target_match\":true,\"wss_status\":0}")
                or (.failed_wss_associated_handshake_event == true
                  and .failed_wss_error_line == "{\"status\":\"error\",\"code\":\"websocket-not-ready\",\"wss_diagnostic\":\"socket-1-handshake-not-101\",\"wss_targets\":1,\"wss_handshakes\":1,\"wss_target_match\":true,\"wss_status\":503}")
              ))
            )
            and .path_mismatch == {"status":"error","code":"websocket-not-ready","wss_diagnostic":"socket-1-target-mismatch","wss_targets":1,"wss_handshakes":1,"wss_target_match":false,"wss_status":101}
            and .query_mismatch == {"status":"error","code":"websocket-not-ready","wss_diagnostic":"socket-1-target-mismatch","wss_targets":1,"wss_handshakes":1,"wss_target_match":false,"wss_status":101}
            and .no_handshake_held == {"status":"error","code":"websocket-not-ready","wss_diagnostic":"socket-1-no-handshake","wss_targets":1,"wss_handshakes":0,"wss_target_match":true,"wss_status":0}
            and .no_handshake_destroyed == {"status":"error","code":"websocket-not-ready","wss_diagnostic":"socket-1-no-handshake","wss_targets":1,"wss_handshakes":0,"wss_target_match":true,"wss_status":0}
            and .mixed_status.status == "error"
            and .mixed_status.code == "websocket-not-ready"
            and .mixed_status.wss_targets == 2
            and .mixed_status.wss_target_match == true
            and (
              ((.mixed_status.wss_diagnostic | test("^socket-[12]-no-handshake$"))
                and .mixed_status.wss_handshakes == 1
                and .mixed_status.wss_status == 0)
              or ((.mixed_status.wss_diagnostic | test("^socket-[12]-handshake-not-101$"))
                and .mixed_status.wss_handshakes == 2
                and .mixed_status.wss_status == 503)
            )
            and .mixed_target.status == "error"
            and .mixed_target.code == "websocket-not-ready"
            and .mixed_target.wss_diagnostic == "socket-2-target-mismatch"
            and .mixed_target.wss_targets == 2
            and .mixed_target.wss_target_match == false
            and (
              .mixed_target.wss_status == 0
              or (.mixed_target.wss_status == 101 and .mixed_target.wss_handshakes > 0)
            )
            and .shared_worker == "ready"
            and .dedicated_worker == "ready"
            and .nested_worker == "ready"
            and .nested_worker_mismatch.status == "error"
            and .nested_worker_mismatch.code == "websocket-not-ready"
            and .nested_worker_mismatch.wss_diagnostic == "socket-2-target-mismatch"
            and .nested_worker_mismatch.wss_targets == 2
            and .nested_worker_mismatch.wss_target_match == false
            and (
              .nested_worker_mismatch.wss_status == 0
              or (.nested_worker_mismatch.wss_status == 101 and .nested_worker_mismatch.wss_handshakes > 0)
            )
            and .shared_worker_mismatch == {"status":"error","code":"websocket-not-ready","wss_diagnostic":"socket-1-target-mismatch","wss_targets":1,"wss_handshakes":1,"wss_target_match":false,"wss_status":101}
            and (
              .shared_worker_silent == {"status":"error","code":"websocket-not-ready","wss_diagnostic":"no-target","wss_targets":0,"wss_handshakes":0,"wss_target_match":false,"wss_status":0}
              or .shared_worker_silent == {"status":"error","code":"websocket-not-ready","wss_diagnostic":"worker-unobservable","wss_targets":0,"wss_handshakes":0,"wss_target_match":false,"wss_status":0}
            )
            and .qa_shared_worker == "ready"
            and .qa_dedicated_worker == "ready"
            and .qa_nested_worker == "ready"
            and .qa_nested_worker_mismatch == "websocket-not-ready"
            and .qa_shared_worker_mismatch == "websocket-not-ready"
            and .qa_shared_worker_silent == "websocket-not-ready"
            and .payloads_retained == 0
          '

  test-go:
    name: 'test: go'
    needs: ops-prioritize-main
    if: ${{ (github.event_name == 'pull_request' && !cancelled() || github.event_name != 'pull_request' && always()) && (needs.ops-prioritize-main.result == 'success' || (needs.ops-prioritize-main.result == 'skipped' && github.event_name == 'pull_request')) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write
    # Preparation took 17m in the latest CI run. Leave room for the full 20m
    # E2E limit, eight minutes for diagnostics and cleanup, and five minutes
    # of variance.
    timeout-minutes: 50

    env:
      # Ryuk is testcontainers' reaper: it kills the containers of a test
      # session once the last test binary disconnects from it. Every test binary
      # keeps a TCP connection to it open for its whole life, and that
      # connection goes to Ryuk's *published* port, i.e. through docker-proxy —
      # the same docker-proxy that drops connections under load, which is why
      # pgtest talks to Postgres on the bridge IP instead (MAIN-154, MAIN-156).
      # Ryuk has no such escape hatch: drop its last connection and it SIGKILLs
      # the shared tg-test-pg container out from under the test binaries still
      # using it, which surfaces as "terminating connection due to unexpected
      # postmaster exit" (57P01) and then "no route to host" for the rest of the
      # e2e suite (MAIN-160).
      #
      # The runner is destroyed at the end of the job, so there is nothing for a
      # reaper to reap here; it is pure risk. Leave it on locally, where a leaked
      # container does outlive the run.
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # internal/pgtest builds its template database by reading migrations/ at
      # run time, so Go records that directory and those files as test inputs —
      # and a recorded input is hashed with its stat, modification time
      # included. A fresh checkout stamps a new mtime every run, so the two
      # packages that read them (internal/pgtest, internal/store) would miss the
      # test cache on every run while every other package hit it. Pinning the
      # timestamps makes the recorded input identical from run to run. The
      # children first, then the directory: adding or removing a migration still
      # changes the directory's own size and listing, so a real change is still
      # seen.
      - name: Pin migration timestamps for the test cache
        run: touch -d @0 migrations/* migrations

      # Split module and build caches so module data follows go.sum while the
      # build/test snapshot is refreshed each main run. PRs can restore the
      # default-branch snapshot without saving another large copy under their
      # own ref.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Module downloads are a pure function of go.sum, so an exact key is right
      # here and a stale-prefix restore is harmless: `go mod download` fills in
      # whatever the restore key missed.
      - name: Cache Go modules
        uses: actions/cache@v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-

      # The run-specific key makes the restore miss exactly and load the newest
      # cache for this go.sum through the prefix. Only main saves the richer
      # snapshot produced by this run.
      - name: Restore Go build and test results
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-

      - name: Build
        run: go build ./...

      - name: Set up Buildx for link-edge image checks
        uses: docker/setup-buildx-action@v4.4.1
        with:
          driver: docker

      - name: Pull the base images
        timeout-minutes: 10
        run: >-
          bash .github/scripts/pull-base-images.sh deploy/link-edge/Dockerfile

      # Keep the link edge as its own Compose project and build both restricted
      # images in CI. The explicit empty env file keeps server credentials out
      # of Compose interpolation during validation.
      - name: Render isolated link edge Compose projection
        env:
          TG_INVITE_WEB_SIGNUP_URL: https://web.example.invalid/signup
          TG_INVITE_DESKTOP_URL: ''
        run: |
          docker compose --env-file /dev/null --project-directory deploy/link-edge --file deploy/link-edge/compose.yaml config --format json >"$RUNNER_TEMP/link-edge-compose.json"
          jq -e '
            (.services | keys | sort) == ["linklanding", "selector"]
            and all(.services[]; .read_only == true)
            and all(.services[]; .cap_drop == ["ALL"])
            and all(.services[]; "no-new-privileges:true" as $required | (.security_opt | index($required)) != null)
            and all(.services[]; .user == "65532:65532")
            and all(.services[]; ((.volumes // []) | length) == 0)
            and all(.services[]; ((.secrets // []) | length) == 0)
            and all(.services[]; ((.env_file // []) | length) == 0)
            and (.services.linklanding.environment == {"TG_INVITE_WEB_SIGNUP_URL":"https://web.example.invalid/signup","TG_INVITE_DESKTOP_URL":""})
            and (.services.selector.environment == {"TG_INVITE_WEB_SIGNUP_URL":"https://web.example.invalid/signup","TG_INVITE_DESKTOP_URL":""})
            and all([.services.web, .services.probe][]; ((.environment // {}) | length) == 0)
            and all(.services[]; .network_mode == null)
            and all(.services[]; .mem_limit == null)
            and all(.services[]; .pids_limit == null)
            and all(.services[]; .restart == "unless-stopped")
            and all(.services[]; .logging.driver == "json-file")
            and all(.services[]; .logging.options["max-size"] == "10m")
            and all(.services[]; .logging.options["max-file"] == "3")
            and (.services.linklanding.networks | keys) == ["landing-publish", "private-edge"]
            and (.services.selector.networks | keys) == ["private-edge", "web-edge"]
            and ((.services.linklanding.build.args | keys) == ["EDGE_IMAGE_REVISION", "EDGE_IMAGE_SOURCE"])
            and ((.services.selector.build.args | keys) == ["EDGE_IMAGE_REVISION", "EDGE_IMAGE_SOURCE"])
            and (.services.linklanding.ports | length) == 1
            and (.services.linklanding.ports[0].host_ip == "127.0.0.1")
            and (.services.linklanding.ports[0].target == 8082)
            and (.services.linklanding.ports[0].published == "8082")
            and (.services.selector.ports | length) == 1
            and (.services.selector.ports[0].host_ip == "127.0.0.1")
            and (.services.selector.ports[0].target == 8081)
            and (.services.selector.ports[0].published == "8081")
            and (.services.linklanding.healthcheck.test == ["CMD", "/usr/local/bin/linkprobe", "landing"])
            and (.services.selector.healthcheck.test == ["CMD", "/usr/local/bin/linkprobe", "selector"])
            and ((.services.linklanding.depends_on // {}) | length) == 0
            and ((.services.selector.depends_on | keys) == ["linklanding"])
            and ((.volumes // {}) | length) == 0
            and ((.secrets // {}) | length) == 0
            and (.networks["private-edge"].internal == true)
            and (.networks["landing-publish"].driver == "bridge")
            and ((.networks["landing-publish"].internal // false) == false)
            and (.networks["landing-publish"].driver_opts["com.docker.network.bridge.enable_ip_masquerade"] == "false")
            and (.networks["web-edge"].external == true)
            and (.networks["web-edge"].name == "teagram-web-edge-net")
          ' "$RUNNER_TEMP/link-edge-compose.json"

      - name: build
        run: bash .github/scripts/ci-main-phase.sh build

      - name: label-check
        run: bash .github/scripts/ci-main-phase.sh label-check

      - name: Build and verify isolated link edge image provenance
        env:
          EDGE_IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          EDGE_IMAGE_REVISION: ${{ github.sha }}
          TG_INVITE_WEB_SIGNUP_URL: https://web.example.invalid/signup
          TG_INVITE_DESKTOP_URL: ''
        run: |
          test "$(git rev-parse HEAD)" = "$EDGE_IMAGE_REVISION"
          test -z "$(git status --porcelain)"
          docker compose --env-file /dev/null --project-directory deploy/link-edge --file deploy/link-edge/compose.yaml build
          for image in teagram-linklanding:local teagram-linkselector:local; do
            source=$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')
            revision=$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            test "$source" = "$EDGE_IMAGE_SOURCE"
            test "$revision" = "$EDGE_IMAGE_REVISION"
          done

      - name: Reject invalid isolated link edge provenance
        env:
          EDGE_IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          EDGE_IMAGE_REVISION: ${{ github.sha }}
          TG_INVITE_WEB_SIGNUP_URL: https://web.example.invalid/signup
          TG_INVITE_DESKTOP_URL: ''
        run: |
          compose=(docker compose --env-file /dev/null --project-directory deploy/link-edge --file deploy/link-edge/compose.yaml)
          output_file="$RUNNER_TEMP/link-edge-provenance-rejection.log"
          expect_rejection() {
            name="$1"
            omitted_value="$2"
            shift 2
            if "${compose[@]}" build "$@" >"$output_file" 2>&1; then
              echo "$name was accepted"
              exit 1
            fi
            if ! grep -Fq 'invalid edge image provenance' "$output_file"; then
              echo "$name did not reach Dockerfile provenance validation"
              exit 1
            fi
            if grep -Fq "$omitted_value" "$output_file"; then
              echo "$name input appeared in build logs"
              exit 1
            fi
          }
          expect_rejection malformed-revision not-a-sha \
            --build-arg EDGE_IMAGE_REVISION=not-a-sha
          source_with_at='https://fake-user@github.com/teagramhq/teagram-server'
          expect_rejection credential-bearing-source "$source_with_at" \
            --build-arg "EDGE_IMAGE_SOURCE=$source_with_at"
          wrong_source='https://github.com/teagramhq/not-the-server'
          expect_rejection wrong-source "$wrong_source" \
            --build-arg "EDGE_IMAGE_SOURCE=$wrong_source"

      - name: Verify landing loopback publication on the Docker daemon
        env:
          TG_INVITE_WEB_SIGNUP_URL: https://web.example.invalid/signup
          TG_INVITE_DESKTOP_URL: ''
        run: |
          compose=(docker compose --env-file /dev/null --project-directory deploy/link-edge --file deploy/link-edge/compose.yaml)
          docker network create teagram-web-edge-net
          cleanup() {
            "${compose[@]}" down --remove-orphans
            docker network rm teagram-web-edge-net
          }
          trap cleanup EXIT
          "${compose[@]}" up --detach --wait linklanding
          landing_id=$("${compose[@]}" ps --quiet linklanding)
          docker port "$landing_id" 8082/tcp | grep -Fxq '127.0.0.1:8082'
          ss -ltn 'sport = :8082'
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8082/syntheticname

      - name: Measure flat parts directory ceiling
        run: PARTS_DIR_CEILING_PROBE=1 go test -count=1 -timeout 30m ./internal/blob/ -run TestFlatPartsDirEntryCeiling -v

      # Testcontainers pulls mirror.gcr.io/postgres:18-alpine. Pre-pull it with
      # bounded retries so transient mirror misses are caught before package tests.
      #
      # Keep the cached non-E2E command in the Makefile unchanged. The remaining
      # E2E invocation runs once with the same race/count/timeout/package
      # settings, excluding fixtures and adding JSON output for diagnostics.
      - name: Pre-pull the shared PostgreSQL test image with retry
        run: bash .github/scripts/pull-base-images.sh --image mirror.gcr.io/postgres:18-alpine

      - name: Test non-E2E packages
        run: make test-unit

      - name: Test end-to-end suite with diagnostics
        run: bash .github/scripts/run-e2e-diagnostics.sh

      # The suite talks to one shared Postgres container, so when that container
      # dies mid-run every remaining test fails with a connection error and the
      # log says nothing about why it died. These three answer that: the exit
      # code and OOMKilled flag say who killed it, the Postgres log says whether
      # it shut down on its own, and the free memory rules resources in or out.
      - name: Postgres container state on failure
        if: failure()
        run: |
          docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}} oomkilled={{.State.OOMKilled}} error={{.State.Error}}' tg-test-pg || echo "container gone"
          docker logs --tail 50 tg-test-pg 2>&1 || true
          free -m

      # This job already restored and used the previous snapshot. Remove older
      # Go snapshots before saving this run's unique key so they cannot crowd
      # out the fixture caches when the repository is near its cache limit.
      - name: Prune previous Go build snapshots
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GO_BUILD_CACHE_KEY: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 .github/scripts/prune_go_build_cache.py

      - name: Save Go build and test results
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}

  test-real-server-fixtures:
    name: 'test: real-server-fixtures'
    needs: ops-prioritize-main
    if: ${{ (github.event_name == 'pull_request' && !cancelled() || github.event_name != 'pull_request' && always()) && (needs.ops-prioritize-main.result == 'success' || (needs.ops-prioritize-main.result == 'skipped' && github.event_name == 'pull_request')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Pre-pull the shared PostgreSQL test image with retry
        run: bash .github/scripts/pull-base-images.sh --image mirror.gcr.io/postgres:18-alpine

      - name: Pin migration timestamps for the test cache
        run: touch -d @0 migrations/* migrations

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The main CI lane owns cache writes. This lane restores the same caches
      # without racing its save when both jobs miss an exact key.
      - name: Restore Go modules
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-

      # Keep module download messages out of the JSON stream consumed by the fixture gate.
      - name: Download Go modules
        run: go mod download

      - name: Restore Go build and test results
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      # The negative-control pair uses this exact historical revision's producer.
      # The immutable revision key preserves provenance; on a miss the producer
      # still runs and only takes longer.
      - name: Restore the fixture web producer store
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/teagram-real-server-fixture/pnpm-store
          key: teagram-fixture-pnpm-store-09373cc2713d31e93664c38a4fd0335ea37a5f01-node24
          restore-keys: teagram-fixture-pnpm-store-

      # As in the build-server-image job: the fixture's `docker build` then finds its
      # mirrored Node base locally. The Playwright base comes from
      # mcr.microsoft.com as a build argument and is not pulled here.
      - name: Pull the base images
        timeout-minutes: 10
        run: bash .github/scripts/pull-base-images.sh test/e2e/real_server_fixture/Dockerfile

      - name: Test real-server fixtures
        run: bash .github/scripts/run-real-server-fixture-gate.sh

      - name: Repeat production artifact acceptance five times
        run: |
          server_revision="$(git rev-parse HEAD)"
          printf 'CI head: %s\n' "$GITHUB_SHA"
          printf 'Fixture server revision: %s\n' "$server_revision"
          printf 'Fixture web revision: %s\n' '16f12b9f4e0a42b20c3fe3aa340b6b8f8b2e8861'
          go test -race -count=5 -timeout 15m -run '^TestRealServerFixtureAcceptsProductionWebArtifact$' ./test/e2e

      - name: Fixture Postgres container state on failure
        if: failure()
        run: |
          containers=$(docker ps --all --filter name=teagram-fixture- --format '{{.Names}}' | while IFS= read -r container; do
            case "$container" in
              teagram-fixture-*database) printf '%s\n' "$container" ;;
            esac
          done)
          if [[ -z "$containers" ]]; then
            echo "fixture Postgres containers were removed during cleanup"
          else
            while IFS= read -r container; do
              docker inspect -f '{{.Name}} state={{.State.Status}} exit={{.State.ExitCode}} oomkilled={{.State.OOMKilled}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container"
              docker inspect -f '{{range .State.Health.Log}}{{println .ExitCode .Output}}{{end}}' "$container"
            done <<< "$containers"
          fi
          free -m

  test-websocket-d1:
    name: 'test: websocket-d1'
    needs: ops-prioritize-main
    if: ${{ (github.event_name == 'pull_request' && !cancelled() || github.event_name != 'pull_request' && always()) && (needs.ops-prioritize-main.result == 'success' || (needs.ops-prioritize-main.result == 'skipped' && github.event_name == 'pull_request')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/checkout@v7.0.1
        with:
          repository: teagramhq/teagram-server
          ref: 193b8c24357e22f3fc16099936e3bf187f935445
          path: server-source
          persist-credentials: false

      - uses: actions/checkout@v7.0.1
        with:
          repository: teagramhq/teagram-web
          ref: c88211e3985942343bf40dcbbcb8e8f5b4b7d364
          path: web-client
          persist-credentials: false

      - uses: actions/checkout@v7.0.1
        with:
