        run: bash .github/scripts/run-websocket-d1.sh

      - name: Upload sanitized WebSocket D1 report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: websocket-d1-sanitized-report
          path: ${{ runner.temp }}/teagram-websocket-d1-${{ github.run_id }}-${{ github.run_attempt }}.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Remove local sanitized WebSocket D1 report
        if: always()
        env:
          D1_SANITIZED_ARTIFACT_PATH: ${{ runner.temp }}/teagram-websocket-d1-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: rm -f -- "$D1_SANITIZED_ARTIFACT_PATH"

  test-websocket-permanent-exchange:
