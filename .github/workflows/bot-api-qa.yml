name: Verify Bot API QA.

run-name: ${{ inputs.issue && format('{0} [{1}]', github.workflow, inputs.issue) || '' }}

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue key for the CI router
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: teagram-bot-api-qa
  cancel-in-progress: false

jobs:
  check-qa-token-recipient:
    name: 'check: qa-token-recipient'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: demo
    permissions:
      contents: read

    steps:
      - name: Install the restricted QA recipient key
        env:
          QA_ACCOUNTS_SSH_KEY: ${{ secrets.QA_ACCOUNTS_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ -n "$QA_ACCOUNTS_SSH_KEY" ]] || {
            echo "::error::QA account-writer key is not configured"
            exit 1
          }
          install -d -m 0700 "$RUNNER_TEMP/qa-recipient"
          (umask 077 && printf '%s\n' "$QA_ACCOUNTS_SSH_KEY" > "$RUNNER_TEMP/qa-recipient/id_qa")
          ssh-keygen -y -f "$RUNNER_TEMP/qa-recipient/id_qa" > "$RUNNER_TEMP/qa-recipient/id_qa.pub"
          chmod 0600 "$RUNNER_TEMP/qa-recipient/id_qa.pub"

      - name: Upload the public encryption recipient
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bot-api-qa-recipient-${{ github.run_id }}
          path: ${{ runner.temp }}/qa-recipient/id_qa.pub
          if-no-files-found: error
          retention-days: 1

      - name: Remove QA key material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/qa-recipient"

  deploy-bot-api:
    name: 'deploy: bot-api (prod)'
    needs: check-qa-token-recipient
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: production
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate inputs and production access
        env:
          ISSUE_KEY: ${{ inputs.issue }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$ISSUE_KEY" =~ ^[A-Z][A-Z0-9]+-[0-9]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]

      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-deploy
          ping: 100.124.236.66

      - name: Install production SSH key and QA recipient
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$RUNNER_TEMP/ssh-bot-api"
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh-bot-api/id_deploy")
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh-bot-api/known_hosts"

      - name: Download the QA token recipient
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v7.0.0
        with:
          name: bot-api-qa-recipient-${{ github.run_id }}
          path: ${{ runner.temp }}/ssh-bot-api/recipient

      - name: Install Go for token encryption
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the token encryption tool
        run: go install filippo.io/age/cmd/age@v1.2.1

      - name: Apply the reviewed config and test the Bot API
        id: provision
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          token_file="$RUNNER_TEMP/bot-api-token-payload"
          token_error="$RUNNER_TEMP/bot-api-token-error"
          apply_result="$RUNNER_TEMP/bot-api-apply-result"
          verify_result="$RUNNER_TEMP/bot-api-verify-result"
          active_config="$RUNNER_TEMP/bot-api-active-curl.conf"
          revoked_config="$RUNNER_TEMP/bot-api-revoked-curl.conf"
          active_body="$RUNNER_TEMP/bot-api-active-response.json"
          revoked_body="$RUNNER_TEMP/bot-api-revoked-response.json"
          public_ips="$RUNNER_TEMP/bot-api-probe-ips"
          cipher_file="$RUNNER_TEMP/bot-api-token.age"
          cleanup() {
            rm -f -- "$token_file" "$token_error" "$apply_result" "$verify_result" \
              "$active_config" "$revoked_config" "$active_body" "$revoked_body" "$public_ips"
          }
          report_token_error() {
            if [[ -s "$token_error" ]]; then
              cat -- "$token_error" >&2
            fi
          }
          trap cleanup EXIT
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh_cmd=(ssh -T -i "$RUNNER_TEMP/ssh-bot-api/id_deploy"
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh-bot-api/known_hosts"
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10)
          if ! "${ssh_cmd[@]}" "root@100.124.236.66" "run $SOURCE_SHA bot-api-qa apply" \
            </dev/null > "$apply_result" 2> "$token_error"; then
            report_token_error
            echo "::error::The reviewed Bot API config operation failed"
            exit 1
          fi
          grep -Eq '^configuration=(applied source_sha=[0-9a-f]{40} env_sha256=[0-9a-f]{64}|already-applied source_sha=[0-9a-f]{40}) bind=127\.0\.0\.1:2447 publish=100\.124\.236\.66:2447 forwarder=healthy$' "$apply_result"
          if ! "${ssh_cmd[@]}" "root@100.124.236.66" "run $SOURCE_SHA bot-api-qa provision" \
            </dev/null > "$token_file" 2> "$token_error"; then
            echo "::error::The test bot could not be provisioned"
            exit 1
          fi
          chmod 0600 "$token_file"
          mapfile -t token_lines < "$token_file"
          [[ "${#token_lines[@]}" == 3 ]]
          [[ "${token_lines[0]}" =~ ^bot_id=([1-9][0-9]{0,18})$ ]]
          bot_id=${BASH_REMATCH[1]}
          [[ "${token_lines[1]}" =~ ^revoked_token=([1-9][0-9]{0,18}:[A-Za-z0-9_-]{43})$ ]]
          revoked_token=${BASH_REMATCH[1]}
          [[ "${token_lines[1]}" == "revoked_token=$bot_id:"* ]]
          [[ "${token_lines[2]}" =~ ^active_token=([1-9][0-9]{0,18}:[A-Za-z0-9_-]{43})$ ]]
          active_token=${BASH_REMATCH[1]}
          [[ "${token_lines[2]}" == "active_token=$bot_id:"* && "$active_token" != "$revoked_token" ]]
          printf '::add-mask::%s\n' "$revoked_token"
          printf '::add-mask::%s\n' "$active_token"

          if ! "${ssh_cmd[@]}" "root@100.124.236.66" "run $SOURCE_SHA bot-api-qa verify" \
            </dev/null > "$verify_result" 2> "$token_error"; then
            report_token_error
            echo "::error::The live Bot API deployment failed its host-side verification"
            exit 1
          fi
          grep -Fxq "configuration=verified source_sha=$SOURCE_SHA bind=127.0.0.1:2447 publish=100.124.236.66:2447 forwarder=healthy listeners=verified" "$verify_result"
          grep -E '^public_probe_ip=[0-9.]+$' "$verify_result" > "$public_ips"
          grep -q '^public_probe_ip=' "$public_ips"
          public_ip=$(sed -n 's/^public_probe_ip=//p' "$public_ips" | head -n 1)
          [[ "$public_ip" =~ ^[0-9.]+$ ]]

          printf 'url = "http://100.124.236.66:2447/bot%s/getMe"\n' "$active_token" > "$active_config"
          printf 'url = "http://100.124.236.66:2447/bot%s/getMe"\n' "$revoked_token" > "$revoked_config"
          active_status=$(curl -q --silent --show-error --connect-timeout 5 --max-time 10 \
            --config "$active_config" --output "$active_body" --write-out '%{http_code}' 2> "$token_error") || {
            echo "::error::Bot API getMe did not answer over the tailnet"
            exit 1
          }
          [[ "$active_status" == 200 ]]
          jq -e --argjson id "$bot_id" '.ok == true and .result.id == $id and .result.username == "teagram_test_bot"' \
            "$active_body" >/dev/null
          revoked_status=$(curl -q --silent --show-error --connect-timeout 5 --max-time 10 \
            --config "$revoked_config" --output "$revoked_body" --write-out '%{http_code}' 2> "$token_error") || {
            echo "::error::The revoked-token request did not reach the Bot API"
            exit 1
          }
          [[ "$revoked_status" == 401 ]]

          if curl -q --silent --connect-timeout 4 --max-time 5 --output /dev/null \
            "http://$public_ip:2447/" 2> "$token_error"; then
            echo "::error::Bot API port answered on a public address"
            exit 1
          fi

          web_status=$(curl -q --silent --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' \
            https://teagram.tailaa4918.ts.net/ 2> "$token_error") || {
            echo "::error::Web through Tailscale Serve is unhealthy"
            exit 1
          }
          [[ "$web_status" == 200 ]]
          admin_status=$(curl -q --silent --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' \
            https://teagram.tailaa4918.ts.net/admin/ 2> "$token_error") || {
            echo "::error::Admin through Tailscale Serve is unreachable"
            exit 1
          }
          [[ "$admin_status" == 401 || "$admin_status" == 403 ]]

          python3 - <<'PY'
          import base64
          import secrets
          import socket
          import ssl

          host = "teagram.tailaa4918.ts.net"
          websocket_key = base64.b64encode(secrets.token_bytes(16)).decode("ascii")
          request = (
              "GET /apiws HTTP/1.1\r\n"
              f"Host: {host}\r\n"
              "Origin: https://teagram.tailaa4918.ts.net\r\n"
              "Connection: Upgrade\r\n"
              "Upgrade: websocket\r\n"
              "Sec-WebSocket-Version: 13\r\n"
              f"Sec-WebSocket-Key: {websocket_key}\r\n\r\n"
          )
          context = ssl.create_default_context()
          with socket.create_connection((host, 443), timeout=10) as raw:
              with context.wrap_socket(raw, server_hostname=host) as conn:
                  conn.sendall(request.encode("ascii"))
                  response = conn.recv(4096).split(b"\r\n", 1)[0]
          if response != b"HTTP/1.1 101 Switching Protocols":
              raise SystemExit("/apiws did not complete a WebSocket upgrade")
          PY

          install -d -m 0700 "$RUNNER_TEMP/age-bin"
          GOBIN="$RUNNER_TEMP/age-bin" go install filippo.io/age/cmd/age@v1.2.1
          "$RUNNER_TEMP/age-bin/age" -R "$RUNNER_TEMP/ssh-bot-api/recipient/id_qa.pub" \
            -o "$cipher_file" "$token_file"
          chmod 0600 "$cipher_file"
          rm -f -- "$token_file" "$active_config" "$revoked_config"
          [[ ! -e "$token_file" && ! -e "$active_config" && ! -e "$revoked_config" ]]
          echo "bot_id=$bot_id" >> "$GITHUB_OUTPUT"
          echo "checks=tailnet_getMe,revoked_401,public_refused,lan_bindings,web,apiws,admin,serve" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted Bot API token
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bot-api-token-${{ github.run_id }}
          path: ${{ runner.temp }}/bot-api-token.age
          if-no-files-found: error
          retention-days: 1

      - name: Remove production access files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/ssh-bot-api" "$RUNNER_TEMP/age-bin"

  ops-qa-bot-credential:
    name: 'ops: qa-bot-credential'
    needs: [check-qa-token-recipient, deploy-bot-api]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: demo
    permissions:
      actions: read
      contents: read

    steps:
      - name: Validate QA account-writer access
        env:
          ISSUE_KEY: ${{ inputs.issue }}
          QA_ACCOUNTS_HOST: ${{ vars.QA_ACCOUNTS_HOST }}
          QA_ACCOUNTS_PORT: ${{ vars.QA_ACCOUNTS_PORT }}
          QA_ACCOUNTS_SSH_KEY: ${{ secrets.QA_ACCOUNTS_SSH_KEY }}
          QA_ACCOUNTS_KNOWN_HOSTS: ${{ vars.QA_ACCOUNTS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$ISSUE_KEY" =~ ^[A-Z][A-Z0-9]+-[0-9]+$ ]]
          [[ "$QA_ACCOUNTS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$QA_ACCOUNTS_PORT" =~ ^[0-9]{1,5}$ ]]
          (( 10#$QA_ACCOUNTS_PORT >= 1 && 10#$QA_ACCOUNTS_PORT <= 65535 ))
          [[ -n "$QA_ACCOUNTS_SSH_KEY" && -n "$QA_ACCOUNTS_KNOWN_HOSTS" ]]

      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-deploy
          ping: ${{ vars.QA_ACCOUNTS_HOST }}

      - name: Install the QA writer key
        env:
          QA_ACCOUNTS_SSH_KEY: ${{ secrets.QA_ACCOUNTS_SSH_KEY }}
          QA_ACCOUNTS_KNOWN_HOSTS: ${{ vars.QA_ACCOUNTS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$RUNNER_TEMP/ssh-qa-bot-api"
          (umask 077 && printf '%s\n' "$QA_ACCOUNTS_SSH_KEY" > "$RUNNER_TEMP/ssh-qa-bot-api/id_qa")
          printf '%s\n' "$QA_ACCOUNTS_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh-qa-bot-api/known_hosts"

      - name: Download the encrypted Bot API credential
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v7.0.0
        with:
          name: bot-api-token-${{ github.run_id }}
          path: ${{ runner.temp }}/encrypted-token

      - name: Check out the selected main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install age
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Decrypt and store the credential on QA
        env:
          QA_ACCOUNTS_HOST: ${{ vars.QA_ACCOUNTS_HOST }}
          QA_ACCOUNTS_PORT: ${{ vars.QA_ACCOUNTS_PORT }}
        run: |
          set -Eeuo pipefail
          umask 077
          key_file="$RUNNER_TEMP/ssh-qa-bot-api/id_qa"
          payload_file="$RUNNER_TEMP/encrypted-token/bot-api-token.age"
          decoded_file="$RUNNER_TEMP/decoded-bot-token"
          record_file="$RUNNER_TEMP/qa-bot-record"
          result_file="$RUNNER_TEMP/qa-bot-result"
          token_file="$RUNNER_TEMP/qa-bot-token"
          trap 'rm -f -- "$decoded_file" "$record_file" "$result_file" "$token_file"' EXIT
          install -d -m 0700 "$RUNNER_TEMP/age-bin"
          GOBIN="$RUNNER_TEMP/age-bin" go install filippo.io/age/cmd/age@v1.2.1
          "$RUNNER_TEMP/age-bin/age" -d -i "$key_file" -o "$decoded_file" "$payload_file"
          chmod 0600 "$decoded_file"
          mapfile -t token_lines < "$decoded_file"
          [[ "${#token_lines[@]}" == 3 ]]
          [[ "${token_lines[0]}" =~ ^bot_id=([1-9][0-9]{0,18})$ ]]
          bot_id=${BASH_REMATCH[1]}
          [[ "${token_lines[2]}" =~ ^active_token=([1-9][0-9]{0,18}:[A-Za-z0-9_-]{43})$ ]]
          active_token=${BASH_REMATCH[1]}
          [[ "${token_lines[2]}" == "active_token=$bot_id:"* ]]
          printf '::add-mask::%s\n' "$active_token"
          printf '%s' "$active_token" | python3 .github/scripts/qa_bot_record.py > "$record_file"
          chmod 0600 "$record_file"
          handle="bot_$bot_id"
          ssh -T -p "$QA_ACCOUNTS_PORT" -i "$key_file" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh-qa-bot-api/known_hosts" \
            "qa@$QA_ACCOUNTS_HOST" health </dev/null | grep -Fxq 'qa-account-writer=ready' || {
              echo "::error::QA account writer preflight failed"
              exit 1
            }
          ssh -T -p "$QA_ACCOUNTS_PORT" -i "$key_file" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh-qa-bot-api/known_hosts" \
            "qa@$QA_ACCOUNTS_HOST" "remove $handle" </dev/null > "$result_file"
          grep -Fxq "removed=$handle" "$result_file"
          if ! ssh -T -p "$QA_ACCOUNTS_PORT" -i "$key_file" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh-qa-bot-api/known_hosts" \
            "qa@$QA_ACCOUNTS_HOST" store < "$record_file" > "$result_file"; then
            echo "::error::QA credential storage could not be confirmed"
            exit 1
          fi
          grep -Fxq "stored=$handle" "$result_file"
          rm -f -- "$decoded_file" "$record_file" "$result_file" "$token_file"
          [[ ! -e "$decoded_file" && ! -e "$record_file" && ! -e "$result_file" ]]
          printf 'bot_credential=stored-on-qa\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove QA access files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/ssh-qa-bot-api" "$RUNNER_TEMP/encrypted-token" "$RUNNER_TEMP/age-bin"
