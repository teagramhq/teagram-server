name: Real-client browser flow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: real-client-browser-flow-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  real-client-browser-flow:
    name: real-client-browser-flow
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io
      REAL_CLIENT_SERVER_REVISION: ${{ github.sha }}
      REAL_CLIENT_WEB_REVISION: 9febe37afef7223548706c4ae4dd862e7b0fa5d9
      REAL_CLIENT_GUEST_WEB_REVISION: 8e23fd09eac68f5ac1beb2468f76d0ffed28f814
      REAL_CLIENT_SERVER_ROOT: ${{ github.workspace }}
      REAL_CLIENT_WEB_ROOT: ${{ github.workspace }}/web-source
      REAL_CLIENT_GUEST_WEB_ROOT: ${{ github.workspace }}/guest-web-source
      REAL_CLIENT_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      REAL_CLIENT_TESTED_REVISION: ${{ github.sha }}

    steps:
      - name: Start complete job timer
        run: date +%s > "$RUNNER_TEMP/real-client-job-start"

      - name: Check out tested server tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Reuse the sticker bundle snapshot built and license-checked by CI.
      # The image Dockerfile's fallback generator reaches upstream sources and
      # is deliberately avoided in this isolated browser lane.
      - name: Restore sticker bundle snapshot
        id: sticker-bundle-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/sticker-bundle
          key: sticker-bundle-${{ runner.os }}-node22-python3.12.15-${{ hashFiles('tools/stickerbundle/generate.sh', 'tools/stickerbundle/generate.py', 'tools/stickerbundle/render.mjs', 'tools/stickerbundle/sources.json', 'tools/stickerbundle/package.json', 'tools/stickerbundle/package-lock.json') }}

      - uses: actions/setup-node@v7.0.0
        if: steps.sticker-bundle-cache.outputs.cache-hit != 'true'
        with:
          node-version: 22

      - uses: actions/setup-python@v6.0.0
        if: steps.sticker-bundle-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12.15"

      - name: Generate pinned sticker bundle on cache miss
        if: steps.sticker-bundle-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: tools/stickerbundle/generate.sh --output "$RUNNER_TEMP/sticker-bundle"

      - name: Resolve the live Web publication
        id: qa-web-pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          publication=$(python3 deploy/teagram-demo/resolve_web_artifact_pin.py)
          source_commit=$(jq -er '.sourceCommit' <<<"$publication")
          artifact_digest=$(jq -er '.artifactDigest' <<<"$publication")
          [[ "$(jq -er '.deployable | tostring' <<<"$publication")" == true ]]
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'source_commit=%s\nartifact_digest=%s\n' "$source_commit" "$artifact_digest" >> "$GITHUB_OUTPUT"

      - name: Check out the deployed Web source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: teagramhq/teagram-web
          ref: ${{ steps.qa-web-pin.outputs.source_commit }}
          path: qa-demo-web-source
          persist-credentials: false

      - name: Check out pinned web companion
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: teagramhq/teagram-web
          ref: ${{ env.REAL_CLIENT_WEB_REVISION }}
          path: web-source
          persist-credentials: false

      # Guest signup controls are runner-specific and remain on their known compatible web pin.
      - name: Check out guest signup runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: teagramhq/teagram-web
          ref: ${{ env.REAL_CLIENT_GUEST_WEB_REVISION }}
          path: guest-web-source
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: web-source/pnpm-lock.yaml

      - name: Test cancellation and timeout process-group cleanup
        run: node --test test/e2e/real_server_fixture/process_tree.test.mjs

      - name: Test artifact response policy
        run: node --test test/e2e/real_server_fixture/artifact_response_policy.test.cjs

      - name: Test real-client worker source observation
        run: node --test test/e2e/real_server_fixture/worker_source_observation.test.cjs test/e2e/real_server_fixture/real_client_worker_observer_patch.test.mjs test/e2e/real_server_fixture/real_client_scenarios.test.mjs test/e2e/real_server_fixture/run_real_client_browser_flow.test.mjs

      - name: Test the pinned guest signup runner patch
        env:
          REAL_CLIENT_WEB_ROOT: ${{ env.REAL_CLIENT_GUEST_WEB_ROOT }}
        run: node --test test/e2e/real_server_fixture/patch_real_client_guest_signup.test.mjs

      # Keep the web app revision fixed; overlay runner-side evidence checks.
      - name: Patch pinned real-client runner evidence
        run: |
          node test/e2e/real_server_fixture/patch_real_client_worker_observer.mjs --web-root "$REAL_CLIENT_WEB_ROOT" --web-revision "$REAL_CLIENT_WEB_REVISION"
          node test/e2e/real_server_fixture/patch_real_client_guest_signup.mjs --web-root "$REAL_CLIENT_GUEST_WEB_ROOT" --web-revision "$REAL_CLIENT_GUEST_WEB_REVISION"

      - name: Install pinned web dependencies
        working-directory: web-source
        run: pnpm install --frozen-lockfile

      - name: Install pinned guest signup runner dependencies
        working-directory: guest-web-source
        run: pnpm install --frozen-lockfile

      # The QA stack serves this exact artifact, including its embedded target.
      - name: Rebuild the resolved demo Web artifact
        working-directory: qa-demo-web-source
        env:
          WEB_SOURCE_SHA: ${{ steps.qa-web-pin.outputs.source_commit }}
          WEB_ARTIFACT_DIGEST: ${{ steps.qa-web-pin.outputs.artifact_digest }}
        run: bash "$GITHUB_WORKSPACE/deploy/teagram-demo/build-web-artifact.sh"

      # Pre-pull the Dockerfile base and runtime images; the fixture starts
      # Postgres directly, so it must be available under this mirror-qualified name.
      - name: Pull fixture base images
        timeout-minutes: 5
        run: bash .github/scripts/pull-base-images.sh --image mirror.gcr.io/library/postgres:18-alpine --image mirror.gcr.io/arigaio/atlas:1.3.0-alpine test/e2e/real_server_fixture/Dockerfile

      - name: Run fixture, private build, and all supported browser scenarios
        id: browser-flow
        run: node test/e2e/real_server_fixture/run_real_client_browser_flow.mjs

      - name: Install Chromium browser
        timeout-minutes: 5
        working-directory: web-source
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: corepack pnpm exec playwright install chromium

      - name: Configure bounded APT retries
        run: |
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "90";' \
            'Acquire::https::Timeout "90";' \
            | sudo tee /etc/apt/apt.conf.d/99-github-actions-download-retries >/dev/null

      # The GitHub-hosted Ubuntu mirror has repeatedly taken nearly ten minutes
      # to deliver Playwright's font packages. Use the shared apt-package cache
      # used by the e2e-admin job, and keep the slow path bounded for a cold
      # runner image or a cache miss.
      - name: Determine missing Chromium system dependencies
        id: playwright-deps
        working-directory: web-source
        run: |
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >>"$GITHUB_OUTPUT"

          status=0
          pnpm exec playwright install-deps --dry-run chromium >deps-dry-run.txt 2>&1 || status=$?
          cat deps-dry-run.txt
          if [ "$status" -eq 0 ] && grep -q 'All system dependencies are installed' deps-dry-run.txt; then
            echo "mode=satisfied" >>"$GITHUB_OUTPUT"
          elif grep -q 'Missing system dependencies' deps-dry-run.txt; then
            sed -n 's/^  \([^ ]*\)$/\1/p' deps-dry-run.txt | sort >apt-packages.txt
            if [ ! -s apt-packages.txt ]; then
              echo "::warning::could not parse the missing dependency list; falling back to the network install"
              echo "mode=unknown" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo "missing packages:"
            cat apt-packages.txt
            echo "mode=packages" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::could not simulate the dependency install; falling back to the network install"
            echo "mode=unknown" >>"$GITHUB_OUTPUT"
          fi

      - name: Cache Chromium apt dependencies
        id: apt-cache
        if: steps.playwright-deps.outputs.mode == 'packages'
        uses: actions/cache@v6.1.0
        with:
          path: .apt-cache/*.deb
          key: playwright-apt-${{ steps.playwright-deps.outputs.image }}-${{ hashFiles('web-source/apt-packages.txt') }}

      - name: Install Chromium system dependencies from cache
        id: apt-cached-install
        if: steps.apt-cache.outputs.cache-hit == 'true'
        working-directory: web-source
        run: |
          if sudo dpkg -i ../.apt-cache/*.deb && pnpm exec playwright install-deps --dry-run chromium; then
            echo "installed=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::cached debs did not satisfy the dependencies; falling back to the network install"
          echo "installed=false" >>"$GITHUB_OUTPUT"

      - name: Install Chromium system dependencies from the network
        id: apt-network-install
        if: ${{ steps.playwright-deps.outputs.mode == 'unknown' || (steps.playwright-deps.outputs.mode == 'packages' && steps.apt-cached-install.outputs.installed != 'true') }}
        timeout-minutes: 20
        working-directory: web-source
        env:
          MODE: ${{ steps.playwright-deps.outputs.mode }}
        run: |
          reap() {
            sudo kill -KILL -- "-$1" 2>/dev/null || true
            fuser_path=$(command -v fuser 2>/dev/null) || {
              echo "::error::fuser is required to wait for the dpkg lock"
              return 1
            }
            probe_status=0
            sudo "$fuser_path" -V >/dev/null 2>&1 || probe_status=$?
            if [ "$probe_status" -ne 0 ]; then
              echo "::error::fuser could not be executed to wait for the dpkg lock (exit $probe_status)"
              return 1
            fi
            for ((attempt = 0; attempt < 30; attempt++)); do
              probe_status=0
              probe_output=$(sudo "$fuser_path" /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock 2>&1) || probe_status=$?
              if [ "$probe_status" -eq 0 ]; then
                sleep 1
              elif [ "$probe_status" -ne 1 ] || [ -n "$probe_output" ]; then
                echo "::error::fuser failed while checking the dpkg lock (exit $probe_status): $probe_output"
                return 1
              else
                break
              fi
            done
            sudo dpkg --configure -a || true
          }

          # shellcheck disable=SC2329 # Exported and invoked by the timeout child Bash below.
          attempt_install() {
            set -e
            if [ "$MODE" = "packages" ]; then
              bash ../.github/scripts/prepare-playwright-apt-cache.sh ../.apt-cache
              sudo apt-get update
              status=0
              pnpm exec playwright install-deps --dry-run chromium >deps-after-update.txt 2>&1 || status=$?
              cat deps-after-update.txt
              if grep -q 'All system dependencies are installed' deps-after-update.txt; then
                : >apt-install-packages.txt
              elif grep -q 'Missing system dependencies' deps-after-update.txt; then
                sed -n 's/^  \([^ ]*\)$/\1/p' deps-after-update.txt | sort >apt-install-packages.txt
                if [ ! -s apt-install-packages.txt ]; then
                  echo "::error::could not parse Playwright dependencies after apt-get update"
                  return 1
                fi
              elif [ "$status" -ne 0 ]; then
                echo "::error::could not determine Playwright dependencies after apt-get update"
                return "$status"
              else
                echo "::error::Playwright did not report dependencies after apt-get update"
                return 1
              fi
              if [ -s apt-install-packages.txt ]; then
                mapfile -t apt_packages <apt-install-packages.txt
                sudo apt-get install -y --no-install-recommends \
                  -o "Dir::Cache::archives=$GITHUB_WORKSPACE/.apt-cache" \
                  "${apt_packages[@]}"
              fi
              sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/.apt-cache"
            else
              pnpm exec playwright install-deps chromium
            fi
          }
          export -f attempt_install

          for attempt in 1 2; do
            status=0
            setsid timeout --signal=KILL 9m bash -c attempt_install &
            pid=$!
            wait "$pid" || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            echo "::warning::system dependency install attempt $attempt failed (exit $status)"
            reap "$pid"
          done
          echo "::error::system dependency install failed after 2 attempts"
          exit 1

      - name: Save Chromium apt dependencies
        continue-on-error: true
        if: ${{ steps.playwright-deps.outputs.mode == 'packages' && (steps.apt-cache.outputs.cache-hit != 'true' || steps.apt-cached-install.outputs.installed == 'false') }}
        uses: actions/cache/save@v6.1.0
        with:
          path: .apt-cache/*.deb
          key: playwright-apt-${{ steps.playwright-deps.outputs.image }}-${{ hashFiles('web-source/apt-packages.txt') }}

      - name: Verify Chromium system dependencies
        working-directory: web-source
        run: pnpm exec playwright install-deps --dry-run chromium

      - name: Install NSS trust utility
        run: |
          if ! command -v certutil >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libnss3-tools
          fi

      - name: Set up Buildx for the validated sticker bundle context
        uses: docker/setup-buildx-action@v4.4.1
        with:
          driver: docker

      - name: Exercise the QA invite TLS edge and Web artifact
        timeout-minutes: 15
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
          QA_WEB_SOURCE_DIR: ${{ github.workspace }}/qa-demo-web-source
          QA_WEB_SOURCE_SHA: ${{ steps.qa-web-pin.outputs.source_commit }}
          QA_WEB_ARTIFACT_DIGEST: ${{ steps.qa-web-pin.outputs.artifact_digest }}
          STICKER_BUNDLE_DIR: ${{ runner.temp }}/sticker-bundle
        run: bash deploy/qa-invite/test-qa-invite-browser-flow.sh

      - name: Upload Playwright failure trace
        if: ${{ always() && steps.browser-flow.outputs.trace_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-client-playwright-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.browser-flow.outputs.trace_dir }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload sanitized run report
        if: ${{ always() && steps.browser-flow.outputs.summary_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-client-browser-flow-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.browser-flow.outputs.summary_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Run fresh-browser guest signup with the sign-in gate enabled
        id: guest-signup-flow
        env:
          REAL_CLIENT_GUEST_SIGNUP_ONLY: '1'
          REAL_CLIENT_WEB_REVISION: ${{ env.REAL_CLIENT_GUEST_WEB_REVISION }}
          REAL_CLIENT_WEB_ROOT: ${{ env.REAL_CLIENT_GUEST_WEB_ROOT }}
        run: node test/e2e/real_server_fixture/run_real_client_browser_flow.mjs

      - name: Upload guest-signup Playwright failure trace
        if: ${{ always() && steps.guest-signup-flow.outputs.trace_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-client-guest-signup-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.guest-signup-flow.outputs.trace_dir }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload guest-signup run report
        if: ${{ always() && steps.guest-signup-flow.outputs.summary_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-client-guest-signup-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.guest-signup-flow.outputs.summary_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Run gate-off fresh-browser guest signup with the real challenge
        id: guest-signup-gate-off-challenge-flow
        env:
          REAL_CLIENT_GUEST_SIGNUP_ONLY: '1'
          REAL_CLIENT_GUEST_SIGNUP_GATE_OFF: '1'
          REAL_CLIENT_WEB_REVISION: ${{ env.REAL_CLIENT_GUEST_WEB_REVISION }}
          REAL_CLIENT_WEB_ROOT: ${{ env.REAL_CLIENT_GUEST_WEB_ROOT }}
        run: node test/e2e/real_server_fixture/run_real_client_browser_flow.mjs

      - name: Upload gate-off challenge Playwright failure trace
        if: ${{ always() && steps.guest-signup-gate-off-challenge-flow.outputs.trace_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-client-guest-signup-gate-off-challenge-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.guest-signup-gate-off-challenge-flow.outputs.trace_dir }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload gate-off challenge run report
        if: ${{ always() && steps.guest-signup-gate-off-challenge-flow.outputs.summary_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-client-guest-signup-gate-off-challenge-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.guest-signup-gate-off-challenge-flow.outputs.summary_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Run gate-off fresh-browser guest signup with the QA bypass
        id: guest-signup-gate-off-flow
        env:
          REAL_CLIENT_GUEST_SIGNUP_ONLY: '1'
          REAL_CLIENT_GUEST_SIGNUP_GATE_OFF: '1'
          REAL_CLIENT_GUEST_SIGNUP_QA_BYPASS: '1'
          REAL_CLIENT_WEB_REVISION: ${{ env.REAL_CLIENT_GUEST_WEB_REVISION }}
          REAL_CLIENT_WEB_ROOT: ${{ env.REAL_CLIENT_GUEST_WEB_ROOT }}
        run: node test/e2e/real_server_fixture/run_real_client_browser_flow.mjs

      - name: Upload gate-off guest-signup Playwright failure trace
        if: ${{ always() && steps.guest-signup-gate-off-flow.outputs.trace_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-client-guest-signup-gate-off-qa-bypass-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.guest-signup-gate-off-flow.outputs.trace_dir }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload gate-off guest-signup run report
        if: ${{ always() && steps.guest-signup-gate-off-flow.outputs.summary_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-client-guest-signup-gate-off-qa-bypass-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.guest-signup-gate-off-flow.outputs.summary_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Report complete job duration
        if: always()
        run: |
          started="$(cat "$RUNNER_TEMP/real-client-job-start")"
          finished="$(date +%s)"
          elapsed=$((finished - started))
          printf 'Complete job duration: %dm %02ds\n' "$((elapsed / 60))" "$((elapsed % 60))" | tee -a "$GITHUB_STEP_SUMMARY"
          if ((elapsed >= 2700)); then
            echo "::error::real-client browser-flow job exceeded 45 minutes"
            exit 1
          fi
