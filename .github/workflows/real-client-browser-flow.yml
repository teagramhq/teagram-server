name: Real-client browser flow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: real-client-browser-flow-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  real-client-browser-flow:
    name: real-client-browser-flow
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io
      REAL_CLIENT_SERVER_REVISION: ${{ github.sha }}
      REAL_CLIENT_WEB_REVISION: 0c1e3ef8e43d7751b082ead019a1140ec5369a70
      REAL_CLIENT_SERVER_ROOT: ${{ github.workspace }}
      REAL_CLIENT_WEB_ROOT: ${{ github.workspace }}/web-source
      REAL_CLIENT_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      REAL_CLIENT_TESTED_REVISION: ${{ github.sha }}

    steps:
      - name: Start complete job timer
        run: date +%s > "$RUNNER_TEMP/real-client-job-start"

      - name: Check out tested server tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out pinned web companion
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: teagramhq/teagram-web
          ref: ${{ env.REAL_CLIENT_WEB_REVISION }}
          path: web-source
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: web-source/pnpm-lock.yaml

      - name: Test cancellation and timeout process-group cleanup
        run: node --test test/e2e/real_server_fixture/process_tree.test.mjs

      - name: Test artifact response policy
        run: node --test test/e2e/real_server_fixture/artifact_response_policy.test.cjs

      - name: Test real-client worker source observation
        run: node --test test/e2e/real_server_fixture/worker_source_observation.test.cjs test/e2e/real_server_fixture/real_client_worker_observer_patch.test.mjs

      # Keep the web app revision fixed; overlay runner-side evidence checks.
      - name: Patch pinned real-client runner evidence
        run: node test/e2e/real_server_fixture/patch_real_client_worker_observer.mjs --web-root "$REAL_CLIENT_WEB_ROOT" --web-revision "$REAL_CLIENT_WEB_REVISION"

      - name: Install pinned web dependencies
        working-directory: web-source
        run: pnpm install --frozen-lockfile

      # Pre-pull the Dockerfile base and runtime images; the fixture starts
      # Postgres directly, so it must be available under this mirror-qualified name.
      - name: Pull fixture base images
        timeout-minutes: 5
        run: bash .github/scripts/pull-base-images.sh --image mirror.gcr.io/library/postgres:18-alpine --image mirror.gcr.io/arigaio/atlas:1.2.0-alpine test/e2e/real_server_fixture/Dockerfile

      - name: Run fixture, private build, and all six browser scenarios
        id: browser-flow
        run: node test/e2e/real_server_fixture/run_real_client_browser_flow.mjs

      - name: Upload Playwright failure trace
        if: ${{ always() && steps.browser-flow.outputs.trace_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-client-playwright-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.browser-flow.outputs.trace_dir }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload sanitized run report
        if: ${{ always() && steps.browser-flow.outputs.summary_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-client-browser-flow-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.browser-flow.outputs.summary_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Report complete job duration
        if: always()
        run: |
          started="$(cat "$RUNNER_TEMP/real-client-job-start")"
          finished="$(date +%s)"
          elapsed=$((finished - started))
          printf 'Complete job duration: %dm %02ds\n' "$((elapsed / 60))" "$((elapsed % 60))" | tee -a "$GITHUB_STEP_SUMMARY"
          if ((elapsed >= 900)); then
            echo "::error::real-client browser-flow job exceeded 15 minutes"
            exit 1
          fi
