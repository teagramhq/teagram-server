name: Deploy dev target.

# The caller holds the dev queue across lookup and rollout so delayed lookups
# cannot reorder main commits sent to the dev target.
on:
  workflow_call:
    inputs:
      issue:
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  check-server-deploy-result:
    name: 'check: server-deploy-result'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read

    outputs:
      succeeded: ${{ steps.verify.outputs.succeeded || steps.manual.outputs.succeeded }}

    steps:
      - name: Verify the triggering server deploy job succeeded
        id: verify
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          [[ "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]]
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEPLOY_RUN_ID/jobs?per_page=100")
          deploy_conclusion=$(jq -r '[.jobs[] | select(.name == "deploy: server (prod)")] | if length == 1 then .[0].conclusion // "missing" else "missing-or-ambiguous" end' <<<"$jobs")
          if [[ "$deploy_conclusion" == success ]]; then
            echo "succeeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "succeeded=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Server Deploy job did not succeed ($deploy_conclusion); dev deployment skipped"
          fi

      - name: Validate the direct deployment request
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ISSUE_KEY: ${{ inputs.issue }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$ISSUE_KEY" =~ ^MAIN-[0-9]+$ ]]
          echo "succeeded=true" >> "$GITHUB_OUTPUT"

  check-demo-deploy-target:
    name: 'check: demo-deploy-target'
    needs:
      - check-server-deploy-result
      - check-dev-deploy-target
    if: >-
      needs.check-server-deploy-result.outputs.succeeded == 'true' &&
      needs.check-dev-deploy-target.outputs.configured == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      ci_run_id: ${{ steps.target.outputs.ci_run_id }}
      digest: ${{ steps.image.outputs.digest }}

    steps:
      - name: Resolve the tested server deployment target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
          ISSUE_KEY: ${{ inputs.issue }}
        run: |
          artifact_dir="$RUNNER_TEMP/demo-deploy-target"
          mkdir -p "$artifact_dir"
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            [[ "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]]
            gh run download "$DEPLOY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "demo-deploy-target-$DEPLOY_RUN_ID" --dir "$artifact_dir"
            target_file="$artifact_dir/demo-deploy-target.json"
            [[ -f "$target_file" && ! -L "$target_file" ]]
            deploy_sha=$(jq -er '.deploy_sha | strings' "$target_file")
            ci_run_id=$(jq -er '.ci_run_id | strings' "$target_file")
          else
            [[ "$EVENT_NAME" == workflow_dispatch ]]
            [[ "$GITHUB_REF" == refs/heads/main ]]
            [[ "$ISSUE_KEY" =~ ^MAIN-[0-9]+$ ]]
            main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            [[ "$main_sha" == "$GITHUB_SHA" ]]
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100")
            ci_run_id=$(jq -er --arg sha "$main_sha" '
              [.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")]
              | max_by(.run_number).id
            ' <<< "$runs")
            deploy_sha="$main_sha"
          fi
          [[ "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ci_run_id" =~ ^[0-9]+$ ]]
          printf 'sha=%s\nci_run_id=%s\n' "$deploy_sha" "$ci_run_id" >> "$GITHUB_OUTPUT"

      - name: Resolve the tested image digest
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.target.outputs.ci_run_id }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          artifact_dir="$RUNNER_TEMP/demo-image"
          mkdir -p "$artifact_dir"
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "demo-image-digest-$DEPLOY_SHA" --dir "$artifact_dir"
          [[ -f "$artifact_dir/demo-image-digest.txt" && ! -L "$artifact_dir/demo-image-digest.txt" ]]
          digest=$(<"$artifact_dir/demo-image-digest.txt")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  check-dev-deploy-target:
    name: 'check: dev-deploy-target'
    needs: check-server-deploy-result
    if: >-
      !cancelled() && needs.check-server-deploy-result.result == 'success' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.check-server-deploy-result.outputs.succeeded == 'true') ||
      (github.event_name == 'workflow_dispatch' && needs.check-server-deploy-result.outputs.succeeded == 'true'))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: demo
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.target.outputs.configured }}

    steps:
      - name: Check whether the dev target is configured
        id: target
        env:
          DEV_DEPLOY_HOST: ${{ vars.DEV_DEPLOY_HOST }}
        run: |
          if [[ -z "$DEV_DEPLOY_HOST" ]]; then
            echo "::notice::Dev deployment skipped because DEV_DEPLOY_HOST is unset"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-dev:
    name: 'deploy: dev'
    needs:
      - check-server-deploy-result
      - check-demo-deploy-target
      - check-dev-deploy-target
    if: >-
      !cancelled() && needs.check-server-deploy-result.result == 'success' &&
      needs.check-demo-deploy-target.result == 'success' &&
      needs.check-dev-deploy-target.result == 'success' &&
      needs.check-dev-deploy-target.outputs.configured == 'true' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.check-server-deploy-result.outputs.succeeded == 'true') ||
      (github.event_name == 'workflow_dispatch' && needs.check-server-deploy-result.outputs.succeeded == 'true'))
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: demo
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out the workflow source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Validate the dev deployment target
        id: target
        env:
          DEV_DEPLOY_HOST: ${{ vars.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_PORT: ${{ vars.DEV_DEPLOY_PORT }}
          DEV_DEPLOY_KNOWN_HOSTS: ${{ vars.DEV_DEPLOY_KNOWN_HOSTS }}
          DEV_DEPLOY_USER: ${{ vars.DEV_DEPLOY_USER }}
          DEMO_DEPLOY_SSH_KEY: ${{ secrets.DEMO_DEPLOY_SSH_KEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          bash .github/scripts/validate-deploy-target.sh \
            DEV_DEPLOY_HOST "$DEV_DEPLOY_HOST" \
            DEV_DEPLOY_PORT "$DEV_DEPLOY_PORT" \
            DEV_DEPLOY_KNOWN_HOSTS "$DEV_DEPLOY_KNOWN_HOSTS" \
            DEV_DEPLOY_USER "$DEV_DEPLOY_USER"
          [[ -n "$DEMO_DEPLOY_SSH_KEY" ]] || {
            echo "::error::DEMO_DEPLOY_SSH_KEY is empty"
            exit 1
          }
          [[ -n "$TS_OAUTH_CLIENT_ID" ]] || {
            echo "::error::TS_OAUTH_CLIENT_ID is empty"
            exit 1
          }
          [[ -n "$TS_OAUTH_SECRET" ]] || {
            echo "::error::TS_OAUTH_SECRET is empty"
            exit 1
          }
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Install the dev deploy key
        if: ${{ steps.target.outputs.enabled == 'true' }}
        env:
          DEMO_DEPLOY_SSH_KEY: ${{ secrets.DEMO_DEPLOY_SSH_KEY }}
          DEV_DEPLOY_KNOWN_HOSTS: ${{ vars.DEV_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/ssh-dev"
          (umask 077 && printf '%s\n' "$DEMO_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh-dev/id_deploy")
          printf '%s\n' "$DEV_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh-dev/known_hosts"

      - name: Join the tailnet
        if: ${{ steps.target.outputs.enabled == 'true' }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-deploy
          ping: ${{ vars.DEV_DEPLOY_HOST }}

      - name: Deploy the tested server commit to dev
        if: ${{ steps.target.outputs.enabled == 'true' }}
        env:
          DEPLOY_SHA: ${{ needs.check-demo-deploy-target.outputs.sha }}
          DEPLOY_IMAGE_DIGEST: ${{ needs.check-demo-deploy-target.outputs.digest }}
          DEV_DEPLOY_HOST: ${{ vars.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_PORT: ${{ vars.DEV_DEPLOY_PORT }}
          DEV_DEPLOY_USER: ${{ vars.DEV_DEPLOY_USER }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          ssh -T -p "$DEV_DEPLOY_PORT" -i "$RUNNER_TEMP/ssh-dev/id_deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh-dev/known_hosts" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST" "$DEPLOY_SHA $DEPLOY_IMAGE_DIGEST" </dev/null

      - name: Remove the dev deploy key
        if: ${{ always() && steps.target.outputs.enabled == 'true' }}
        run: rm -rf "$RUNNER_TEMP/ssh-dev"
