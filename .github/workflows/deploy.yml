name: Deploy.

run-name: ${{ inputs.issue && format('{0} [{1}]', github.workflow, inputs.issue) || '' }}

# Deploys the exact successful main CI commit to teagram-k3s. The test run's
# immutable image digest artifact and attestations are verified before the
# restricted cluster kubeconfig is used. The workflow contract guards this flow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue key to report this run to (e.g. MAIN-123). Leave empty for no report."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-gate-dry-run-MAIN-3834
  cancel-in-progress: false

jobs:
  check-deploy-gate:
    name: 'check: deploy-gate'
    if: ${{ vars.MAIN_3834_UNSET_DEPLOY_GATE != 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-26.04

    steps:
      - name: Report the disabled production deploy
        run: |
          set -euo pipefail
          echo "::error::Production deploy skipped because K3S_TAILNET_API_READY is not true"
          {
            echo '## Production deployment skipped'
            echo
            echo 'K3S_TAILNET_API_READY is not true; no production deploy ran.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  deploy-server:
    name: 'deploy: server (prod)'
    if: ${{ vars.MAIN_3834_UNSET_DEPLOY_GATE == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-26.04
    steps:
      - name: Confirm this is a dry run
        run: echo 'Dry run only; production deployment is disabled'
