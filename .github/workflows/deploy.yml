name: Deploy.

run-name: ${{ inputs.issue && format('{0} [{1}]', github.workflow, inputs.issue) || '' }}

# Deploys the exact commit whose CI passed on a push to main to the
# teagram-server LXC. The SSH command is the tested commit's SHA, and the key's
# forced command runs the stable deploy/telegram-server/deploy-main.sh bridge
# to that commit's canonical script. The canonical script runs the MTProto
# smoke from the deployed image on the host after readiness; the runner does
# not check out or run the smoke code. Its auth-key storage model is documented
# with the command. .github/scripts/test-deploy-workflow-contract.sh guards this flow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue key to report this run to (e.g. MAIN-123). Leave empty for no report."
        required: false
        type: string
        default: ""

permissions:
  contents: read

# One deploy at a time; GitHub keeps only the newest pending run.
concurrency:
  group: deploy-teagram-server
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy teagram-server
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: production
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      ci_run_id: ${{ steps.target.outputs.ci_run_id }}
    permissions:
      contents: read
      actions: read

    steps:
      # Late CI completions must not displace a newer successful descendant.
      - name: Resolve the tested commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          sha="$RUN_HEAD_SHA"
          ci_run_id="$RUN_ID"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0] | [.head_sha, (.id | tostring)] | @tsv')
          IFS=$'\t' read -r latest_sha latest_run_id <<< "$latest"
          if [[ ! "$latest_sha" =~ ^[0-9a-f]{40}$ || ! "$latest_run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::no tested commit run to deploy (got '$latest')"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            sha="$latest_sha"
            ci_run_id="$latest_run_id"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::no tested commit SHA to deploy (got '$sha')"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$latest_sha" --jq '.status')
            if [[ "$comparison" == ahead || "$comparison" == identical ]]; then
              sha="$latest_sha"
              ci_run_id="$latest_run_id"
            fi
          fi
          if [[ ! "$ci_run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::no successful main CI run for $sha (got '$ci_run_id')"
            exit 1
          fi
          echo "deploying $sha from CI run $ci_run_id"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"

      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-deploy
          ping: 100.124.236.66

      - name: Install the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/id_deploy")
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"

      - name: Deploy the tested commit
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          ssh -T -i "$RUNNER_TEMP/ssh/id_deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            root@100.124.236.66 "$DEPLOY_SHA" </dev/null

      - name: Remove the deploy key
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/ssh"

  deploy-demo:
    name: deploy public demo
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: demo
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check the demo deployment gate
        id: demo-gate
        env:
          TEAGRAM_DEMO_DEPLOY_ENABLED: ${{ vars.TEAGRAM_DEMO_DEPLOY_ENABLED }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          if [[ "$TEAGRAM_DEMO_DEPLOY_ENABLED" != 'true' ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Public demo deployment is disabled"
          elif [[ -z "$TS_OAUTH_CLIENT_ID" || -z "$TS_OAUTH_SECRET" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Public demo deployment skipped: Tailscale OAuth credentials are missing"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the tested image digest
        id: demo-image
        if: ${{ steps.demo-gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.deploy.outputs.ci_run_id }}
          DEPLOY_SHA: ${{ needs.deploy.outputs.sha }}
        run: |
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          artifact_dir="$RUNNER_TEMP/demo-image"
          mkdir -p "$artifact_dir"
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "demo-image-digest-$DEPLOY_SHA" --dir "$artifact_dir"
          [[ -f "$artifact_dir/demo-image-digest.txt" && ! -L "$artifact_dir/demo-image-digest.txt" ]]
          digest=$(<"$artifact_dir/demo-image-digest.txt")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Resolve the green teagram-web publication
        id: web-release
        run: |
          manifest="$RUNNER_TEMP/teagram-web-target.json"
          curl --fail --silent --show-error --location --max-time 20 \
            https://web.teagram.io/mtproto-target.json --output "$manifest"
          jq -e '
            type == "object"
            and .mode == "private"
            and (.sourceCommit | type == "string" and test("^[0-9a-f]{40}$"))
            and (.artifactDigest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
            and (.endpoint | type == "string" and startswith("wss://"))
          ' "$manifest" >/dev/null
          source_sha=$(jq -r '.sourceCommit' "$manifest")
          artifact_digest=$(jq -r '.artifactDigest' "$manifest")
          artifact_hex=${artifact_digest#sha256:}
          runs=$(curl --fail --silent --show-error \
            'https://api.github.com/repos/teagramhq/teagram-web/actions/workflows/private-artifact.yml/runs?branch=master&event=push&status=success&per_page=100')
          run_id=$(jq -r --arg sha "$source_sha" '
            [.workflow_runs[] | select(.head_sha == $sha and .head_branch == "master" and .event == "push" and .status == "completed" and .conclusion == "success")] |
            first | .id // empty
          ' <<< "$runs")
          [[ "$run_id" =~ ^[0-9]+$ ]] || {
            echo "::error::no green teagram-web publication run found for $source_sha"
            exit 1
          }
          artifact_name="private-mtproto-$source_sha-$artifact_hex"
          artifacts=$(curl --fail --silent --show-error \
            "https://api.github.com/repos/teagramhq/teagram-web/actions/runs/$run_id/artifacts?per_page=100")
          jq -e --arg name "$artifact_name" 'any(.artifacts[]; .name == $name)' <<< "$artifacts" >/dev/null || {
            echo "::error::green publication run $run_id has no artifact matching $artifact_digest"
            exit 1
          }
          {
            printf 'source_commit=%s\n' "$source_sha"
            printf 'artifact_digest=%s\n' "$artifact_digest"
            printf 'artifact_hex=%s\n' "$artifact_hex"
            printf 'publication_run_id=%s\n' "$run_id"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the pinned teagram-web source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: teagramhq/teagram-web
          ref: ${{ steps.web-release.outputs.source_commit }}
          path: teagram-web
          persist-credentials: false

      - name: Set up pnpm for the pinned web build
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: 11.16.0

      - name: Set up Node.js for the pinned web build
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: teagram-web/pnpm-lock.yaml

      - name: Rebuild and verify the green web artifact
        working-directory: teagram-web
        env:
          WEB_SOURCE_SHA: ${{ steps.web-release.outputs.source_commit }}
          WEB_ARTIFACT_DIGEST: ${{ steps.web-release.outputs.artifact_digest }}
        run: |
          reviewed_mode=$(jq -r '.MTPROTO_TARGET_MODE' ci/private-mtproto-target.json)
          reviewed_endpoint=$(jq -r '.MTPROTO_PRIVATE_ENDPOINT' ci/private-mtproto-target.json)
          reviewed_key=$(jq -r '.MTPROTO_PRIVATE_RSA_PUBLIC_KEY_FILE' ci/private-mtproto-target.json)
          [[ "$reviewed_mode" == private && "$reviewed_endpoint" == "$(jq -r '.endpoint' "$RUNNER_TEMP/teagram-web-target.json")" ]]
          pnpm install --frozen-lockfile
          MTPROTO_TARGET_MODE="$reviewed_mode" \
            MTPROTO_PRIVATE_ENDPOINT="$reviewed_endpoint" \
            MTPROTO_PRIVATE_RSA_PUBLIC_KEY_FILE="$reviewed_key" \
            pnpm exec vite build --outDir dist-private
          MTPROTO_TARGET_MODE="$reviewed_mode" \
            MTPROTO_PRIVATE_ENDPOINT="$reviewed_endpoint" \
            MTPROTO_PRIVATE_RSA_PUBLIC_KEY_FILE="$reviewed_key" \
            node scripts/private-artifact-release.mjs verify \
              --dist dist-private --commit "$WEB_SOURCE_SHA" --ref refs/heads/master
          jq -e --arg sha "$WEB_SOURCE_SHA" --arg digest "$WEB_ARTIFACT_DIGEST" \
            '.sourceCommit == $sha and .artifactDigest == $digest' dist-private/mtproto-target.json >/dev/null || {
              echo '::error::rebuilt web output differs from the green published artifact identity'
              exit 1
            }
          archive="$RUNNER_TEMP/demo-web-$WEB_SOURCE_SHA.tar.gz"
          tar -czf "$archive" -C dist-private .
          archive_sha256=$(sha256sum "$archive" | awk '{print $1}')
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            printf 'archive=%s\n' "$archive"
            printf 'archive_sha256=%s\n' "$archive_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Join the tailnet
        if: ${{ steps.demo-gate.outputs.enabled == 'true' }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-deploy
          ping: ${{ vars.DEMO_DEPLOY_HOST }}

      - name: Install the demo deploy key
        if: ${{ steps.demo-gate.outputs.enabled == 'true' }}
        env:
          DEMO_DEPLOY_SSH_KEY: ${{ secrets.DEMO_DEPLOY_SSH_KEY }}
          DEMO_DEPLOY_KNOWN_HOSTS: ${{ vars.DEMO_DEPLOY_KNOWN_HOSTS }}
          DEMO_DEPLOY_HOST: ${{ vars.DEMO_DEPLOY_HOST }}
          DEMO_DEPLOY_PORT: ${{ vars.DEMO_DEPLOY_PORT }}
        run: |
          [[ -n "$DEMO_DEPLOY_SSH_KEY" && -n "$DEMO_DEPLOY_KNOWN_HOSTS" && -n "$DEMO_DEPLOY_HOST" && -n "$DEMO_DEPLOY_PORT" ]]
          [[ "$DEMO_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEMO_DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          (( 10#$DEMO_DEPLOY_PORT >= 1 && 10#$DEMO_DEPLOY_PORT <= 65535 ))
          install -d -m 700 "$RUNNER_TEMP/ssh-demo"
          (umask 077 && printf '%s\n' "$DEMO_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh-demo/id_deploy")
          printf '%s\n' "$DEMO_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh-demo/known_hosts"

      - name: Deploy the tested server commit after the dev deploy
        if: ${{ steps.demo-gate.outputs.enabled == 'true' }}
        env:
          DEPLOY_SHA: ${{ needs.deploy.outputs.sha }}
          DEPLOY_IMAGE_DIGEST: ${{ steps.demo-image.outputs.digest }}
          DEMO_DEPLOY_HOST: ${{ vars.DEMO_DEPLOY_HOST }}
          DEMO_DEPLOY_PORT: ${{ vars.DEMO_DEPLOY_PORT }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          ssh -T -p "$DEMO_DEPLOY_PORT" -i "$RUNNER_TEMP/ssh-demo/id_deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh-demo/known_hosts" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "root@$DEMO_DEPLOY_HOST" "$DEPLOY_SHA $DEPLOY_IMAGE_DIGEST" </dev/null

      - name: Publish the pinned web artifact on the demo origin
        env:
          DEPLOY_SHA: ${{ needs.deploy.outputs.sha }}
          WEB_SOURCE_SHA: ${{ steps.web-release.outputs.source_commit }}
          WEB_ARTIFACT_DIGEST: ${{ steps.web-release.outputs.artifact_digest }}
          WEB_ARCHIVE_SHA256: ${{ steps.web-release.outputs.archive_sha256 }}
          WEB_ARCHIVE: ${{ steps.web-release.outputs.archive }}
          DEMO_DEPLOY_HOST: ${{ vars.DEMO_DEPLOY_HOST }}
          DEMO_DEPLOY_PORT: ${{ vars.DEMO_DEPLOY_PORT }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WEB_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WEB_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WEB_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ -s "$WEB_ARCHIVE" ]]
          ssh -T -p "$DEMO_DEPLOY_PORT" -i "$RUNNER_TEMP/ssh-demo/id_deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh-demo/known_hosts" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "root@$DEMO_DEPLOY_HOST" \
            "web $DEPLOY_SHA $WEB_SOURCE_SHA $WEB_ARTIFACT_DIGEST $WEB_ARCHIVE_SHA256" < "$WEB_ARCHIVE"

      - name: Remove the demo deploy key
        if: ${{ always() && steps.demo-gate.outputs.enabled == 'true' }}
        run: rm -rf "$RUNNER_TEMP/ssh-demo"
