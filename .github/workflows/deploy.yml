name: Deploy.

run-name: ${{ inputs.issue && format('{0} [{1}]', github.workflow, inputs.issue) || '' }}

# Deploys the exact commit whose CI passed on a push to main to the
# teagram-server LXC. The job never checks out code: the ssh command is that
# commit's SHA, and the key's forced command runs the stable
# deploy/telegram-server/deploy-main.sh bridge to that commit's canonical script.
# .github/scripts/test-deploy-workflow-contract.sh guards these triggers.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue key to report this run to (e.g. MAIN-123). Leave empty for no report."
        required: false
        type: string
        default: ""

permissions:
  contents: read

# One deploy at a time; GitHub keeps only the newest pending run.
concurrency:
  group: deploy-teagram-server
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy teagram-server
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: production
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    permissions:
      contents: read
      actions: read

    steps:
      # Late CI completions must not displace a newer successful descendant.
      - name: Resolve the tested commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha="$RUN_HEAD_SHA"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha')
          if [[ ! "$latest" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::no tested commit SHA to deploy (got '$latest')"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            sha="$latest"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::no tested commit SHA to deploy (got '$sha')"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$latest" --jq '.status')
            if [[ "$comparison" == ahead || "$comparison" == identical ]]; then
              sha="$latest"
            fi
          fi
          echo "deploying $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-deploy
          ping: 100.124.236.66

      - name: Install the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/id_deploy")
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"

      - name: Deploy the tested commit
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          ssh -T -i "$RUNNER_TEMP/ssh/id_deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            root@100.124.236.66 "$DEPLOY_SHA" </dev/null

      - name: Remove the deploy key
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/ssh"

  deploy-demo:
    name: deploy public demo
    needs: deploy
    if: ${{ needs.deploy.result == 'success' && vars.TEAGRAM_DEMO_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: demo
    permissions:
      contents: read

    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-deploy
          ping: ${{ vars.DEMO_DEPLOY_HOST }}

      - name: Install the demo deploy key
        env:
          DEMO_DEPLOY_SSH_KEY: ${{ secrets.DEMO_DEPLOY_SSH_KEY }}
          DEMO_DEPLOY_KNOWN_HOSTS: ${{ vars.DEMO_DEPLOY_KNOWN_HOSTS }}
          DEMO_DEPLOY_HOST: ${{ vars.DEMO_DEPLOY_HOST }}
          DEMO_DEPLOY_PORT: ${{ vars.DEMO_DEPLOY_PORT }}
        run: |
          [[ -n "$DEMO_DEPLOY_SSH_KEY" && -n "$DEMO_DEPLOY_KNOWN_HOSTS" && -n "$DEMO_DEPLOY_HOST" && -n "$DEMO_DEPLOY_PORT" ]]
          [[ "$DEMO_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEMO_DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          (( 10#$DEMO_DEPLOY_PORT >= 1 && 10#$DEMO_DEPLOY_PORT <= 65535 ))
          install -d -m 700 "$RUNNER_TEMP/ssh-demo"
          (umask 077 && printf '%s\n' "$DEMO_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh-demo/id_deploy")
          printf '%s\n' "$DEMO_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh-demo/known_hosts"

      - name: Deploy the tested commit after the dev deploy
        env:
          DEPLOY_SHA: ${{ needs.deploy.outputs.sha }}
          DEMO_DEPLOY_HOST: ${{ vars.DEMO_DEPLOY_HOST }}
          DEMO_DEPLOY_PORT: ${{ vars.DEMO_DEPLOY_PORT }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -T -p "$DEMO_DEPLOY_PORT" -i "$RUNNER_TEMP/ssh-demo/id_deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh-demo/known_hosts" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "root@$DEMO_DEPLOY_HOST" "$DEPLOY_SHA" </dev/null

      - name: Remove the demo deploy key
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/ssh-demo"
