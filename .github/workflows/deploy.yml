name: Deploy.

run-name: ${{ inputs.issue && format('{0} [{1}]', github.workflow, inputs.issue) || '' }}

# Deploys the exact commit whose CI passed on a push to main to the
# teagram-server LXC. The SSH command is the tested commit's SHA, and the key's
# forced command runs the stable deploy/telegram-server/deploy-main.sh bridge
# to that commit's canonical script. The canonical script runs the MTProto
# smoke from the deployed image on the host after readiness; the runner does
# not check out or run the smoke code. Its auth-key storage model is documented
# with the command. .github/scripts/test-deploy-workflow-contract.sh guards this flow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue key to report this run to (e.g. MAIN-123). Leave empty for no report."
        required: false
        type: string
        default: ""

permissions:
  contents: read

# One deploy at a time; GitHub keeps only the newest pending run.
concurrency:
  group: deploy-teagram-server
  cancel-in-progress: false

jobs:
  deploy-server:
    name: 'deploy: server (prod)'
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: production
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      ci_run_id: ${{ steps.target.outputs.ci_run_id }}
    permissions:
      contents: read
      actions: read

    steps:
      # Late CI completions must not displace a newer successful descendant.
      - name: Resolve the tested commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          sha="$RUN_HEAD_SHA"
          ci_run_id="$RUN_ID"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0] | [.head_sha, (.id | tostring)] | @tsv')
          IFS=$'\t' read -r latest_sha latest_run_id <<< "$latest"
          if [[ ! "$latest_sha" =~ ^[0-9a-f]{40}$ || ! "$latest_run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::no tested commit run to deploy (got '$latest')"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            sha="$latest_sha"
            ci_run_id="$latest_run_id"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::no tested commit SHA to deploy (got '$sha')"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$latest_sha" --jq '.status')
            if [[ "$comparison" == ahead || "$comparison" == identical ]]; then
              sha="$latest_sha"
              ci_run_id="$latest_run_id"
            fi
          fi
          if [[ ! "$ci_run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::no successful main CI run for $sha (got '$ci_run_id')"
            exit 1
          fi
          echo "deploying $sha from CI run $ci_run_id"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"

      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-deploy
          ping: 100.124.236.66

      - name: Install the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/id_deploy")
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"

      - name: Deploy the tested commit
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          ssh -T -i "$RUNNER_TEMP/ssh/id_deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            root@100.124.236.66 "$DEPLOY_SHA" </dev/null

      - name: Remove the deploy key
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/ssh"

  build-demo-web-resolve:
    name: 'build: demo-web-resolve'
    continue-on-error: true
    needs: deploy-server
    if: ${{ needs.deploy-server.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      deployable: ${{ steps.pin.outputs.deployable }}
      source_commit: ${{ steps.pin.outputs.source_commit }}
      artifact_digest: ${{ steps.pin.outputs.artifact_digest }}

    steps:
      - name: Check out the workflow source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Resolve the pinned web artifact
        id: pin
        run: |
          pin=$(python3 deploy/teagram-demo/resolve_web_artifact_pin.py --require-live-manifest)
          deployable=$(jq -er '.deployable | tostring' <<<"$pin")
          source_commit=$(jq -er '.sourceCommit' <<<"$pin")
          artifact_digest=$(jq -er '.artifactDigest' <<<"$pin")
          [[ "$deployable" == true || "$deployable" == false ]]
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            printf 'deployable=%s\n' "$deployable"
            printf 'source_commit=%s\n' "$source_commit"
            printf 'artifact_digest=%s\n' "$artifact_digest"
          } >> "$GITHUB_OUTPUT"

  deploy-demo:
    name: 'deploy: demo'
    continue-on-error: true
    needs:
      - deploy-server
      - build-demo-web-resolve
    if: ${{ always() && needs.deploy-server.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: demo
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check the demo deployment gate
        id: demo-gate
        env:
          TEAGRAM_DEMO_DEPLOY_ENABLED: ${{ vars.TEAGRAM_DEMO_DEPLOY_ENABLED }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          if [[ "$TEAGRAM_DEMO_DEPLOY_ENABLED" != 'true' ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Public demo deployment is disabled"
          elif [[ -z "$TS_OAUTH_CLIENT_ID" || -z "$TS_OAUTH_SECRET" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Public demo deployment skipped: Tailscale OAuth credentials are missing"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the web publication gate
        id: web-gate
        if: ${{ steps.demo-gate.outputs.enabled == 'true' }}
        env:
          DEMO_WEB_RESOLVER_RESULT: ${{ needs.build-demo-web-resolve.result }}
          DEMO_WEB_DEPLOYABLE: ${{ needs.build-demo-web-resolve.outputs.deployable }}
        run: |
          if [[ "$DEMO_WEB_RESOLVER_RESULT" == 'success' && "$DEMO_WEB_DEPLOYABLE" == 'true' ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pinned web publication is unavailable; the public server deployment will continue"
          fi

      - name: Resolve the tested image digest
        id: demo-image
        if: ${{ steps.demo-gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.deploy-server.outputs.ci_run_id }}
          DEPLOY_SHA: ${{ needs.deploy-server.outputs.sha }}
        run: |
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          artifact_dir="$RUNNER_TEMP/demo-image"
          mkdir -p "$artifact_dir"
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "demo-image-digest-$DEPLOY_SHA" --dir "$artifact_dir"
          [[ -f "$artifact_dir/demo-image-digest.txt" && ! -L "$artifact_dir/demo-image-digest.txt" ]]
          digest=$(<"$artifact_dir/demo-image-digest.txt")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Join the tailnet
        if: ${{ steps.demo-gate.outputs.enabled == 'true' }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-deploy
          ping: ${{ vars.DEMO_DEPLOY_HOST }}

      - name: Install the demo deploy key
        if: ${{ steps.demo-gate.outputs.enabled == 'true' }}
        env:
          DEMO_DEPLOY_SSH_KEY: ${{ secrets.DEMO_DEPLOY_SSH_KEY }}
          DEMO_DEPLOY_KNOWN_HOSTS: ${{ vars.DEMO_DEPLOY_KNOWN_HOSTS }}
          DEMO_DEPLOY_HOST: ${{ vars.DEMO_DEPLOY_HOST }}
          DEMO_DEPLOY_PORT: ${{ vars.DEMO_DEPLOY_PORT }}
        run: |
          [[ -n "$DEMO_DEPLOY_SSH_KEY" && -n "$DEMO_DEPLOY_KNOWN_HOSTS" && -n "$DEMO_DEPLOY_HOST" && -n "$DEMO_DEPLOY_PORT" ]]
          [[ "$DEMO_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEMO_DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          (( 10#$DEMO_DEPLOY_PORT >= 1 && 10#$DEMO_DEPLOY_PORT <= 65535 ))
          install -d -m 700 "$RUNNER_TEMP/ssh-demo"
          (umask 077 && printf '%s\n' "$DEMO_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh-demo/id_deploy")
          printf '%s\n' "$DEMO_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh-demo/known_hosts"

      - name: Deploy the tested server commit after the dev deploy
        if: ${{ steps.demo-gate.outputs.enabled == 'true' }}
        env:
          DEPLOY_SHA: ${{ needs.deploy-server.outputs.sha }}
          DEPLOY_IMAGE_DIGEST: ${{ steps.demo-image.outputs.digest }}
          DEMO_DEPLOY_HOST: ${{ vars.DEMO_DEPLOY_HOST }}
          DEMO_DEPLOY_PORT: ${{ vars.DEMO_DEPLOY_PORT }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          ssh -T -p "$DEMO_DEPLOY_PORT" -i "$RUNNER_TEMP/ssh-demo/id_deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh-demo/known_hosts" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "root@$DEMO_DEPLOY_HOST" "$DEPLOY_SHA $DEPLOY_IMAGE_DIGEST" </dev/null

      - name: Download the web artifact from tested CI
        id: demo-web-artifact
        if: ${{ steps.web-gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.deploy-server.outputs.ci_run_id }}
          WEB_SOURCE_SHA: ${{ needs.build-demo-web-resolve.outputs.source_commit }}
        run: |
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$WEB_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          artifact_dir="$RUNNER_TEMP/demo-web-artifact"
          mkdir -p "$artifact_dir"
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "demo-web-release-$WEB_SOURCE_SHA" --dir "$artifact_dir"
          archive="$artifact_dir/demo-web-$WEB_SOURCE_SHA.tar.gz"
          checksum_file="$archive.sha256"
          [[ -f "$archive" && ! -L "$archive" && -f "$checksum_file" && ! -L "$checksum_file" ]]
          archive_sha256=$(<"$checksum_file")
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          actual_sha256=$(sha256sum "$archive" | awk '{print $1}')
          [[ "$actual_sha256" == "$archive_sha256" ]]
          {
            printf 'archive=%s\n' "$archive"
            printf 'archive_sha256=%s\n' "$archive_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Fail if the pinned web publication is not deployable
        if: ${{ steps.demo-gate.outputs.enabled == 'true' && steps.web-gate.outputs.enabled != 'true' }}
        run: |
          echo "::error::Public server deployed, but the published web pin does not match the live web manifest"
          exit 1

      - name: Publish the pinned web artifact on the demo origin
        if: ${{ steps.web-gate.outputs.enabled == 'true' }}
        env:
          DEPLOY_SHA: ${{ needs.deploy-server.outputs.sha }}
          WEB_SOURCE_SHA: ${{ needs.build-demo-web-resolve.outputs.source_commit }}
          WEB_ARTIFACT_DIGEST: ${{ needs.build-demo-web-resolve.outputs.artifact_digest }}
          WEB_ARCHIVE_SHA256: ${{ steps.demo-web-artifact.outputs.archive_sha256 }}
          WEB_ARCHIVE: ${{ steps.demo-web-artifact.outputs.archive }}
          DEMO_DEPLOY_HOST: ${{ vars.DEMO_DEPLOY_HOST }}
          DEMO_DEPLOY_PORT: ${{ vars.DEMO_DEPLOY_PORT }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WEB_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WEB_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WEB_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ -s "$WEB_ARCHIVE" ]]
          ssh -T -p "$DEMO_DEPLOY_PORT" -i "$RUNNER_TEMP/ssh-demo/id_deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh-demo/known_hosts" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "root@$DEMO_DEPLOY_HOST" \
            "web $DEPLOY_SHA $WEB_SOURCE_SHA $WEB_ARTIFACT_DIGEST $WEB_ARCHIVE_SHA256" < "$WEB_ARCHIVE"

      - name: Remove the demo deploy key
        if: ${{ always() && steps.demo-gate.outputs.enabled == 'true' }}
        run: rm -rf "$RUNNER_TEMP/ssh-demo"
