# Disposable-only local backend for mixed-trust smoke coverage. The test keeps
# every serving replica on the initialized local authority; it never performs
# an S3 mode transition.
x-local-blob-validation: &local-blob-validation
  TG_BLOB_DIR: /var/lib/teagramd-blobs
  TG_BLOB_S3_ENDPOINT: ""
  TG_BLOB_S3_BUCKET: ""
  TG_BLOB_S3_PREFIX: ""
  TG_BLOB_S3_REGION: ""
  TG_BLOB_S3_ACCESS_KEY_ID: ""
  TG_BLOB_S3_SECRET_ACCESS_KEY: ""
  TG_BLOB_S3_SECRET_ACCESS_KEY_FILE: ""
  TG_BLOB_S3_CA_PATH: ""
  TG_BLOB_S3_ALLOW_INSECURE_HTTP: ""

services:
  teagramd-proxy-1:
    environment: *local-blob-validation
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      tcp-proxy:
        condition: service_started
    secrets: !reset []
    volumes:
      - tgblobs:/var/lib/teagramd-blobs

  teagramd-proxy-2:
    environment: *local-blob-validation
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      tcp-proxy:
        condition: service_started
    secrets: !reset []
    volumes:
      - tgblobs:/var/lib/teagramd-blobs
