# Local and single-LXC stack: Postgres, migrations, RustFS, and the server.
# Existing blob-mode authorities always control serving. A first S3 boot may
# use an empty authority directory; all nonempty authority state is validated,
# and existing `s3-accepted` data stays plaintext.
#
# `docker compose down` keeps the named volumes, including RustFS media, which
# makes a restart uneventful. `down -v` destroys persistent state and must not
# be used on the teagram-server deployment.

name: teagram

# The password has exactly one source, .env, and the DSN exactly one definition
# here — migrate and teagramd must never be able to reach different databases.
# The :? form aborts the whole run before a container starts and names the cause;
# without it an unset variable interpolates to empty and the first symptom is a
# confusing Postgres error.
x-dsn: &dsn "postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/teagram?sslmode=disable"

x-blob-s3: &blob-s3
  TG_BLOB_S3_ENDPOINT: http://rustfs:9000
  TG_BLOB_S3_BUCKET: teagram
  TG_BLOB_S3_PREFIX: ${TG_BLOB_S3_PREFIX:-teagramd/}
  TG_BLOB_S3_REGION: us-east-1
  TG_BLOB_S3_ACCESS_KEY_ID: ${TG_BLOB_S3_ACCESS_KEY_ID:-}
  TG_BLOB_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/teagramd-blob-secret-key
  # RustFS is reachable only through its isolated Compose network. The server
  # rejects plaintext S3 endpoints unless this explicit private-network opt-in
  # is set; no RustFS port is published on the host.
  TG_BLOB_S3_ALLOW_INSECURE_HTTP: "true"

x-media-keys: &media-keys
  TG_MEDIA_KEY_DIR: /run/teagramd/media-keys
  TG_MEDIA_KEY_CURRENT: ${TG_MEDIA_KEY_CURRENT:-1}

services:
  # MAIN-1974 restores the PostgreSQL 16 source volume into this PostgreSQL 18
  # layout during the stack move.
  postgres:
    image: mirror.gcr.io/library/postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: teagram
      PGDATA: /var/lib/postgresql/18/docker
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    # An open port is not readiness: Postgres accepts connections during its own
    # init and then drops them. migrate waits on this instead of racing it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teagram"]
      interval: 2s
      timeout: 5s
      retries: 20
    # No ports: on purpose. The server reaches Postgres by service name on the
    # compose network, and psql is `docker compose exec postgres psql -U postgres
    # teagram` — so publishing 5432 would buy nothing and put the database on
    # every interface of the host.
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro

  # Applies the migrations and exits 0. No restart policy: a re-run against an
  # already migrated database is a no-op, so a restart loop could only hide a
  # real failure.
  migrate:
    # Pinned to the version the ariga/setup-atlas steps in ci.yml use, so the
    # stack and CI cannot apply migrations with different atlas versions.
    image: mirror.gcr.io/arigaio/atlas:1.2.0-alpine
    # The image entrypoint is already atlas, so the command starts at `migrate`.
    # Not `--env local`: that env's dev database is docker://postgres/18, which
    # would need a Docker daemon inside this container. Three slashes in
    # file:///migrations — an absolute path, because the working directory here
    # is not the repo root.
    command:
      - migrate
      - apply
      - --dir
      - file:///migrations
      - --url
      - *dsn
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  rustfs:
    # The multi-platform digest selects the verified amd64 CI image or the
    # arm64 production image without allowing either tag to move.
    image: mirror.gcr.io/rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs-root-access-key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs-root-secret-key
      RUSTFS_OBS_LOGGER_LEVEL: warn
    secrets:
      - source: rustfs_root_access_key
        target: rustfs-root-access-key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: rustfs_root_secret_key
        target: rustfs-root-secret-key
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      - rustfsdata:/data
    networks:
      - rustfs_private
    # Ready is checked before the idempotent bucket and user initialization.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # The S3 API and disabled console are internal container ports. Intentionally
    # do not publish either one on the LXC or a developer workstation.

  rustfs-init:
    image: teagramd-mc-init:local
    build:
      context: .
      dockerfile: Dockerfile.mc
    entrypoint: ["/bin/sh", "/usr/local/bin/rustfs-init.sh"]
    environment:
      TG_BLOB_S3_ACCESS_KEY_ID: ${TG_BLOB_S3_ACCESS_KEY_ID:-}
    # Match the hyphenated paths used by RustFS and the mc initialization command.
    secrets:
      - source: rustfs_root_access_key
        target: rustfs-root-access-key
      - source: rustfs_root_secret_key
        target: rustfs-root-secret-key
      - source: teagramd_blob_secret_key
        target: teagramd-blob-secret-key
    volumes:
      - ./deploy/rustfs/teagramd-blob.json:/policy/teagramd-blob.json:ro
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - rustfs_private

  # Explicit one-time migration service. It reads tgblobs read-only and writes
  # only to the configured RustFS namespace. It is never part of `compose up`.
  blob-migrate:
    image: teagramd:local
    entrypoint: ["/usr/local/bin/blob-migrate"]
    command: ["--source", "/source"]
    environment: *blob-s3
    secrets:
      - source: teagramd_blob_secret_key
        target: teagramd-blob-secret-key
    volumes:
      - tgblobs:/source:ro
    profiles: ["migration"]
    networks:
      - rustfs_private
    depends_on:
      rustfs-init:
        condition: service_completed_successfully

  # Rollback counterpart to blob-migrate. It reads the scoped RustFS namespace
  # and writes checksum-verified objects into the retained local volume while
  # teagramd is stopped. It is never part of `compose up`.
  blob-restore:
    image: teagramd:local
    entrypoint: ["/usr/local/bin/blob-migrate"]
    command: ["--direction", "s3-to-local", "--destination", "/destination"]
    environment: *blob-s3
    secrets:
      - source: teagramd_blob_secret_key
        target: teagramd-blob-secret-key
    volumes:
      - tgblobs:/destination
    profiles: ["migration"]
    networks:
      - rustfs_private
    depends_on:
      rustfs-init:
        condition: service_completed_successfully

  # One-time accepted-plaintext to encrypted-media transition. Run only after
  # writers have been stopped or drained; this root-owned job can publish the
  # shared authority. Plaintext removal requires a separate --cleanup run.
  blob-encrypt-migrate:
    image: teagramd:local
    entrypoint: ["/usr/local/bin/blob-encrypt-migrate"]
    user: "0:0"
    read_only: true
    environment:
      TG_POSTGRES_DSN: *dsn
      TG_AUTHKEY_ENC_KEY: ${TG_AUTHKEY_ENC_KEY:-}
      TG_AUTHKEY_ENC_KEY_FILE: ${TG_AUTHKEY_ENC_KEY_FILE:-/var/lib/teagramd/enc_key.hex}
      TG_BLOB_DIR: /var/lib/teagramd-blobs
      <<: [*blob-s3, *media-keys]
    secrets:
      - source: teagramd_blob_secret_key
        target: teagramd-blob-secret-key
    volumes:
      - tgkey:/var/lib/teagramd:ro
      - type: bind
        source: ./.state/blob-mode
        target: /run/teagramd/blob-mode
        bind:
          create_host_path: false
      - type: bind
        source: ${TEAGRAM_BLOB_MODE_REPORT_ROOT:-/root}
        target: /run/teagramd/reports
        bind:
          create_host_path: false
      - type: bind
        source: ${TEAGRAM_MEDIA_KEY_SOURCE_DIR:-/etc/teagramd/media-keys}
        target: /run/teagramd/media-keys
        read_only: true
        bind:
          create_host_path: false
    profiles: ["migration"]
    networks:
      - default
      - rustfs_private
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  # One-time encrypted-media key rotation. The authority is read-only: this
  # operator rewraps objects but never publishes or changes blob-mode authority.
  blob-key-rotate:
    image: teagramd:local
    entrypoint: ["/usr/local/bin/blob-key-rotate"]
    user: "0:0"
    read_only: true
    environment:
      TG_POSTGRES_DSN: *dsn
      TG_AUTHKEY_ENC_KEY: ${TG_AUTHKEY_ENC_KEY:-}
      TG_AUTHKEY_ENC_KEY_FILE: ${TG_AUTHKEY_ENC_KEY_FILE:-/var/lib/teagramd/enc_key.hex}
      TG_BLOB_DIR: /var/lib/teagramd-blobs
      <<: [*blob-s3, *media-keys]
    secrets:
      - source: teagramd_blob_secret_key
        target: teagramd-blob-secret-key
    volumes:
      - tgkey:/var/lib/teagramd:ro
      - type: bind
        source: ./.state/blob-mode
        target: /run/teagramd/blob-mode
        read_only: true
        bind:
          create_host_path: false
      - blob_key_rotate_reports:/run/teagramd/reports
      - type: bind
        source: ${TEAGRAM_MEDIA_KEY_SOURCE_DIR:-/etc/teagramd/media-keys}
        target: /run/teagramd/media-keys
        read_only: true
        bind:
          create_host_path: false
    profiles: ["migration"]
    networks:
      - default
      - rustfs_private
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  teagramd:
    # Built from the repo-root Dockerfile: nothing is published to a registry, so
    # there is no image to pull. The explicit tag is what lets a build done
    # outside compose — CI builds it with a layer cache — be picked up here
    # instead of rebuilt; without it the name would follow the project directory.
    build:
      context: .
      args:
        TEAGRAMD_SOURCE_REVISION: ${TEAGRAMD_SOURCE_REVISION:-}
    image: teagramd:local
    # Keep logs on the LXC across container replacement. The host syslog daemon
    # rotates /var/log/messages with a bounded 8 GiB history.
    logging:
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"
        syslog-facility: daemon
        syslog-format: rfc5424
        tag: teagramd
    # The server's bounded TCP/WebSocket drain is 90 seconds. Keep the
    # container alive long enough for that drain to complete before Docker's
    # final kill.
    stop_grace_period: 120s
    networks:
      - default
      - rustfs_private
    environment:
      TG_POSTGRES_DSN: *dsn
      # Required so the stack never falls back to an official public origin.
      TG_PUBLIC_LINK_PREFIX: ${TG_PUBLIC_LINK_PREFIX:?set TG_PUBLIC_LINK_PREFIX in .env}
      # These identity settings are optional for a legacy single-replica stack.
      # Replica deployments must set both: the fingerprint pins every process
      # to the same RSA identity, while the encryption key opens stored auth
      # keys. Any fingerprint-pinned deployment must provision its encryption
      # key; serving never generates an RSA identity or a pinned master key.
      TG_RSA_KEY_FINGERPRINT: ${TG_RSA_KEY_FINGERPRINT:-}
      TG_AUTHKEY_ENC_KEY: ${TG_AUTHKEY_ENC_KEY:-}
      # Interpolated, not hardcoded: the default is the tgkey volume, and an
      # operator who sets the variable in .env gets their path instead. Point it
      # outside /var/lib/teagramd or /var/lib/teagramd-blobs and the server
      # cannot write it — the container root is read_only. Pinned deployments
      # read this path only; they do not generate a missing key file.
      TG_AUTHKEY_ENC_KEY_FILE: ${TG_AUTHKEY_ENC_KEY_FILE:-/var/lib/teagramd/enc_key.hex}
      # Legacy diagnostic only: current username/password sign-in does not use
      # phone codes. Keep cleartext phone/code values out of retained logs.
      TG_LOG_LOGIN_CODES: "false"
      # Registration is closed by default. Set TG_REGISTRATION=open in .env
      # while creating the first account through auth.signUp, then change it
      # back to closed before exposing the stack.
      TG_REGISTRATION: ${TG_REGISTRATION:-closed}
      TG_TURNSTILE_TEST_MODE: ${TG_TURNSTILE_TEST_MODE:-false}
      TG_TURNSTILE_HOSTNAMES: "${TG_TURNSTILE_HOSTNAMES:-web.teagram.io}"
      # User-issued invites stay disabled unless the operator sets a quota.
      TG_USER_INVITE_QUOTA: ${TG_USER_INVITE_QUOTA:-}
      # The separately bound public WebSocket endpoint is disabled by default
      # and keeps sign-up closed unless its own policy is configured.
      TG_PUBLIC_WEBSOCKET_LISTEN_ADDR: ${TG_PUBLIC_WEBSOCKET_LISTEN_ADDR:-}
      TG_PUBLIC_WEBSOCKET_ADVERTISE_ADDR: ${TG_PUBLIC_WEBSOCKET_ADVERTISE_ADDR:-}
      TG_PUBLIC_REGISTRATION: ${TG_PUBLIC_REGISTRATION:-closed}
      TG_PUBLIC_WEBSOCKET_ALLOWED_ORIGINS: ${TG_PUBLIC_WEBSOCKET_ALLOWED_ORIGINS:-}
      TG_WELCOME_CHANNEL: ${TG_WELCOME_CHANNEL:-}
      TG_REPLICA_ID: ${TG_REPLICA_ID:-}
      # Keep the Compose deployment count aligned across the legacy listener
      # and any explicitly enabled replacement replicas. The default remains
      # the existing single-replica behavior.
      TG_REPLICA_COUNT: ${TG_REPLICA_COUNT:-1}
      # Public auth Turnstile is optional on this stack. Only the app-facing
      # site key and mounted-file path enter the container; the host secret
      # source path stays on the Compose side.
      TG_TURNSTILE_SITE_KEY: ${TEAGRAM_TURNSTILE_SITE_KEY:-}
      TG_TURNSTILE_SECRET_KEY_FILE: ${TEAGRAM_TURNSTILE_SECRET_KEY_FILE:+/run/secrets/teagramd-turnstile}
      TG_TURNSTILE_QA_BYPASS_TOKEN_FILE: ""
      TG_TURNSTILE_SIGNIN_ENABLED: ${TG_TURNSTILE_SIGNIN_ENABLED:-false}
      # The ordinary listener trusts its direct socket peer. The opt-in proxy
      # overlay changes only its replacement services to proxy-v2 trust.
      TG_CLIENT_ADDR_TRUST: socket
      # Empty values preserve the binary defaults; operators can tune each
      # key-exchange budget through the deployment environment.
      TG_RATE_LIMIT_KEY_EXCHANGE_IP: ${TG_RATE_LIMIT_KEY_EXCHANGE_IP:-}
      TG_RATE_LIMIT_KEY_EXCHANGE_IP_TAILNET: ${TG_RATE_LIMIT_KEY_EXCHANGE_IP_TAILNET:-}
      TG_RATE_LIMIT_KEY_EXCHANGE_IP_WINDOW: ${TG_RATE_LIMIT_KEY_EXCHANGE_IP_WINDOW:-}
      TG_KEY_EXCHANGE_PER_CONNECTION: ${TG_KEY_EXCHANGE_PER_CONNECTION:-}
      TG_KEY_EXCHANGE_GLOBAL_RATE: ${TG_KEY_EXCHANGE_GLOBAL_RATE:-}
      TG_KEY_EXCHANGE_GLOBAL_BURST: ${TG_KEY_EXCHANGE_GLOBAL_BURST:-}
      # Retain the local data volume for the later verified transition and
      # recovery while the default backend uses S3.
      TG_BLOB_DIR: /var/lib/teagramd-blobs
      <<: [*blob-s3, *media-keys]
    ports:
      # Loopback only. 2443 is unauthenticated at the transport layer, so whoever
      # reaches it feeds chosen bytes into the MTProto decode path before any
      # identity check exists. Docker publishes on 0.0.0.0 by default through a
      # DNAT rule the host firewall never sees, so "2443:2443" would hand this
      # server to the whole network the laptop is on.
      - "127.0.0.1:2443:2443"
      # The public WebSocket listener is reached through the host-side tunnel.
      - "127.0.0.1:2446:2446"
    # TG_LISTEN_ADDR and TG_ADVERTISE_ADDR are both deliberately unset. The
    # listen default :2443 binds every interface in the container, and with no
    # advertise address set the DC address derives from it as 127.0.0.1:2443,
    # which is right for this stack: the only client is on the host and arrives
    # through the published port above. A client reached from anywhere else sets
    # TG_ADVERTISE_ADDR to the name it dials.
    #
    # Proven by the docker job in ci.yml, which already boots this image
    # --read-only: the static binary writes nothing but its key files.
    read_only: true
    volumes:
      # The key volume inherits mode 0700 and uid 65532 from the image. It is
      # the only writable mount; the S3 secret and retained legacy media below
      # are read-only. The runner-owned authority directory stays root-owned
      # and is mounted read-only so the server cannot change its backend mode.
      - tgkey:/var/lib/teagramd
      - tgblobs:/var/lib/teagramd-blobs:ro
      - ./.state/blob-mode:/run/teagramd/blob-mode:ro
      - type: bind
        source: ${TEAGRAM_MEDIA_KEY_SOURCE_DIR:-/etc/teagramd/media-keys}
        target: /run/teagramd/media-keys
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - source: teagramd_blob_secret_key
        target: teagramd-blob-secret-key
      - source: teagramd_turnstile
        target: teagramd-turnstile
    # store.Open refuses to start against an unmigrated schema
    # (internal/store/store.go:69), so the ordering is load-bearing, not cosmetic.
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  tgkey:
  # Retained local data for the later verified transition and recovery. The
  # default S3 render mounts it read-only; the local overlay writes it.
  tgblobs:
  rustfsdata:
  blob_key_rotate_reports:
    name: teagram_blob_key_rotate_reports
    driver: local

networks:
  # `internal` blocks external routing from attached containers. The isolated
  # gateway mode also removes the host bridge address, so host processes cannot
  # reach RustFS by its container IP.
  rustfs_private:
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated

secrets:
  rustfs_root_access_key:
    environment: RUSTFS_ROOT_ACCESS_KEY
  rustfs_root_secret_key:
    environment: RUSTFS_ROOT_SECRET_KEY
  teagramd_blob_secret_key:
    # File-backed so Compose can mount the key into teagramd's read-only root.
    file: ./.secrets/teagramd-blob-secret-key
  teagramd_turnstile:
    # /dev/null keeps the default-off stack renderable when no public auth
    # credentials are configured. When set, the source file must be readable
    # by the non-root teagramd uid (65532); keep it under a mode-0700 .secrets
    # directory and use mode 0444, as for the existing app secret.
    file: ${TEAGRAM_TURNSTILE_SECRET_KEY_FILE:-/dev/null}
