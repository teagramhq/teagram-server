  qa-invite-migrate:
    profiles: [qa-invite]
    image: mirror.gcr.io/arigaio/atlas:1.3.0-alpine@sha256:bb21d31eaf260e43513a35b87be575cecf8ab556795aa8c039e7bb3b43bdd3fe
    platform: linux/amd64
    mem_limit: 192m
    memswap_limit: 192m
    cpus: "0.25"
    pids_limit: 48
    command:
      - migrate
      - apply
      - --dir
      - file:///migrations
      - --url
      - postgres://postgres:${POSTGRES_PASSWORD:-}@qa-invite-postgres:5432/teagram?sslmode=disable
    volumes:
      - type: bind
        source: ./migrations
        target: /migrations
        read_only: true
    depends_on:
      qa-invite-postgres:
        condition: service_healthy
    networks: [qa_invite_backend]
    logging: *demo-logging

  qa-invite-teagramd:
    profiles: [qa-invite]
    image: ${TEAGRAM_QA_INVITE_IMAGE_REF:-teagramd:local}
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "1.0"
    pids_limit: 192
    stop_grace_period: 30s
    environment:
      TG_POSTGRES_DSN: postgres://postgres:${POSTGRES_PASSWORD:-}@qa-invite-postgres:5432/teagram?sslmode=disable
      TG_PUBLIC_LINK_PREFIX: https://teagram-demo.incus/
      TG_LISTEN_ADDR: ":2443"
      TG_ADVERTISE_ADDR: teagram-demo.incus:443
      TG_WEBSOCKET_LISTEN_ADDR: ""
      TG_WEBSOCKET_ALLOWED_ORIGINS: ""
      TG_PUBLIC_WEBSOCKET_LISTEN_ADDR: ":2446"
      TG_PUBLIC_WEBSOCKET_ADVERTISE_ADDR: teagram-demo.incus:443
      TG_PUBLIC_WEBSOCKET_ALLOWED_ORIGINS: https://web.teagram.io,https://teagram-demo.incus
      TG_CLIENT_ADDR_TRUST: cf-connecting-ip
      TG_CLIENT_ADDR_CF_PROXY_CIDRS: 198.18.131.3/32
      TG_REGISTRATION: invite
      TG_USER_INVITE_QUOTA: "5"
      TG_USER_INVITE_MIN_ACCOUNT_AGE: 0
      TG_PUBLIC_REGISTRATION: invite
      TG_TURNSTILE_SIGNIN_ENABLED: "false"
      TG_LOG_LOGIN_CODES: "false"
      TG_AUTHKEY_ENC_KEY: ${TG_AUTHKEY_ENC_KEY:-}
      TG_AUTHKEY_ENC_KEY_FILE: /var/lib/teagramd/enc_key.hex
      TG_RSA_KEY_PATH: /var/lib/teagramd/server_key.pem
      TG_STICKER_IMPORT: "off"
      TG_UPLOADS_DISABLED: "true"
      TG_BLOB_DIR: /var/lib/teagramd-blobs
      TG_MAX_FILE_BYTES: "16777216"
      TG_MAX_USER_STORAGE_BYTES: "268435456"
      GOMAXPROCS: "1"
      GOMEMLIMIT: 384MiB
    read_only: true
    volumes:
      - qa_invite_tgkey:/var/lib/teagramd
      - qa_invite_tgblobs:/var/lib/teagramd-blobs
    depends_on:
      qa-invite-migrate:
        condition: service_completed_successfully
    networks:
      qa_invite_backend:
        aliases: [teagramd]
    restart: unless-stopped
    logging: *demo-logging

  qa-invite-tls-edge:
    profiles: [qa-invite]
    image: mirror.gcr.io/library/nginx:1.28.0-alpine@sha256:09ab424a8c788f8d0fe3a64429f6d19dfa526885c8609b748d0943a75dcb9f8c
    platform: linux/amd64
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: "0.25"
    pids_limit: 48
    tmpfs: ["/var/cache/nginx:size=16m,uid=101,gid=101,mode=0750"]
    volumes:
      - type: bind
        source: ${TEAGRAM_QA_INVITE_STATE_DIR:-/nonexistent}/tmp/tls-edge
        target: /tmp
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/qa-invite/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ${TEAGRAM_QA_INVITE_STATE_DIR:-/nonexistent}/tls/identity/public
        target: /run/qa-invite/tls
        read_only: true
      - type: bind
        source: ${TEAGRAM_QA_INVITE_STATE_DIR:-/nonexistent}/client
        target: /run/qa-invite/client
        read_only: true
      - type: bind
        source: ${TEAGRAM_QA_INVITE_PUBLIC_CLIENT_DIR:-/opt/teagram-demo/.state/teagram-demo/public-client}
        target: /usr/share/nginx/html/.well-known/teagramd
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:9443/.well-known/teagramd/client"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      qa-invite-teagramd:
        condition: service_started
    networks:
      qa_invite_backend:
        ipv4_address: 198.18.131.3
        aliases: [tls-edge]
    restart: unless-stopped
    logging: *demo-logging

  qa-invite-haproxy:
    profiles: [qa-invite]
    image: mirror.gcr.io/library/haproxy:3.2-alpine@sha256:51f173c6825753d9e3a888b1004a1c2cb730936cc9178730a5c555246bd161a2
    platform: linux/amd64
    user: "584792:584792"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: "0.25"
    pids_limit: 48
    ports:
      - "${TEAGRAM_QA_INVITE_BIND_ADDRESS:-127.0.0.1}:443:8444/tcp"
    volumes:
      - type: bind
        source: ${TEAGRAM_QA_INVITE_STATE_DIR:-/nonexistent}/tmp/haproxy
        target: /tmp
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/qa-invite/haproxy.cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
        read_only: true
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      qa-invite-tls-edge:
        condition: service_healthy
    networks:
      qa_invite_backend:
        ipv4_address: 198.18.131.2
      qa_invite_publish: {}
    restart: unless-stopped
    logging: *demo-logging

volumes:
  pgdata:
  tgkey:
  # Retained local data for the later verified transition and recovery. The
  # default S3 render mounts it read-only; the local stack writes its own volume.
  tgblobs:
    name: teagram-demo_tgblobs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${TEAGRAM_DEMO_BLOB_PATH:-/nonexistent}
  local_tgblobs:
    name: teagram_tgblobs
  qa_invite_pgdata:
    name: ${TEAGRAM_QA_INVITE_PROJECT_NAME:-teagram-qa-invite}-postgres
    external: true
  qa_invite_tgkey:
    name: ${TEAGRAM_QA_INVITE_PROJECT_NAME:-teagram-qa-invite}-identity
    external: true
  qa_invite_tgblobs:
    name: ${TEAGRAM_QA_INVITE_PROJECT_NAME:-teagram-qa-invite}-blobs
    external: true
  rustfsdata:
  bot_api_socket:
  blob_key_rotate_reports:
    name: teagram_blob_key_rotate_reports
    driver: local

networks:
  bot_api_ingress:
    driver: bridge
    enable_ipv6: false
  # `internal` blocks external routing from attached containers. The isolated
  # gateway mode also removes the host bridge address, so host processes cannot
  # reach RustFS by its container IP.
  rustfs_private:
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated

  backend:
    internal: true
    ipam:
      config:
        - subnet: 198.18.130.0/24
          ip_range: 198.18.130.128/26
  edge:
    driver: bridge
  egress:
    driver: bridge
  browser-internal:
    name: teagram-browser-acceptance-internal
    internal: true
  observer-egress:
    name: teagram-browser-acceptance-egress
    driver: bridge
  web-edge:
    name: teagram-web-edge-net
    external: true
  private-edge:
    internal: true
  landing-publish:
    driver: bridge
    internal: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  control-web-edge:
    internal: true
  control-private-edge:
    internal: true
  control-landing-publish:
    driver: bridge
    internal: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  qa_invite_backend:
    name: ${TEAGRAM_QA_INVITE_PROJECT_NAME:-teagram-qa-invite}_backend
    internal: true
    ipam:
      config:
        - subnet: 198.18.131.0/24
          ip_range: 198.18.131.128/26
  qa_invite_publish:
    name: ${TEAGRAM_QA_INVITE_PROJECT_NAME:-teagram-qa-invite}_publish
    driver: bridge
    internal: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

secrets:
  rustfs_root_access_key:
    environment: RUSTFS_ROOT_ACCESS_KEY
  rustfs_root_secret_key:
    environment: RUSTFS_ROOT_SECRET_KEY
  teagramd_blob_secret_key:
    # File-backed so Compose can mount the key into teagramd's read-only root.
    file: ./.secrets/teagramd-blob-secret-key
  teagramd_turnstile:
    # /dev/null keeps the default-off stack renderable when no public auth
    # credentials are configured. When set, the source file must be readable
    # by the non-root teagramd uid (65532); keep it under a mode-0700 .secrets
    # directory and use mode 0444, as for the existing app secret.
    file: ${TEAGRAM_TURNSTILE_SECRET_KEY_FILE:-/dev/null}
  teagram_demo_turnstile:
    file: ${TEAGRAM_DEMO_TURNSTILE_SECRET_KEY_FILE:-/dev/null}
  teagram_demo_turnstile_qa_bypass:
    file: /var/lib/teagram-demo/secrets/turnstile-qa-bypass-token
