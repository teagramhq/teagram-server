# Local backend overlay for the guarded initial-local rollout. Select it with
# COMPOSE_FILE when invoking the runner; it keeps RustFS data available for a
# later separately reviewed transition.
services:
  telegramd:
    environment:
      TG_BLOB_DIR: /var/lib/telegramd-blobs
      TG_BLOB_S3_ENDPOINT: ""
      TG_BLOB_S3_BUCKET: ""
      TG_BLOB_S3_PREFIX: ""
      TG_BLOB_S3_REGION: ""
      TG_BLOB_S3_ACCESS_KEY_ID: ""
      TG_BLOB_S3_SECRET_ACCESS_KEY: ""
      TG_BLOB_S3_SECRET_ACCESS_KEY_FILE: ""
      TG_BLOB_S3_CA_PATH: ""
      TG_BLOB_S3_ALLOW_INSECURE_HTTP: ""
    volumes:
      - tgblobs:/var/lib/telegramd-blobs
