# Rollback override for a deployment whose legacy tgblobs volume is still
# present. Use only after stopping the normal stack; it re-enables the local
# store while keeping the RustFS volume intact for a later retry.
services:
  telegramd:
    environment:
      TG_BLOB_DIR: /var/lib/telegramd-blobs
      TG_BLOB_S3_ENDPOINT: ""
      TG_BLOB_S3_BUCKET: ""
      TG_BLOB_S3_PREFIX: ""
      TG_BLOB_S3_REGION: ""
      TG_BLOB_S3_ACCESS_KEY_ID: ""
      TG_BLOB_S3_SECRET_ACCESS_KEY: ""
      TG_BLOB_S3_SECRET_ACCESS_KEY_FILE: ""
      TG_BLOB_S3_CA_PATH: ""
      TG_BLOB_S3_ALLOW_INSECURE_HTTP: ""
    volumes:
      - tgblobs:/var/lib/telegramd-blobs
