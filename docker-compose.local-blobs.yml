# Local backend overlay for the guarded initial-local rollout. Select it with
# COMPOSE_FILE when invoking the runner. RustFS stays under the migration
# profile, preserving transition tooling and data without requiring credentials
# for the local server.
services:
  rustfs:
    profiles: ["migration"]
  rustfs-init:
    profiles: ["migration"]
  teagramd:
    environment:
      TG_BLOB_DIR: ${TEAGRAMD_STACK_MOVE_BLOB_DIR:-/var/lib/teagramd-blobs}
      TG_BLOB_S3_ENDPOINT: !reset null
      TG_BLOB_S3_BUCKET: !reset null
      TG_BLOB_S3_PREFIX: !reset null
      TG_BLOB_S3_REGION: !reset null
      TG_BLOB_S3_ACCESS_KEY_ID: !reset null
      TG_BLOB_S3_SECRET_ACCESS_KEY: !reset null
      TG_BLOB_S3_SECRET_ACCESS_KEY_FILE: !reset null
      TG_BLOB_S3_CA_PATH: !reset null
      TG_BLOB_S3_ALLOW_INSECURE_HTTP: !reset null
      TG_MEDIA_KEY_DIR: !reset null
      TG_MEDIA_KEY_CURRENT: !reset null
    depends_on: !override
      migrate:
        condition: service_completed_successfully
    # The local backend does not need the isolated RustFS network.
    networks: !override
      - default
    # Keep optional auth while dropping the S3 blob credential.
    secrets: !override
      - source: teagramd_turnstile
        target: teagramd-turnstile
    volumes: !override
      - tgkey:/var/lib/teagramd
      - tgblobs:/var/lib/teagramd-blobs:ro
      - tgblobs:${TEAGRAMD_STACK_MOVE_BLOB_DIR:-/var/lib/teagramd-blobs}
      - ./.state/blob-mode:/run/teagramd/blob-mode:ro

  # `extends` resolves each replica from the root service before this overlay
  # is applied, so carry the local backend settings to the public replicas too.
  teagramd-public-1:
    environment:
      TG_BLOB_DIR: ${TEAGRAMD_STACK_MOVE_BLOB_DIR:-/var/lib/teagramd-blobs}
      TG_BLOB_S3_ENDPOINT: ""
      TG_BLOB_S3_BUCKET: ""
      TG_BLOB_S3_PREFIX: ""
      TG_BLOB_S3_REGION: ""
      TG_BLOB_S3_ACCESS_KEY_ID: ""
      TG_BLOB_S3_SECRET_ACCESS_KEY: ""
      TG_BLOB_S3_SECRET_ACCESS_KEY_FILE: ""
      TG_BLOB_S3_CA_PATH: ""
      TG_BLOB_S3_ALLOW_INSECURE_HTTP: ""
      TG_MEDIA_KEY_DIR: ""
      TG_MEDIA_KEY_CURRENT: ""
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      public-haproxy:
        condition: service_started
    secrets: !override
      - source: teagramd_turnstile
        target: teagramd-turnstile
    volumes: !override
      - tgkey:/var/lib/teagramd
      - tgblobs:/var/lib/teagramd-blobs:ro
      - tgblobs:${TEAGRAMD_STACK_MOVE_BLOB_DIR:-/var/lib/teagramd-blobs}
      - ./.state/blob-mode:/run/teagramd/blob-mode:ro

  teagramd-public-2:
    environment:
      TG_BLOB_DIR: ${TEAGRAMD_STACK_MOVE_BLOB_DIR:-/var/lib/teagramd-blobs}
      TG_BLOB_S3_ENDPOINT: ""
      TG_BLOB_S3_BUCKET: ""
      TG_BLOB_S3_PREFIX: ""
      TG_BLOB_S3_REGION: ""
      TG_BLOB_S3_ACCESS_KEY_ID: ""
      TG_BLOB_S3_SECRET_ACCESS_KEY: ""
      TG_BLOB_S3_SECRET_ACCESS_KEY_FILE: ""
      TG_BLOB_S3_CA_PATH: ""
      TG_BLOB_S3_ALLOW_INSECURE_HTTP: ""
      TG_MEDIA_KEY_DIR: ""
      TG_MEDIA_KEY_CURRENT: ""
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      public-haproxy:
        condition: service_started
    secrets: !override
      - source: teagramd_turnstile
        target: teagramd-turnstile
    volumes: !override
      - tgkey:/var/lib/teagramd
      - tgblobs:/var/lib/teagramd-blobs:ro
      - tgblobs:${TEAGRAMD_STACK_MOVE_BLOB_DIR:-/var/lib/teagramd-blobs}
      - ./.state/blob-mode:/run/teagramd/blob-mode:ro
