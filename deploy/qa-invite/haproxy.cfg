global
  log stdout format raw local0
  maxconn 128

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 5s
  timeout client 1h
  timeout server 1h

frontend qa_invite
  bind :8444
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.ssl_hello_type 1 }
  use_backend websocket_tls if { req.ssl_hello_type 1 }
  default_backend mtproto

backend websocket_tls
  server tls-edge tls-edge:8443 check

backend mtproto
  server teagramd teagramd:2443 check
