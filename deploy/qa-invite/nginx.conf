worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 128;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  set_real_ip_from 198.18.131.2/32;
  real_ip_header proxy_protocol;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8443 ssl proxy_protocol;
    listen 127.0.0.1:9443 ssl;
    server_name teagram-demo.incus;

    ssl_certificate /run/qa-invite/tls/server.crt;
    ssl_certificate_key /run/qa-invite/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html/.well-known/teagramd/web/current;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' wss://teagram-demo.incus https://challenges.cloudflare.com;" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /teagram-config.json {
      alias /run/qa-invite/client/teagram-config.json;
      default_type application/json;
    }

    location = /.well-known/qa-invite/ca.crt {
      alias /run/qa-invite/tls/ca.crt;
      default_type application/pkix-cert;
      add_header Cache-Control no-store always;
    }

    location = /.well-known/teagramd/client {
      proxy_pass http://teagramd:2446;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header CF-Connecting-IP $remote_addr;
      add_header Cache-Control no-store always;
    }

    location = /apiws {
      proxy_pass http://teagramd:2446/apiws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header CF-Connecting-IP $remote_addr;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_buffering off;
    }

    location ~* \.(?:js|mjs|css|wasm|json|webmanifest|woff2?|ttf|png|jpe?g|gif|svg|ico|map|mp3|mp4|webm|ogg|opus|m4a|txt)$ {
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
