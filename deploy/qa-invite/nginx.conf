worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 128;
}

http {
  access_log /dev/stdout;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8443 ssl;
    server_name teagram-demo.incus;

    ssl_certificate /run/qa-invite/tls/server.crt;
    ssl_certificate_key /run/qa-invite/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /.well-known/teagramd/client {
      proxy_pass http://teagramd:2446;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      add_header Cache-Control no-store always;
    }

    location = /apiws {
      proxy_pass http://teagramd:2446/apiws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_read_timeout 130s;
      proxy_send_timeout 130s;
    }

    location / {
      return 404;
    }
  }
}
