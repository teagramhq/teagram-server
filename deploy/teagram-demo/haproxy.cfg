global
  log stdout format raw local0 info

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 1h
  timeout server 1h
  timeout tunnel 1h

resolvers docker
  nameserver embedded 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  hold valid 5s
  hold nx 5s

frontend websocket
  bind :2446
  http-request deny deny_status 400 unless { req.hdr_cnt(CF-Connecting-IP) eq 1 }
  http-request deny deny_status 400 unless { req.hdr_ip(CF-Connecting-IP) -m found }
  http-request set-src req.hdr_ip(CF-Connecting-IP)
  default_backend teagramd

backend teagramd
  http-reuse never
  server teagramd teagramd:2446 check send-proxy-v2 resolvers docker init-addr libc,none

frontend mtproto
  mode tcp
  bind :2443
  default_backend teagramd_mtproto

backend teagramd_mtproto
  mode tcp
  server teagramd-mtproto teagramd:2443 send-proxy-v2 resolvers docker init-addr libc,none

backend turnstile_egress
  mode http
  option httpchk
  http-check send meth CONNECT uri challenges.cloudflare.com:443 ver HTTP/1.1 hdr Host challenges.cloudflare.com:443
  http-check expect status 200
  server turnstile-egress turnstile-egress:3128 check inter 30s fall 3 rise 2 resolvers docker init-addr libc,none

frontend health
  bind :8404
  mode http
  monitor-uri /healthz
  monitor fail if { nbsrv(teagramd) eq 0 }
  monitor fail if { nbsrv(turnstile_egress) eq 0 }
