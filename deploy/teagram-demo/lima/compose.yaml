# Public demo on lima: the demo stack from the root compose file without
# qa-invite, sized for a 972 MiB host that also runs other stacks.
#
# Run `prepare-blobs.sh` once as root before starting the stack. It also creates
# the writable proxy runtime paths outside the root-owned checkout. Then run
# with the checkout as the project directory so the relative paths resolve as
# they do in the root file:
#   docker compose --env-file <lima env file> --project-directory <checkout> \
#     -f deploy/teagram-demo/lima/compose.yaml --project-name teagram-demo up -d
#
# `docker compose config` prints environment values, including the database
# password and the tunnel token. Never print it into a log or a comment.
#
# Images are pinned by digest and never built here. Memory limits (mem_limit,
# MiB) of all long-running services add up to 157 MiB; migrate is one-shot.
# Fixed subnets: backend 198.18.130.0/24, egress 198.18.132.0/24, edge
# 198.18.133.0/24. The source-scoped FORWARD and DOCKER-USER isolation hooks
# name these.

name: teagram-demo

x-dsn: &dsn "postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the lima env file}@postgres:5432/teagram?sslmode=disable"

x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

x-server-environment: &server-environment
  TG_POSTGRES_DSN: *dsn
  TG_PG_MAX_CONNS: "3"
  TG_PUBLIC_LINK_PREFIX: ${TG_PUBLIC_LINK_PREFIX:?set TG_PUBLIC_LINK_PREFIX in the lima env file}
  TG_ADVERTISE_ADDR: ${TG_ADVERTISE_ADDR:-demo.teagram.io:443}
  TG_ADVERTISE_DEMO_GUEST_SIGN_UP: ${TG_ADVERTISE_DEMO_GUEST_SIGN_UP:-true}
  TG_DEMO_GENERAL_CHAT_ENABLED: ${TG_DEMO_GENERAL_CHAT_ENABLED:-true}
  TG_WEBSOCKET_LISTEN_ADDR: ${TG_WEBSOCKET_LISTEN_ADDR:-:2446}
  TG_WEBSOCKET_ALLOWED_ORIGINS: ${TG_WEBSOCKET_ALLOWED_ORIGINS:-https://web.teagram.io}
  TG_WEBSOCKET_BROWSER_ONLY: ${TG_WEBSOCKET_BROWSER_ONLY:-false}
  TG_RATE_LIMIT_KEY_EXCHANGE_IP_TAILNET: "20"
  TG_LOG_LOGIN_CODES: ${TG_LOG_LOGIN_CODES:-false}
  TG_LOG_AUTH_KEY_UNBINDS: "true"
  TG_REGISTRATION: ${TG_REGISTRATION:-open}
  TG_WELCOME_CHANNEL: teagramdemowelcome
  TG_TURNSTILE_SIGNIN_ENABLED: ${TG_TURNSTILE_SIGNIN_ENABLED:-false}
  TG_STICKER_IMPORT: "off"
  TG_MAX_FILE_BYTES: ${TG_MAX_FILE_BYTES:-16777216}
  TG_MAX_USER_STORAGE_BYTES: ${TG_MAX_USER_STORAGE_BYTES:-268435456}
  TG_UPLOAD_MAX_BYTES: ${TG_UPLOAD_MAX_BYTES:-512000}
  TG_UPLOADS_DISABLED: "false"
  TG_RATE_LIMIT_UPLOAD_BYTES: ${TG_RATE_LIMIT_UPLOAD_BYTES:-20971520}
  TG_RSA_KEY_FINGERPRINT: ${TG_RSA_KEY_FINGERPRINT:?set TG_RSA_KEY_FINGERPRINT in the lima env file}
  TG_RSA_KEY_PATH: /var/lib/teagramd/server_key.pem
  TG_AUTHKEY_ENC_KEY: ${TG_AUTHKEY_ENC_KEY:?set TG_AUTHKEY_ENC_KEY in the lima env file}
  TG_AUTHKEY_ENC_KEY_FILE: ${TG_AUTHKEY_ENC_KEY_FILE:-/var/lib/teagramd/enc_key.hex}
  HTTP_PROXY: http://turnstile-egress:3128
  HTTPS_PROXY: http://turnstile-egress:3128
  NO_PROXY: localhost,127.0.0.1,postgres,teagramd
  TG_REPLICA_COUNT: "1"
  TG_CLIENT_ADDR_TRUST: proxy-v2
  TG_CLIENT_ADDR_PROXY_CIDRS: 198.18.130.2/32
  TG_TURNSTILE_SITE_KEY: ${TEAGRAM_DEMO_TURNSTILE_SITE_KEY:?set TEAGRAM_DEMO_TURNSTILE_SITE_KEY in the lima env file}
  TG_TURNSTILE_SECRET_KEY_FILE: /run/secrets/teagram_demo_turnstile
  TG_TURNSTILE_TEST_MODE: "false"
  TG_TURNSTILE_HOSTNAMES: web.teagram.io,demo.teagram.io
  TG_TURNSTILE_QA_BYPASS_TOKEN_FILE: /run/secrets/teagram_demo_turnstile_qa_bypass
  TG_BLOB_DIR: /var/lib/teagramd-blobs
  GOMAXPROCS: "1"
  # Soft limit below the 46 MiB container limit, so the collector runs before
  # the kernel OOM-kills the server.
  GOMEMLIMIT: 20MiB

x-server: &server
  image: ${TEAGRAM_DEMO_IMAGE_REF:?set TEAGRAM_DEMO_IMAGE_REF to the digest-pinned teagramd image in the lima env file}
  stop_grace_period: 120s
  mem_limit: 46m
  memswap_limit: 46m
  cpus: "0.5"
  pids_limit: 128
  environment: *server-environment
  read_only: true
  volumes:
    - tgkey:/var/lib/teagramd
    # Blobs sit on the capped filesystem prepared by prepare-blobs.sh. A named
    # volume would live on lima's root disk, so the bind is explicit, and
    # create_host_path refuses to start if the capped mount is missing.
    - type: bind
      source: /srv/teagram-demo-blobs/data
      target: /var/lib/teagramd-blobs
      bind:
        create_host_path: false
    - ./.state/blob-mode:/run/teagramd/blob-mode:ro
  secrets:
    - teagram_demo_turnstile
    - teagram_demo_turnstile_qa_bypass
  depends_on:
    migrate:
      condition: service_completed_successfully
    turnstile-egress:
      condition: service_healthy
  restart: "no"
  logging: *logging

services:
  postgres:
    image: mirror.gcr.io/library/postgres:18-alpine@sha256:d8703cd7fba306b9fec9268ecedfa8a966846c053036a60e3635791957eb2f66
    platform: linux/amd64
    mem_limit: 49m
    memswap_limit: 49m
    cpus: "0.5"
    pids_limit: 64
    shm_size: 16m
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the lima env file}
      POSTGRES_DB: teagram
      PGDATA: /var/lib/postgresql/18/docker
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teagram"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql
      - type: bind
        source: ./deploy/teagram-demo/lima/postgresql.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true
    networks:
      backend:
        ipv4_address: 198.18.130.3
    restart: "no"
    logging: *logging

  migrate:
    image: mirror.gcr.io/arigaio/atlas:1.3.0-alpine@sha256:bb21d31eaf260e43513a35b87be575cecf8ab556795aa8c039e7bb3b43bdd3fe
    platform: linux/amd64
    mem_limit: 64m
    memswap_limit: 64m
    cpus: "0.25"
    pids_limit: 64
    command:
      - migrate
      - apply
      - --dir
      - file:///migrations
      - --url
      - *dsn
    volumes:
      - type: bind
        source: ./migrations
        target: /migrations
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"
    logging: *logging

  teagramd:
    <<: *server
    networks:
      backend:
        ipv4_address: 198.18.130.253

  turnstile-egress:
    image: mirror.gcr.io/ubuntu/squid:7.2-26.04_edge@sha256:f6843088c0eab9e63ecb8a1c215d939cd97d0370611bb2bdb65c4a8e48b3c3eb
    platform: linux/amd64
    user: "584792:584792"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 24m
    memswap_limit: 24m
    cpus: "0.25"
    pids_limit: 64
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,size=4m,uid=584792,gid=584792,mode=0755
      - /var/log/squid:rw,noexec,nosuid,nodev,size=4m,uid=584792,gid=584792,mode=0750
      - /var/spool/squid:rw,noexec,nosuid,nodev,size=4m,uid=584792,gid=584792,mode=0750
    volumes:
      - type: bind
        source: /var/lib/teagram-demo/lima/runtime/tmp/turnstile-egress
        target: /tmp
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/teagram-demo/turnstile-egress.conf
        target: /etc/squid/squid.conf
        read_only: true
      - type: bind
        source: ./deploy/teagram-demo/pebble-health.yaml
        target: /var/lib/pebble/default/layers/002-demo-health.yaml
        read_only: true
    healthcheck:
      test: ["CMD", "/usr/bin/pebble", "health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      egress:
        gw_priority: 1
      backend:
        ipv4_address: 198.18.130.252
    restart: "no"
    logging: *logging

  haproxy:
    image: mirror.gcr.io/library/haproxy:3.2-alpine@sha256:51f173c6825753d9e3a888b1004a1c2cb730936cc9178730a5c555246bd161a2
    platform: linux/amd64
    labels:
      com.teagram.demo.haproxy-config-sha256: ${TEAGRAM_DEMO_HAPROXY_CONFIG_SHA256:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 10m
    memswap_limit: 10m
    cpus: "0.25"
    pids_limit: 64
    volumes:
      - type: bind
        source: /var/lib/teagram-demo/lima/runtime/tmp/haproxy
        target: /tmp
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ./.state/teagram-demo/haproxy-config
        target: /usr/local/etc/haproxy
        read_only: true
      - type: bind
        source: /var/lib/teagram-demo/lima/runtime/haproxy-run
        target: /run/haproxy
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8404/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      turnstile-egress:
        condition: service_healthy
    networks:
      backend:
        ipv4_address: 198.18.130.2
    restart: "no"
    logging: *logging

  edge:
    image: mirror.gcr.io/library/nginx:1.28.0-alpine@sha256:09ab424a8c788f8d0fe3a64429f6d19dfa526885c8609b748d0943a75dcb9f8c
    platform: linux/amd64
    entrypoint: ["nginx", "-c", "/etc/nginx/demo/nginx.conf", "-g", "daemon off;"]
    user: "101:101"
    ports:
      - "${TEAGRAM_DEMO_EDGE_BIND:-127.0.0.1:8080}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3m
    memswap_limit: 3m
    cpus: "0.25"
    pids_limit: 64
    volumes:
      - type: bind
        source: /var/lib/teagram-demo/lima/runtime/tmp/edge
        target: /tmp
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/teagram-demo/nginx-config
        target: /etc/nginx/demo
        read_only: true
      - type: bind
        source: ./.state/teagram-demo/public-client
        target: /usr/share/nginx/html/.well-known/teagramd
        read_only: true
    depends_on:
      haproxy:
        condition: service_healthy
    networks: [backend, edge]
    restart: "no"
    logging: *logging

  # Tunnel connector for demo.teagram.io. It reaches the origin as edge:8080
  # on the edge network, not 127.0.0.1, because a container's loopback is its
  # own. The tunnel's origin in the Cloudflare dashboard must be
  # http://edge:8080 at cutover. The token comes from the root-only
  # cloudflared.env file, which carries nothing else.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.5@sha256:85b1ec2fdc5b311d309abd268f70eef071a595f011a38bf878938af25d084d17
    command: ["tunnel", "--no-autoupdate", "--loglevel", "info", "run"]
    env_file:
      - ${TEAGRAM_DEMO_SECRETS_DIR:-/var/lib/teagram-demo/secrets}/cloudflared.env
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=4m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 25m
    memswap_limit: 25m
    cpus: "0.25"
    pids_limit: 64
    depends_on:
      edge:
        condition: service_started
    networks: [edge]
    restart: "no"
    logging: *logging

volumes:
  pgdata:
  tgkey:

secrets:
  teagram_demo_turnstile:
    file: ${TEAGRAM_DEMO_SECRETS_DIR:-/var/lib/teagram-demo/secrets}/turnstile-secret-key
  teagram_demo_turnstile_qa_bypass:
    file: ${TEAGRAM_DEMO_SECRETS_DIR:-/var/lib/teagram-demo/secrets}/turnstile-qa-bypass-token

networks:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 198.18.130.0/24
          ip_range: 198.18.130.128/26
  egress:
    driver: bridge
    ipam:
      config:
        - subnet: 198.18.132.0/24
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 198.18.133.0/24
