# Lima demo host: the postgres service has a 56 MiB memory limit, shared with
# the other stacks on a 972 MiB host. Buffers and connections stay small; the
# lima Compose caps each server pool at 2 connections. Both server slots, their
# LISTEN connections, and migrate use at most 7 client backends during rollout,
# within the 8-client pgbench run that used 52 MiB.
listen_addresses = '*'
shared_buffers = 16MB
effective_cache_size = 48MB
work_mem = 2MB
maintenance_work_mem = 16MB
random_page_cost = 1.1
effective_io_concurrency = 100
jit = off
track_io_timing = on
log_min_duration_statement = 250ms
max_connections = 32
max_worker_processes = 4
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
autovacuum_max_workers = 1
io_method = sync
