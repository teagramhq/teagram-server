# Public demo stack. Start only after init-demo.sh has published the guarded
# local blob-mode authority. The only published host port is the loopback HTTP
# origin consumed by Cloudflare Tunnel.
name: teagram-demo

x-dsn: &dsn "postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/teagram-demo/.env}@postgres:5432/teagram?sslmode=disable"
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-teagramd: &teagramd
  image: ${TEAGRAM_DEMO_IMAGE_REF:-teagramd:local}
  stop_grace_period: 120s
  mem_limit: 448m
  memswap_limit: 448m
  cpus: "1.0"
  pids_limit: 256
  environment:
    TG_POSTGRES_DSN: *dsn
    TG_PUBLIC_LINK_PREFIX: ${TG_PUBLIC_LINK_PREFIX:?set TG_PUBLIC_LINK_PREFIX in deploy/teagram-demo/.env}
    TG_ADVERTISE_ADDR: ${TG_ADVERTISE_ADDR:-demo.teagram.io:443}
    TG_ADVERTISE_DEMO_GUEST_SIGN_UP: ${TG_ADVERTISE_DEMO_GUEST_SIGN_UP:-true}
    TG_WEBSOCKET_LISTEN_ADDR: ${TG_WEBSOCKET_LISTEN_ADDR:-:2446}
    TG_WEBSOCKET_ALLOWED_ORIGINS: ${TG_WEBSOCKET_ALLOWED_ORIGINS:-https://web.teagram.io}
    TG_RATE_LIMIT_KEY_EXCHANGE_IP_TAILNET: "20"
    TG_LOG_LOGIN_CODES: ${TG_LOG_LOGIN_CODES:-false}
    TG_LOG_AUTH_KEY_UNBINDS: "true"
    TG_REGISTRATION: ${TG_REGISTRATION:-open}
    TG_TURNSTILE_SIGNIN_ENABLED: ${TG_TURNSTILE_SIGNIN_ENABLED:-false}
    TG_STICKER_IMPORT: "off"
    TG_MAX_FILE_BYTES: ${TG_MAX_FILE_BYTES:-16777216}
    TG_MAX_USER_STORAGE_BYTES: ${TG_MAX_USER_STORAGE_BYTES:-268435456}
    TG_UPLOAD_MAX_BYTES: ${TG_UPLOAD_MAX_BYTES:-512000}
    TG_UPLOADS_DISABLED: "true"
    TG_RATE_LIMIT_UPLOAD_BYTES: ${TG_RATE_LIMIT_UPLOAD_BYTES:-20971520}
    TG_RSA_KEY_FINGERPRINT: ${TG_RSA_KEY_FINGERPRINT:-}
    TG_AUTHKEY_ENC_KEY: ${TG_AUTHKEY_ENC_KEY:?set TG_AUTHKEY_ENC_KEY in deploy/teagram-demo/.env}
    TG_AUTHKEY_ENC_KEY_FILE: ${TG_AUTHKEY_ENC_KEY_FILE:-/var/lib/teagramd/enc_key.hex}
    HTTP_PROXY: http://turnstile-egress:3128
    HTTPS_PROXY: http://turnstile-egress:3128
    NO_PROXY: localhost,127.0.0.1,postgres,teagramd,teagramd-next
    TG_REPLICA_COUNT: "1"
    TG_CLIENT_ADDR_TRUST: proxy-v2
    TG_CLIENT_ADDR_PROXY_CIDRS: 198.18.130.2/32
    TG_TURNSTILE_SITE_KEY: ${TEAGRAM_DEMO_TURNSTILE_SITE_KEY:?set TEAGRAM_DEMO_TURNSTILE_SITE_KEY in deploy/teagram-demo/.env}
    TG_TURNSTILE_SECRET_KEY_FILE: /run/secrets/teagram_demo_turnstile
    TG_TURNSTILE_TEST_MODE: "false"
    TG_TURNSTILE_HOSTNAMES: web.teagram.io,demo.teagram.io
    TG_TURNSTILE_QA_BYPASS_TOKEN_FILE: /run/secrets/teagram_demo_turnstile_qa_bypass
    TG_BLOB_DIR: /var/lib/teagramd-blobs
    GOMAXPROCS: "1"
    GOMEMLIMIT: 320MiB
  read_only: true
  volumes:
    - tgkey:/var/lib/teagramd
    - tgblobs:/var/lib/teagramd-blobs
    - .state/blob-mode:/run/teagramd/blob-mode:ro
  secrets:
    - teagram_demo_turnstile
    - teagram_demo_turnstile_qa_bypass
  depends_on:
    migrate:
      condition: service_completed_successfully
    turnstile-egress:
      condition: service_healthy
  restart: unless-stopped
  logging: *logging

services:
  postgres:
    image: mirror.gcr.io/library/postgres:18-alpine@sha256:d8703cd7fba306b9fec9268ecedfa8a966846c053036a60e3635791957eb2f66
    platform: linux/amd64
    mem_limit: 320m
    memswap_limit: 320m
    cpus: "0.5"
    pids_limit: 128
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/teagram-demo/.env}
      POSTGRES_DB: teagram
      PGDATA: /var/lib/postgresql/18/docker
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teagram"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql
      - type: bind
        source: ./deploy/teagram-demo/postgresql.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true
    networks:
      backend:
        ipv4_address: 198.18.130.3
    restart: unless-stopped
    logging: *logging

  migrate:
    image: mirror.gcr.io/arigaio/atlas:1.2.0-alpine@sha256:5abea953e8e048d5b27b1b3e2fc83e17fdc1f7cd0d908a8432ed0c7e6394c58f
    platform: linux/amd64
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.25"
    pids_limit: 64
    command:
      - migrate
      - apply
      - --dir
      - file:///migrations
      - --url
      - *dsn
    volumes:
      - type: bind
        source: ./migrations
        target: /migrations
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    logging: *logging

  teagramd:
    <<: *teagramd
    networks:
      backend:
        ipv4_address: 198.18.130.253

  teagramd-next:
    <<: *teagramd
    networks:
      backend:
        ipv4_address: 198.18.130.251

  demo-seed:
    image: ${TEAGRAM_DEMO_IMAGE_REF:-teagramd:local}
    profiles: [seed]
    entrypoint: ["/usr/local/bin/demo-seed"]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.5"
    pids_limit: 128
    environment:
      GOMAXPROCS: "1"
      GOMEMLIMIT: 192MiB
    volumes:
      - type: bind
        source: ./.state/teagram-demo/public-client/client
        target: /run/teagram-demo/client.json
        read_only: true
      - type: bind
        source: /var/lib/teagram-demo/secrets/seed-owner-password
        target: /run/secrets/seed-owner-password
        read_only: true
      - type: bind
        source: /var/lib/teagram-demo/secrets/demo-accounts
        target: /run/secrets/demo-accounts
    networks: [backend]
    logging: *logging

  demo-probe:
    image: ${TEAGRAM_DEMO_IMAGE_REF:-teagramd:local}
    profiles: [seed]
    entrypoint: ["/usr/local/bin/demo-seed"]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.5"
    pids_limit: 128
    environment:
      GOMAXPROCS: "1"
      GOMEMLIMIT: 192MiB
    volumes:
      - type: bind
        source: ./.state/teagram-demo/public-client/client
        target: /run/teagram-demo/client.json
        read_only: true
    networks: [backend]
    logging: *logging

  demo-activity:
    image: ${TEAGRAM_DEMO_IMAGE_REF:-teagramd:local}
    profiles: [activity]
    entrypoint: ["/usr/local/bin/demo-seed"]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.5"
    pids_limit: 128
    environment:
      GOMAXPROCS: "1"
      GOMEMLIMIT: 192MiB
    volumes:
      - type: bind
        source: ./.state/teagram-demo/public-client/client
        target: /run/teagram-demo/client.json
        read_only: true
      - type: bind
        source: /var/lib/teagram-demo-activity
        target: /var/lib/teagram-demo-activity
    networks: [backend]
    logging: *logging

  turnstile-egress:
    image: mirror.gcr.io/ubuntu/squid:7.2-26.04_edge@sha256:f6843088c0eab9e63ecb8a1c215d939cd97d0370611bb2bdb65c4a8e48b3c3eb
    platform: linux/amd64
    user: "584792:584792"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    memswap_limit: 96m
    cpus: "0.25"
    pids_limit: 64
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,size=16m,uid=584792,gid=584792,mode=0755
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=584792,gid=584792,mode=1777
      - /var/log/squid:rw,noexec,nosuid,nodev,size=16m,uid=584792,gid=584792,mode=0750
      - /var/spool/squid:rw,noexec,nosuid,nodev,size=32m,uid=584792,gid=584792,mode=0750
    volumes:
      - type: bind
        source: ./deploy/teagram-demo/turnstile-egress.conf
        target: /etc/squid/squid.conf
        read_only: true
      - type: bind
        source: ./deploy/teagram-demo/pebble-health.yaml
        target: /var/lib/pebble/default/layers/002-demo-health.yaml
        read_only: true
    healthcheck:
      test: ["CMD", "/usr/bin/pebble", "health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      egress:
        gw_priority: 1
      backend:
        ipv4_address: 198.18.130.252
    restart: unless-stopped
    logging: *logging

  haproxy:
    image: mirror.gcr.io/library/haproxy:3.2-alpine@sha256:51f173c6825753d9e3a888b1004a1c2cb730936cc9178730a5c555246bd161a2
    platform: linux/amd64
    labels:
      com.teagram.demo.haproxy-config-sha256: ${TEAGRAM_DEMO_HAPROXY_CONFIG_SHA256:?missing HAProxy configuration hash}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    memswap_limit: 96m
    cpus: "0.25"
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      # Mount directories so atomic config replacements are visible to the
      # already-running proxy, rather than pinned to an old file inode.
      - type: bind
        source: ./.state/teagram-demo/haproxy-config
        target: /usr/local/etc/haproxy
        read_only: true
      - type: bind
        source: ./.state/teagram-demo/haproxy-run
        target: /run/haproxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8404/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      turnstile-egress:
        condition: service_healthy
    networks:
      backend:
        ipv4_address: 198.18.130.2
    restart: unless-stopped
    logging: *logging

  edge:
    image: mirror.gcr.io/library/nginx:1.28.0-alpine@sha256:09ab424a8c788f8d0fe3a64429f6d19dfa526885c8609b748d0943a75dcb9f8c
    platform: linux/amd64
    entrypoint: ["nginx", "-c", "/etc/nginx/demo/nginx.conf", "-g", "daemon off;"]
    user: "101:101"
    ports:
      - "${TEAGRAM_DEMO_EDGE_BIND:-127.0.0.1:8080}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    memswap_limit: 96m
    cpus: "0.25"
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - type: bind
        source: ./deploy/teagram-demo/nginx-config
        target: /etc/nginx/demo
        read_only: true
      # The discovery file is atomically replaced during a rollout.
      - type: bind
        source: ./.state/teagram-demo/public-client
        target: /usr/share/nginx/html/.well-known/teagramd
        read_only: true
    depends_on:
      haproxy:
        condition: service_healthy
    networks: [backend, edge]
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  tgkey:
  # The setup and deploy scripts require this to be a separately mounted,
  # capacity-limited filesystem. There is no root-filesystem fallback.
  tgblobs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${TEAGRAM_DEMO_BLOB_PATH:?set TEAGRAM_DEMO_BLOB_PATH in deploy/teagram-demo/.env}

secrets:
  teagram_demo_turnstile:
    file: ${TEAGRAM_DEMO_TURNSTILE_SECRET_KEY_FILE:?set TEAGRAM_DEMO_TURNSTILE_SECRET_KEY_FILE in deploy/teagram-demo/.env}
  teagram_demo_turnstile_qa_bypass:
    file: /var/lib/teagram-demo/secrets/turnstile-qa-bypass-token

networks:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 198.18.130.0/24
          ip_range: 198.18.130.128/26
  edge:
    driver: bridge
  egress:
    driver: bridge
