user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  resolver 127.0.0.11 ipv6=off valid=10s;

  server {
    listen 8080;
    server_name _;

    location = /.well-known/teagramd/client {
      alias /usr/share/nginx/html/.well-known/teagramd/client;
      default_type application/json;
      add_header Access-Control-Allow-Origin "https://web.teagram.io" always;
      add_header Vary Origin always;
      add_header Cache-Control "no-cache" always;
    }

    location = /apiws {
      set $teagramd http://haproxy:2446;
      proxy_pass $teagramd/apiws;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 1h;
      proxy_buffering off;
    }

    location = /healthz {
      set $haproxy http://haproxy:8404;
      proxy_pass $haproxy/healthz;
      proxy_connect_timeout 3s;
      proxy_read_timeout 3s;
    }

    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location / { return 404; }
  }
}
