user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  resolver 127.0.0.11 ipv6=off valid=10s;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html/.well-known/teagramd/web/current;
    set $teagramd_bootstrap_config /usr/share/nginx/html/.well-known/teagramd/teagram-config.json;
    set $teagramd_client_discovery /usr/share/nginx/html/.well-known/teagramd/client;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' wss://demo.teagram.io https://challenges.cloudflare.com;" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /apiws {
      if ($http_origin = "https://teagram-dev.tailaa4918.ts.net") { return 403; }
      set $teagramd http://haproxy:2446;
      proxy_pass $teagramd/apiws;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 1h;
      proxy_buffering off;
    }
    include /etc/nginx/demo/common-locations.conf;
  }
}
