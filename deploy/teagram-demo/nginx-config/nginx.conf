user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  resolver 127.0.0.11 ipv6=off valid=10s;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html/.well-known/teagramd/web/current;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' wss://demo.teagram.io https://challenges.cloudflare.com;" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = / {
      try_files /index.html @demo_status;
    }

    location @demo_status {
      default_type text/plain;
      return 200 "Teagram demo server";
    }

    location = /teagram-config.json {
      alias /usr/share/nginx/html/.well-known/teagramd/teagram-config.json;
      default_type application/json;
    }

    location = /.well-known/teagramd/client {
      alias /usr/share/nginx/html/.well-known/teagramd/client;
      default_type application/json;
      add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' wss://demo.teagram.io https://challenges.cloudflare.com;" always;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Access-Control-Allow-Origin "https://web.teagram.io" always;
      add_header Vary Origin always;
    }

    location = /apiws {
      set $teagramd http://haproxy:2446;
      proxy_pass $teagramd/apiws;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 1h;
      proxy_buffering off;
    }

    location = /healthz {
      set $haproxy http://haproxy:8404;
      proxy_pass $haproxy/healthz;
      proxy_connect_timeout 3s;
      proxy_read_timeout 3s;
    }

    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }

    location ~* \.(?:js|mjs|css|wasm|json|webmanifest|woff2?|ttf|png|jpe?g|gif|svg|ico|map|mp3|mp4|webm|ogg|opus|m4a|txt)$ {
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
