http_port 3128

acl allowed_client src 198.18.130.2/32 198.18.130.253/32
acl CONNECT method CONNECT
acl CONNECT_PORT port 443
acl siteverify_host dstdomain challenges.cloudflare.com

# TLS remains end-to-end. Restrict CONNECT by source, host, and port; the
# application uses this tunnel only for /turnstile/v0/siteverify.
http_access allow allowed_client CONNECT CONNECT_PORT siteverify_host
http_access deny all

cache deny all
cache_store_log none
access_log stdio:/dev/stdout
cache_log /dev/stderr
visible_hostname turnstile-egress
