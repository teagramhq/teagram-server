# Merge these endpoints into the existing Gatus status page after demo DNS and
# the Cloudflare Tunnel are live. Add each endpoint's `alerts` using the
# provider already configured on that status page; this repository does not
# own the Gatus alerting credentials.
endpoints:
  - name: Demo upstream health
    group: teagram-demo
    url: https://demo.teagram.io/healthz
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 72h"

  - name: Client discovery
    group: teagram-demo
    url: https://demo.teagram.io/.well-known/teagramd/client
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].websocket.endpoint == wss://demo.teagram.io/apiws"
      - "[CERTIFICATE_EXPIRATION] > 72h"

  - name: WebSocket listener
    group: teagram-demo
    url: https://demo.teagram.io/apiws
    interval: 1m
    conditions:
      # Gatus exposes response bodies but not response headers to conditions.
      # The app marker prevents an intermediary's generic 403 page from passing.
      - "[STATUS] == 403"
      - "[BODY] == pat(TEAGRAM_BROWSER_ONLY_POLICY*)"
      - "[CERTIFICATE_EXPIRATION] > 72h"

  - name: Admin remains private
    group: teagram-demo
    url: https://demo.teagram.io/admin/
    interval: 5m
    conditions:
      - "[STATUS] == 404"
