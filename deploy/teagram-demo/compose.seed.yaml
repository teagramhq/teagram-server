# Temporary API-seed configuration. The caller starts only teagramd with this
# overlay while edge and HAProxy are stopped, then recreates teagramd from the
# production Compose file before either public path starts.
services:
  teagramd:
    environment:
      TG_CLIENT_ADDR_TRUST: socket
      TG_CLIENT_ADDR_PROXY_CIDRS: ""
      TG_TURNSTILE_SITE_KEY: ""
      TG_TURNSTILE_SECRET_KEY_FILE: ""
      TG_RATE_LIMIT_SIGN_UP_IP: "32"
      TG_RATE_LIMIT_SIGN_UP_IP_WINDOW: 1h
      TG_RATE_LIMIT_SEND_CODE_IP: "64"
      TG_RATE_LIMIT_SEND_CODE_IP_WINDOW: 1h
      TG_RATE_LIMIT_SEND_CODE_IP_PHONES: "32"
      TG_RATE_LIMIT_SEND_CODE_IP_PHONES_WINDOW: 1h
