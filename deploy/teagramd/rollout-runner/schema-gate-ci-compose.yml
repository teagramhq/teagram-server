services:
  postgres:
    image: mirror.gcr.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: teagram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/18/docker
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - ../../../deploy/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teagram"]
      interval: 2s
      timeout: 5s
      retries: 20

  migrate:
    image: mirror.gcr.io/arigaio/atlas:1.2.0-alpine
    volumes:
      - ../../../migrations:/migrations:ro
