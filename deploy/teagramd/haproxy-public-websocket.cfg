global
  log stdout format raw local0 info

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 1h
  timeout server 1h
  timeout tunnel 1h

resolvers docker
  nameserver embedded 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  hold valid 5s
  hold nx 5s

frontend public_websocket
  bind 198.18.131.10:2446
  capture request header CF-Connecting-IP len 64
  tcp-request connection reject unless { src 198.18.131.1/32 }
  tcp-request connection set-var(sess.peer) src
  http-request deny deny_status 400 unless { req.hdr_cnt(CF-Connecting-IP) eq 1 }
  http-request deny deny_status 400 unless { req.hdr_ip(CF-Connecting-IP) -m found }
  http-request set-src req.hdr_ip(CF-Connecting-IP)
  log-format "public_peer=%[var(sess.peer)] client=%[capture.req.hdr(0)] frontend=%ft backend=%b server=%s status=%ST"
  default_backend public_websocket_replicas

backend public_websocket_replicas
  http-reuse never
  server-template public 2 teagramd-public:2446 check send-proxy-v2 inter 2s fall 3 rise 2 resolvers docker init-addr none

frontend health
  bind 127.0.0.1:8404
  monitor-uri /healthz
  monitor fail if { nbsrv(public_websocket_replicas) eq 0 }
