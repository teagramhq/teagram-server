apiVersion: v1
kind: Pod
metadata:
  name: cutover-s3-client
  namespace: teagram
  labels:
    app.kubernetes.io/name: cutover-s3-client
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: ghcr.io/teagramhq/teagramd-mc-init:ci
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-ec"]
      args: ["mkdir -p /tmp/mc; exec sleep 21600"]
      env:
        - name: HOME
          value: /tmp
        - name: MC_CONFIG_DIR
          value: /tmp/mc
        - name: TG_BLOB_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: teagramd-blob-credentials
              key: TG_BLOB_S3_ACCESS_KEY_ID
        - name: TG_BLOB_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: teagramd-blob-credentials
              key: TG_BLOB_S3_SECRET_ACCESS_KEY
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        medium: Memory
        sizeLimit: 16Mi
