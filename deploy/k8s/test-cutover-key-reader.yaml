apiVersion: v1
kind: Pod
metadata:
  name: cutover-key-reader
  namespace: teagram
  labels:
    app.kubernetes.io/name: cutover-key-reader
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: reader
      image: mirror.gcr.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      imagePullPolicy: IfNotPresent
      command: ["sh", "-ec"]
      args: ["exec sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: key-data
          mountPath: /var/lib/teagramd
          readOnly: true
        - name: legacy-blobs
          mountPath: /var/lib/teagramd-blobs
          readOnly: true
        - name: blob-mode
          mountPath: /run/teagramd/blob-mode
          readOnly: true
        - name: media-keys
          mountPath: /run/teagramd/media-keys
          readOnly: true
        - name: s3-credentials
          mountPath: /run/secrets
          readOnly: true
  volumes:
    - name: key-data
      persistentVolumeClaim:
        claimName: key-data-teagramd-0
        readOnly: true
    - name: legacy-blobs
      persistentVolumeClaim:
        claimName: legacy-blobs-teagramd-0
        readOnly: true
    - name: blob-mode
      persistentVolumeClaim:
        claimName: blob-mode-teagramd-0
        readOnly: true
    - name: media-keys
      secret:
        secretName: teagramd-media-keys
    - name: s3-credentials
      secret:
        secretName: teagramd-blob-credentials
        items:
          - key: TG_BLOB_S3_SECRET_ACCESS_KEY
            path: teagramd-blob-secret-key
