apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-backup-restore-test
  namespace: teagram
  labels:
    app.kubernetes.io/name: postgres-backup-restore-test
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-backup-restore-test
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restore
          image: mirror.gcr.io/library/postgres:18-alpine@sha256:3b0ef735388b2cb097fc29b8bb421d86d57d0ddbe7aa1fbd6493e06d65028503
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              backup=$(ls -1t /backups/teagram-*.dump | head -n 1)
              test -n "$backup"
              printf 'restore=started path=%s\n' "$backup"
              pg_restore --clean --if-exists --exit-on-error --no-owner --no-acl \
                --dbname="$TG_POSTGRES_DSN" "$backup"
              printf 'restore=verified path=%s\n' "$backup"
          env:
            - name: TG_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: TG_POSTGRES_DSN
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: backups
              mountPath: /backups
              readOnly: true
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: postgres-backups
            readOnly: true
