apiVersion: batch/v1
kind: Job
metadata:
  name: cutover-account-seed
  namespace: teagram
  labels:
    app.kubernetes.io/name: cutover-account-seed
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cutover-account-seed
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-account
          image: ghcr.io/teagramhq/teagramd:ci
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/teagramd"]
          args: ["admin", "create-user", "--username", "cutover_smoke"]
          stdin: true
          stdinOnce: true
          env:
            - name: TG_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: TG_POSTGRES_DSN
            - name: TG_AUTHKEY_ENC_KEY_FILE
              value: /var/lib/teagramd/enc_key.hex
            - name: HOME
              value: /tmp
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["DAC_READ_SEARCH"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: key-data
              mountPath: /var/lib/teagramd
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: key-data
          persistentVolumeClaim:
            claimName: key-data-teagramd-0
            readOnly: true
        - name: tmp
          emptyDir: {}
