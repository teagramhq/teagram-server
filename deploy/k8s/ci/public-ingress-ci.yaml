apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: teagramd
spec:
  template:
    spec:
      containers:
        - name: teagramd
          env:
            - name: TG_PUBLIC_WEBSOCKET_LISTEN_ADDR
              value: ":2446"
            - name: TG_PUBLIC_WEBSOCKET_ADVERTISE_ADDR
              value: server.example.test:443
            - name: TG_CLIENT_ADDR_TRUST
              value: cf-connecting-ip
            - name: TG_CLIENT_ADDR_CF_PROXY_CIDRS
              value: 127.0.0.1/32
            - name: TG_LISTEN_PATH
              value: tailnet
            - name: TG_WEBSOCKET_LISTEN_PATH
              value: tailnet
            - name: TG_BOT_API_PUBLIC_LISTEN_ADDR
              value: ":2449"
            - name: TG_BOT_API_PUBLIC_PROXY_CIDRS
              value: 127.0.0.1/32
            - name: TG_BOT_API_TAILNET_LISTEN_ADDR
              value: ":2447"
