apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  template:
    spec:
      containers:
        - name: cloudflared
          image: mirror.gcr.io/alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
          imagePullPolicy: IfNotPresent
          command: ["socat"]
          args:
            - TCP-LISTEN:8080,bind=0.0.0.0,reuseaddr,fork
            - TCP:teagramd:2446
          env:
            - $patch: replace
          ports:
            - $patch: replace
            - name: connector
              containerPort: 8080
              protocol: TCP
          startupProbe:
            $patch: replace
            exec:
              command: ["sh", "-ec", "kill -0 1"]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          readinessProbe:
            $patch: replace
            exec:
              command: ["sh", "-ec", "kill -0 1"]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            $patch: replace
            exec:
              command: ["sh", "-ec", "kill -0 1"]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
