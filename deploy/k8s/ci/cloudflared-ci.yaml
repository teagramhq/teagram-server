apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  template:
    spec:
      containers:
        - name: cloudflared
          image: mirror.gcr.io/library/python:3.13.11-alpine3.22@sha256:2fd93799bfc6381d078a8f656a5f45d6092e5d11d16f55889b3d5cbfdc64f045
          imagePullPolicy: IfNotPresent
          command: ["python3", "-c", "import time; time.sleep(3600)"]
          env:
            - $patch: replace
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: ingress-probes
              mountPath: /tests
              readOnly: true
          startupProbe:
            $patch: replace
            exec:
              command: ["sh", "-ec", "kill -0 1"]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          readinessProbe:
            $patch: replace
            exec:
              command: ["sh", "-ec", "kill -0 1"]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            $patch: replace
            exec:
              command: ["sh", "-ec", "kill -0 1"]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: ingress-probes
          configMap:
            name: k8s-ingress-probes
