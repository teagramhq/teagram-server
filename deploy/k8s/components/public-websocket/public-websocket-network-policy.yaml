apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: teagramd-public-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: teagramd-public
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - protocol: TCP
          port: 2446
