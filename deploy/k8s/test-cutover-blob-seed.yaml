apiVersion: v1
kind: Pod
metadata:
  name: cutover-blob-seed
  namespace: teagram
  labels:
    app.kubernetes.io/name: cutover-blob-seed
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: seed
      image: mirror.gcr.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      imagePullPolicy: IfNotPresent
      command: ["sh", "-ec"]
      args:
        - mkdir -p /blobs/parts/aa; printf 'alpha cutover migration fixture\n' > /blobs/parts/aa/0123456789abcdef0123456789abcd; printf 'second blob\n' > /blobs/parts/aa/1123456789abcdef0123456789abcd; exec sleep 3600
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: legacy-blobs
          mountPath: /blobs
  volumes:
    - name: legacy-blobs
      persistentVolumeClaim:
        claimName: legacy-blobs-teagramd-0
