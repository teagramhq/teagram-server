apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: teagram

resources:
  - ../base

configMapGenerator:
  - name: required-migration-version
    behavior: replace
    literals:
      - migration-version=20261102000002
  - name: db-migrations-job-revision
    behavior: merge
    literals:
      - job-name=db-migrations-c4d3c2f5019f87c0
  - name: rustfs-init-job-revision
    behavior: merge
    literals:
      - job-name=rustfs-init-e811a35bbe001c12

replacements:
  - source:
      kind: ConfigMap
      name: db-migrations-job-revision
      fieldPath: data.job-name
    targets:
      - select:
          group: batch
          version: v1
          kind: Job
          name: db-migrations
        fieldPaths:
          - metadata.name
  - source:
      kind: ConfigMap
      name: rustfs-init-job-revision
      fieldPath: data.job-name
    targets:
      - select:
          group: batch
          version: v1
          kind: Job
          name: rustfs-init
        fieldPaths:
          - metadata.name

images:
