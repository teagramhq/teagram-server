apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: teagram

resources:
  - ../base

patches:
  - path: teagramd-listeners.yaml
  - path: postgres-backup-cronjob.yaml

configMapGenerator:
  - name: required-migration-version
    behavior: replace
    literals:
      - migration-version=20261105000021
  - name: db-migrations-job-revision
    behavior: merge
    literals:
      - job-name=db-migrations-16f5dc851e0c073c
  - name: rustfs-init-job-revision
    behavior: merge
    literals:
      - job-name=rustfs-init-a28950e3aedfe596

replacements:
  - source:
      kind: ConfigMap
      name: db-migrations-job-revision
      fieldPath: data.job-name
    targets:
      - select:
          group: batch
          version: v1
          kind: Job
          name: db-migrations
        fieldPaths:
          - metadata.name
          - spec.selector.matchLabels.job-revision
          - spec.template.metadata.labels.job-revision
  - source:
      kind: ConfigMap
      name: rustfs-init-job-revision
      fieldPath: data.job-name
    targets:
      - select:
          group: batch
          version: v1
          kind: Job
          name: rustfs-init
        fieldPaths:
          - metadata.name
          - spec.selector.matchLabels.job-revision
          - spec.template.metadata.labels.job-revision

images:
  - name: ghcr.io/teagramhq/teagramd
    digest: sha256:3d5b698c730145ab7252c63e27bf95b9f2b5df161131773a1e752c1c65064797
  - name: ghcr.io/teagramhq/teagram-migrations
    digest: sha256:16f5dc851e0c073cc2c101bb6cf13ebfef7befa802aec6b8edae6ccc989f9678
  - name: ghcr.io/teagramhq/teagramd-mc-init
    digest: sha256:a28950e3aedfe596d97cf3eab3fa199855bf43ca9736cd5f81af5eb47650b966
  - name: ghcr.io/teagramhq/link-edge-landing
    digest: sha256:9d23a84630fff7e4052e3e3bf1fb3a549bc65ca2404f3786835bf6584373414d
  - name: ghcr.io/teagramhq/link-edge-selector
    digest: sha256:5ad00ea0dfca4d80428a1c81ecec06a08d35fcec8caaf04d5bfa85a55016698b
