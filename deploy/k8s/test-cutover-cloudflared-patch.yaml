spec:
  template:
    spec:
      containers:
        - name: cloudflared
          image: mirror.gcr.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args: ["exec sleep 3600"]
          env:
            - $patch: replace
          startupProbe:
            $patch: replace
            exec:
              command: ["sh", "-ec", "kill -0 1"]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          readinessProbe:
            $patch: replace
            exec:
              command: ["sh", "-ec", "kill -0 1"]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            $patch: replace
            exec:
              command: ["sh", "-ec", "kill -0 1"]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
