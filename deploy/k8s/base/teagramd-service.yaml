apiVersion: v1
kind: Service
metadata:
  name: teagramd
  labels:
    app.kubernetes.io/name: teagramd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: teagramd
  ports:
    - name: mtproto
      port: 2443
      targetPort: mtproto
    - name: websocket
      port: 2444
      targetPort: websocket
    - name: admin
      port: 2445
      targetPort: admin
    - name: bot-api
      port: 2447
      targetPort: bot-api-ingress
    - name: public-websocket
      port: 2446
      targetPort: 2446
    - name: public-bot-api
      port: 2449
      targetPort: 2449
---
apiVersion: v1
kind: Service
metadata:
  name: teagramd-headless
  labels:
    app.kubernetes.io/name: teagramd
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: teagramd
  ports:
    - name: mtproto
      port: 2443
      targetPort: mtproto
    - name: websocket
      port: 2444
      targetPort: websocket
    - name: admin
      port: 2445
      targetPort: admin
