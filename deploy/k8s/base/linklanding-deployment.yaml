apiVersion: apps/v1
kind: Deployment
metadata:
  name: linklanding
  labels:
    app.kubernetes.io/name: linklanding
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: linklanding
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linklanding
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: linklanding
          image: ghcr.io/teagramhq/link-edge-landing:unreleased
          imagePullPolicy: IfNotPresent
          args: ["-listen-address", "0.0.0.0", "-port", "8082"]
          env:
            - name: TG_INVITE_WEB_SIGNUP_URL
              valueFrom:
                configMapKeyRef:
                  name: link-edge-runtime
                  key: TG_INVITE_WEB_SIGNUP_URL
            - name: TG_INVITE_DESKTOP_URL
              valueFrom:
                configMapKeyRef:
                  name: link-edge-runtime
                  key: TG_INVITE_DESKTOP_URL
                  optional: true
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          startupProbe:
            exec:
              command: ["/usr/local/bin/linkprobe", "landing"]
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 12
          readinessProbe:
            exec:
              command: ["/usr/local/bin/linkprobe", "landing"]
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/usr/local/bin/linkprobe", "landing"]
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 150m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
