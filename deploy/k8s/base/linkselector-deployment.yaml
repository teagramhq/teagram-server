apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkselector
  labels:
    app.kubernetes.io/name: linkselector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: linkselector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linkselector
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: linkselector
          image: ghcr.io/teagramhq/link-edge-selector:unreleased
          imagePullPolicy: IfNotPresent
          args:
            - "-listen-address"
            - "0.0.0.0"
            - "-port"
            - "8081"
            - "-web-upstream"
            - "http://web:8080"
            - "-landing-upstream"
            - "http://linklanding:8082"
          env:
            - name: TG_INVITE_WEB_SIGNUP_URL
              valueFrom:
                configMapKeyRef:
                  name: link-edge-runtime
                  key: TG_INVITE_WEB_SIGNUP_URL
            - name: TG_INVITE_DESKTOP_URL
              valueFrom:
                configMapKeyRef:
                  name: link-edge-runtime
                  key: TG_INVITE_DESKTOP_URL
                  optional: true
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
