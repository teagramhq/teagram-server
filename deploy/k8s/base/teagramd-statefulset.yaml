apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: teagramd
  labels:
    app.kubernetes.io/name: teagramd
spec:
  serviceName: teagramd-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: teagramd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teagramd
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data-directories
          image: ghcr.io/teagramhq/teagram-server-busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - >-
              chown 65532:65532 /var/lib/teagramd /var/lib/teagramd-blobs;
              chmod 0700 /var/lib/teagramd /var/lib/teagramd-blobs;
              chown 0:0 /run/teagramd/blob-mode;
              chmod 0755 /run/teagramd/blob-mode
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: key-data
              mountPath: /var/lib/teagramd
            - name: legacy-blobs
              mountPath: /var/lib/teagramd-blobs
            - name: blob-mode
              mountPath: /run/teagramd/blob-mode
        - name: ensure-server-identity
          image: ghcr.io/teagramhq/teagramd:unreleased
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/teagramd", "ensure-identity"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: key-data
              mountPath: /var/lib/teagramd
        - name: wait-for-database-migrations
          image: mirror.gcr.io/library/postgres:18-alpine@sha256:3b0ef735388b2cb097fc29b8bb421d86d57d0ddbe7aa1fbd6493e06d65028503
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              required="$(cat /etc/teagramd/migrations/version)"
              case "$required" in *[!0-9]*|'') exit 1 ;; esac
              until psql -h postgres -U postgres -d teagram -tAc \
                "SELECT COALESCE(MAX(version) >= '$required', false) FROM atlas_schema_revisions.atlas_schema_revisions" |
                grep -qx t; do sleep 2; done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: required-migration-version
              mountPath: /etc/teagramd/migrations
              readOnly: true
        - name: wait-for-object-store-bootstrap
          image: ghcr.io/teagramhq/teagramd-mc-init:unreleased
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until mc alias set app http://rustfs:9000 \
                "$TG_BLOB_S3_ACCESS_KEY_ID" \
                "$(cat /run/secrets/teagramd-blob/secret-access-key)" >/dev/null 2>&1; do sleep 2; done
              until mc ls app/teagram/teagramd/ >/dev/null 2>&1; do sleep 2; done
          env:
            - name: TG_BLOB_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: teagramd-blob-credentials
                  key: TG_BLOB_S3_ACCESS_KEY_ID
            - name: HOME
              value: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: teagramd-blob-credentials
              mountPath: /run/secrets/teagramd-blob
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: teagramd
          image: ghcr.io/teagramhq/teagramd:unreleased
          imagePullPolicy: IfNotPresent
          env:
            - name: TG_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: TG_POSTGRES_DSN
            - name: TG_PUBLIC_LINK_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: teagramd-runtime
                  key: TG_PUBLIC_LINK_PREFIX
            - name: TG_ADVERTISE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: teagramd-runtime
                  key: TG_ADVERTISE_ADDR
            - name: TG_LISTEN_ADDR
              value: ":2443"
            - name: TG_LOG_LOGIN_CODES
              value: "false"
            - name: TG_REGISTRATION
              value: closed
            - name: TG_PUBLIC_REGISTRATION
              value: closed
            - name: TG_REPLICA_COUNT
              value: "1"
            - name: TG_CLIENT_ADDR_TRUST
              value: socket
            - name: TG_BLOB_S3_ENDPOINT
              value: http://rustfs:9000
            - name: TG_BLOB_S3_BUCKET
              value: teagram
            - name: TG_BLOB_S3_PREFIX
              value: teagramd/
            - name: TG_BLOB_S3_REGION
              value: us-east-1
            - name: TG_BLOB_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: teagramd-blob-credentials
                  key: TG_BLOB_S3_ACCESS_KEY_ID
            - name: TG_BLOB_S3_SECRET_ACCESS_KEY_FILE
              value: /run/secrets/teagramd-blob/secret-access-key
            - name: TG_BLOB_S3_ALLOW_INSECURE_HTTP
              value: "true"
            - name: TG_MEDIA_KEY_DIR
              # The projected Secret's versioned directory has safe directory permissions.
              value: /run/teagramd/media-keys/..data
            - name: TG_MEDIA_KEY_CURRENT
              value: "1"
            - name: TG_BLOB_DIR
              value: /var/lib/teagramd-blobs
            - name: TG_AUTHKEY_ENC_KEY_FILE
              value: /var/lib/teagramd/enc_key.hex
          ports:
            - name: mtproto
              containerPort: 2443
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: mtproto
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: mtproto
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: mtproto
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: key-data
              mountPath: /var/lib/teagramd
            - name: legacy-blobs
              mountPath: /var/lib/teagramd-blobs
              readOnly: true
            - name: blob-mode
              mountPath: /run/teagramd/blob-mode
              readOnly: true
            - name: teagramd-blob-credentials
              mountPath: /run/secrets/teagramd-blob
              readOnly: true
            - name: teagramd-media-keys
              mountPath: /run/teagramd/media-keys
              readOnly: true
      volumes:
        - name: teagramd-blob-credentials
          secret:
            secretName: teagramd-blob-credentials
            defaultMode: 0440
            items:
              - key: TG_BLOB_S3_SECRET_ACCESS_KEY
                path: secret-access-key
        - name: teagramd-media-keys
          secret:
            secretName: teagramd-media-keys
            defaultMode: 0444
            items:
              - key: 1.key
                path: 1.key
        - name: required-migration-version
          configMap:
            name: required-migration-version
            items:
              - key: migration-version
                path: version
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: key-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: legacy-blobs
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: blob-mode
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
