apiVersion: v1
kind: ConfigMap
metadata:
  name: tailscale-proxy-serve-config
  labels:
    app.kubernetes.io/name: tailscale-proxy
data:
  serve.json: |
    {
      "TCP": {
        "443": {"HTTPS": true},
        "2447": {"TCPForward": "teagramd:2447", "ProxyProtocol": 1}
      },
      "Web": {
        "teagram.tailaa4918.ts.net:443": {
          "Handlers": {
            "/": {"Proxy": "http://linkselector:8081"},
            "/apiws": {"Proxy": "http://teagramd:2444/apiws"},
            "/.well-known/teagramd/client": {"Proxy": "http://teagramd:2444/.well-known/teagramd/client"},
            "/.well-known/telegramd/client": {"Proxy": "http://teagramd:2444/.well-known/teagramd/client"},
            "/admin": {"Proxy": "http://teagramd:2445/admin"}
          }
        }
      }
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tailscale-proxy
  labels:
    app.kubernetes.io/name: tailscale-proxy
spec:
  serviceName: tailscale-proxy
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tailscale-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailscale-proxy
    spec:
      serviceAccountName: tailscale-proxy
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: serve-config
          configMap:
            name: tailscale-proxy-serve-config
        - name: tmp
          emptyDir: {}
        - name: tailscale-run
          emptyDir: {}
      containers:
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
          imagePullPolicy: IfNotPresent
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: authkey
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_HOSTNAME
              value: teagram
            - name: TS_KUBE_SECRET
              value: teagram-tailscale-state
            - name: TS_USERSPACE
              value: "true"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_SERVE_CONFIG
              value: /etc/tailscale/serve.json
            - name: TS_ENABLE_HEALTH_CHECK
              value: "true"
            - name: TS_ENABLE_METRICS
              value: "true"
            - name: TS_LOCAL_ADDR_PORT
              value: 0.0.0.0:9002
          ports:
            - name: metrics
              containerPort: 9002
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: serve-config
              mountPath: /etc/tailscale
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: tailscale-run
              mountPath: /var/run/tailscale
        - name: mtproto-forwarder
          image: mirror.gcr.io/alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
          imagePullPolicy: IfNotPresent
          command: ["socat"]
          args:
            - -d
            - -d
            - -t
            - "30"
            - TCP-LISTEN:2443,bind=127.0.0.1,reuseaddr,fork
            - TCP:teagramd:2443
          readinessProbe:
            exec:
              command: ["sh", "-ec", "kill -0 1"]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: tailscale-proxy-metrics
  labels:
    app.kubernetes.io/name: tailscale-proxy
    app.kubernetes.io/component: metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "9002"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tailscale-proxy
  ports:
    - name: metrics
      port: 9002
      targetPort: metrics
