apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-init
  labels:
    app.kubernetes.io/name: rustfs-init
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-init
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-rustfs
          image: ghcr.io/teagramhq/teagram-server-busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec", "until nc -z rustfs 9000; do sleep 2; done"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: rustfs-init
          image: ghcr.io/teagramhq/teagramd-mc-init:unreleased
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/usr/local/bin/rustfs-init.sh"]
          env:
            - name: TG_BLOB_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: teagramd-blob-credentials
                  key: TG_BLOB_S3_ACCESS_KEY_ID
            - name: HOME
              value: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: rustfs-init-secrets
              mountPath: /run/secrets
              readOnly: true
            - name: rustfs-policy
              mountPath: /policy/teagramd-blob.json
              subPath: teagramd-blob.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: rustfs-init-secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: rustfs-credentials
                  items:
                    - key: RUSTFS_ACCESS_KEY
                      path: rustfs-root-access-key
                    - key: RUSTFS_SECRET_KEY
                      path: rustfs-root-secret-key
              - secret:
                  name: teagramd-blob-credentials
                  items:
                    - key: TG_BLOB_S3_SECRET_ACCESS_KEY
                      path: teagramd-blob-secret-key
        - name: rustfs-policy
          configMap:
            name: rustfs-policy
            items:
              - key: teagramd-blob.json
                path: teagramd-blob.json
        - name: tmp
          emptyDir: {}
