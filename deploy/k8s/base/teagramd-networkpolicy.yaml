apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: teagramd-ingress
  labels:
    app.kubernetes.io/name: teagramd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: teagramd
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tailscale-proxy
      ports:
        - protocol: TCP
          port: 2443
        - protocol: TCP
          port: 2444
        - protocol: TCP
          port: 2445
        - protocol: TCP
          port: 2447
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - protocol: TCP
          port: 2446
        - protocol: TCP
          port: 2449
