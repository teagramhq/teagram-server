apiVersion: v1
kind: ServiceAccount
metadata:
  name: teagram-agent
  namespace: teagram
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teagram-agent
  namespace: teagram
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["controllerrevisions"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teagram-agent
  namespace: teagram
subjects:
  - kind: ServiceAccount
    name: teagram-agent
    namespace: teagram
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: teagram-agent
