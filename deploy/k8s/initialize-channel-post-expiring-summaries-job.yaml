apiVersion: batch/v1
kind: Job
metadata:
  generateName: expiring-summary-init-
  namespace: teagram
  labels:
    app.kubernetes.io/name: expiring-summary-init
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: expiring-summary-init
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: initialize
          image: ghcr.io/teagramhq/teagramd:unreleased
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/teagramd"]
          args: ["maintenance", "initialize-channel-post-expiring-summaries"]
          env:
            - name: TG_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: TG_POSTGRES_DSN
            - name: TG_AUTHKEY_ENC_KEY_FILE
              value: /var/lib/teagramd/enc_key.hex
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: key-data
              mountPath: /var/lib/teagramd
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: key-data
          persistentVolumeClaim:
            claimName: key-data-teagramd-0
            readOnly: true
        - name: tmp
          emptyDir: {}
