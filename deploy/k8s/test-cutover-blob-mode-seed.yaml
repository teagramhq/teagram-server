apiVersion: v1
kind: Pod
metadata:
  name: cutover-blob-mode-seed
  namespace: teagram
  labels:
    app.kubernetes.io/name: cutover-blob-mode-seed
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: seed
      image: mirror.gcr.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      imagePullPolicy: IfNotPresent
      command: ["sh", "-ec"]
      args: ["exec sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
          add: ["CHOWN", "FOWNER"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: blob-mode
          mountPath: /blob-mode
  volumes:
    - name: blob-mode
      persistentVolumeClaim:
        claimName: blob-mode-teagramd-0
