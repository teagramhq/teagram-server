apiVersion: apps/v1
kind: Deployment
metadata:
  name: teagramd-public
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: teagramd-public
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teagramd-public
    spec:
      containers:
        - name: teagramd
          image: ghcr.io/teagramhq/teagramd:test
