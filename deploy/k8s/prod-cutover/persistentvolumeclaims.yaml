apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: key-data-teagramd-0
  labels:
    app.kubernetes.io/name: teagramd
    app.kubernetes.io/component: identity
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: legacy-blobs-teagramd-0
  labels:
    app.kubernetes.io/name: teagramd
    app.kubernetes.io/component: legacy-blobs
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blob-mode-teagramd-0
  labels:
    app.kubernetes.io/name: teagramd
    app.kubernetes.io/component: blob-mode
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
