apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: teagram

resources:
  - ../prod
  - persistentvolumeclaims.yaml
  - volume-importer.yaml
  - https://github.com/teagramhq/teagram-web//deploy/k8s/base?ref=6947c892793562a8413d59cc741a123fe728da5d&timeout=120&submodules=false
  - web-service.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: teagramd
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cloudflared
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      group: batch
      version: v1
      kind: Job
      labelSelector: app.kubernetes.io/name=db-migrations
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
  - path: postgres-backup-cronjob.yaml
images:
  - name: ghcr.io/teagramhq/teagramd
    digest: sha256:3d5b698c730145ab7252c63e27bf95b9f2b5df161131773a1e752c1c65064797
  - name: ghcr.io/teagramhq/teagram-web
    digest: sha256:c8cf857aab04e01f6bc943072043359fc20792e955e2b16d73cce8ca06c5ca5e
