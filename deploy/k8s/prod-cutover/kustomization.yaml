apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: teagram

resources:
  - ../prod
  - persistentvolumeclaims.yaml
  - volume-importer.yaml
  - local-blob-migration-job.yaml
  - https://github.com/teagramhq/teagram-web//deploy/k8s/base?ref=6947c892793562a8413d59cc741a123fe728da5d&timeout=120&submodules=false
  - web-service.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: teagramd
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cloudflared
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      group: batch
      version: v1
      kind: Job
      labelSelector: app.kubernetes.io/name=db-migrations
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
  - target:
      group: batch
      version: v1
      kind: Job
      name: local-blob-migration
    patch: |-
      - op: add
        path: /spec/suspend
        value: true

images:
  - name: ghcr.io/teagramhq/teagramd
    digest: sha256:b378de8308e246f3c1ac80b3fed964d195a096f16dd25d273e340c1f75ab9a01
  - name: ghcr.io/teagramhq/teagram-web
    digest: sha256:c8cf857aab04e01f6bc943072043359fc20792e955e2b16d73cce8ca06c5ca5e
