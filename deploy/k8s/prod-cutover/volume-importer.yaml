apiVersion: v1
kind: Pod
metadata:
  name: cutover-volume-importer
  labels:
    app.kubernetes.io/name: teagram-cutover
    app.kubernetes.io/component: volume-importer
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: importer
      image: mirror.gcr.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      imagePullPolicy: IfNotPresent
      command: ["sh", "-ec", "sleep 86400"]
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
          add: ["CHOWN", "FOWNER"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: key-data
          mountPath: /target/key-data
        - name: legacy-blobs
          mountPath: /target/legacy-blobs
        - name: blob-mode
          mountPath: /target/blob-mode
  volumes:
    - name: key-data
      persistentVolumeClaim:
        claimName: key-data-teagramd-0
    - name: legacy-blobs
      persistentVolumeClaim:
        claimName: legacy-blobs-teagramd-0
    - name: blob-mode
      persistentVolumeClaim:
        claimName: blob-mode-teagramd-0
